<title>電脳奉納試合 展示案内</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Maru+Gothic:wght@500;700&family=Orbitron:wght@500;700&display=swap">
<style>
/* 一画面の案内端末。左に会話、右に「よくある質問」。夜の電脳神社（ゲームと同じ世界）で統一した暗い一色の見た目 */
:root {
  --ink: #070816;        /* 夜空 */
  --panel: #0e1128;      /* 札の地 */
  --panel-2: #141838;
  --line: #262c55;
  --text: #ecf0ff;
  --muted: #98a4c8;
  --shu: #ff4a6b;        /* 朱（鳥居・P1） */
  --cyan: #3ff0ff;       /* 電脳（P2） */
  --gold: #ffd24a;       /* 金（おみくじ） */
  --font-display: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --font-en: "Orbitron", "Segoe UI", system-ui, sans-serif;
  --fs: 17px;
  color-scheme: dark;
}
:root.big { --fs: 21px; }
[hidden] { display: none !important; }   /* ファイルを直接開いたときも、隠した物はきちんと隠す */
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--text); font-family: var(--font-body); font-size: var(--fs); line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
}
body::after {   /* 背景のごく薄い格子（ゲームの参道の床と同じ意匠） */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background:
    radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb, var(--shu) 14%, transparent), transparent 70%),
    radial-gradient(900px 500px at -10% 110%, color-mix(in srgb, var(--cyan) 10%, transparent), transparent 70%),
    linear-gradient(transparent 31px, color-mix(in srgb, var(--line) 45%, transparent) 32px) 0 0 / 100% 32px;
}
.app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 14px; padding-block: 14px; max-width: 1280px; margin: 0 auto; }

/* ---- 上の帯 ---- */
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mark { width: 46px; height: 40px; flex: none; }
.brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 1.5em; letter-spacing: .06em; text-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 55%, transparent); }
.brand span { color: var(--muted); font-size: .78em; }
.tools { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; color: inherit; cursor: pointer; }
.tool {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .8em; color: var(--muted);
}
.tool:hover, .tool:focus-visible { color: var(--text); border-color: var(--cyan); outline: none; }
.tool[aria-pressed="true"] { color: var(--ink); background: var(--cyan); border-color: var(--cyan); }

/* ---- 本体 ---- */
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; min-height: 0; }

.chat { display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); min-height: 0; background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.log { overflow-y: auto; padding: 22px 22px 8px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .log { scroll-behavior: auto; } }

.msg { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; max-width: 860px; }
.msg.me { grid-template-columns: minmax(0, 1fr); justify-items: end; margin-left: auto; }
.av { width: 44px; height: 44px; border-radius: 12px; background: var(--panel-2); border: 1px solid color-mix(in srgb, var(--shu) 60%, var(--line)); display: grid; place-items: center; }
.bubble { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 12px 16px; min-width: 0; overflow-wrap: anywhere; }
.me .bubble { background: color-mix(in srgb, var(--cyan) 14%, var(--panel)); border-color: color-mix(in srgb, var(--cyan) 40%, var(--line)); border-radius: 14px 4px 14px 14px; }
.who { font-family: var(--font-display); font-size: .78em; color: var(--shu); letter-spacing: .08em; margin-bottom: 2px; display: flex; gap: 10px; align-items: baseline; }
.src { font-family: var(--font-body); color: var(--muted); font-size: .85em; letter-spacing: 0; }
.bubble p { margin: 0 0 .55em; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: .2em 0 .6em; padding-left: 1.2em; } .bubble li { margin: .15em 0; }
.bubble li::marker { color: var(--shu); }
.bubble strong { color: var(--gold); font-weight: 700; }
.related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  background: transparent; border: 1px solid color-mix(in srgb, var(--cyan) 45%, var(--line)); color: var(--cyan);
  border-radius: 999px; padding: 5px 13px; font-size: .82em; line-height: 1.4; text-align: left;
}
.chip:hover, .chip:focus-visible { background: color-mix(in srgb, var(--cyan) 16%, transparent); outline: none; }
.dots { display: inline-flex; gap: 6px; padding: 6px 2px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: .7; } }

/* はじめの案内カード: 1/60 秒の流れ */
.intro { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: color-mix(in srgb, var(--ink) 55%, transparent); margin-top: 10px; }
.intro h3 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: .9em; color: var(--gold); letter-spacing: .06em; }
.loop { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .loop { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--panel); transition: border-color .3s, box-shadow .3s; }
.step b { display: block; font-family: var(--font-en); font-size: .7em; color: var(--muted); letter-spacing: .1em; }
.step span { font-size: .85em; }
.step.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 18px color-mix(in srgb, var(--cyan) 35%, transparent); }
.intro small { display: block; color: var(--muted); font-size: .78em; margin-top: 8px; }

/* 入力欄 */
form { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
#q {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
#q:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cyan) 22%, transparent); }
#send { background: var(--shu); color: #fff; border: 0; border-radius: 10px; padding: 0 22px; font-weight: 700; letter-spacing: .08em; }
#send:disabled { opacity: .45; cursor: default; }
#send:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* 右: よくある質問 */
.side { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 2px; }
.group { background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.group h2 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: .86em; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.group h2::before { content: ""; width: 10px; height: 10px; border: 2px solid var(--shu); border-radius: 2px; transform: rotate(45deg); }
.qs { display: flex; flex-direction: column; gap: 6px; }
.q {
  text-align: left; background: var(--panel-2); border: 1px solid transparent; border-radius: 9px; padding: 8px 12px; font-size: .86em; line-height: 1.5;
}
.q:hover, .q:focus-visible { border-color: var(--cyan); outline: none; }
.mobileqs { display: none; padding: 0 12px 10px; gap: 8px; overflow-x: auto; background: var(--panel); }
@media (max-width: 900px) { .mobileqs { display: flex; } .mobileqs .chip { white-space: nowrap; } }

/* 幅が狭い画面: よくある質問は入力欄の上の横並びにする */
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .brand span { display: none; }
  .log { padding: 16px 14px 8px; }
  .msg { grid-template-columns: 36px minmax(0, 1fr); gap: 8px; }
  .av { width: 36px; height: 36px; }
}
/* 係の人の設定（ふだんは隠れている） */
.staff { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 80%, transparent); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 20px 22px; display: grid; gap: 14px; font-size: .9em; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.15em; color: var(--gold); letter-spacing: .06em; }
.sheet label { display: grid; gap: 4px; color: var(--muted); font-size: .9em; }
.sheet input, .sheet select { font: inherit; font-size: 1.05em; color: var(--text); background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.sheet input:focus, .sheet select:focus { outline: none; border-color: var(--cyan); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
.btn:hover, .btn:focus-visible { border-color: var(--cyan); outline: none; }
.btn.main { background: var(--shu); border-color: var(--shu); color: #fff; font-weight: 700; }
.stat { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; background: var(--ink); border-radius: 8px; padding: 10px 12px; font-variant-numeric: tabular-nums; }
.stat dt { color: var(--muted); } .stat dd { margin: 0; }
.note { color: var(--muted); font-size: .85em; margin: 0; }
.warn { color: var(--gold); }
/* 放っておかれたら最初に戻る */
.idle { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 5;
  background: var(--panel-2); border: 1px solid var(--gold); color: var(--text); border-radius: 999px; padding: 8px 18px; font-size: .85em; }
.idle button { margin-left: 10px; background: var(--gold); color: var(--ink); border: 0; border-radius: 999px; padding: 2px 12px; font-weight: 700; }
</style>

<div class="app">
  <header>
    <svg class="mark" viewBox="0 0 46 40" aria-hidden="true">
      <path d="M3 8 Q23 3 43 8 L43 12 Q23 8 3 12 Z" fill="var(--shu)"/>
      <rect x="7" y="16" width="32" height="3.5" fill="var(--shu)"/>
      <rect x="11" y="10" width="4" height="29" fill="var(--shu)"/>
      <rect x="31" y="10" width="4" height="29" fill="var(--shu)"/>
      <rect x="21.5" y="12" width="3" height="5" fill="var(--shu)"/>
      <path d="M3 8 Q23 3 43 8" fill="none" stroke="var(--cyan)" stroke-width="1" opacity=".7"/>
    </svg>
    <div class="brand"><b>電脳奉納試合</b><span>展示案内 ― このゲームがどうやって動いているか、なんでも聞いてください</span></div>
    <div class="tools">
      <button class="tool" id="big" aria-pressed="false" type="button">文字を大きく</button>
      <button class="tool" id="reset" type="button">最初から</button>
    </div>
  </header>

  <main>
    <section class="chat" aria-label="案内係との会話">
      <div class="log" id="log" aria-live="polite"></div>
      <div>
        <div class="mobileqs" id="mobileqs"></div>
        <form id="f" autocomplete="off">
          <input id="q" type="text" maxlength="120" placeholder="例: キャラクターの絵はどうやって描いているの？" aria-label="質問を入力">
          <button id="send" type="submit">聞く</button>
        </form>
      </div>
    </section>
    <aside class="side" id="side" aria-label="よくある質問"></aside>
  </main>
</div>
<div class="staff" id="staff" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stTitle">
    <h2 id="stTitle">係の人の設定</h2>
    <div id="stLock" hidden>
      <label for="stPinIn">暗証番号<input id="stPinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
      <div class="row" style="margin-top:10px"><button class="btn main" id="stUnlock" type="button">開く</button><button class="btn" data-close type="button">閉じる</button></div>
      <p class="note" id="stPinMsg"></p>
    </div>
    <div id="stBody" hidden>
      <dl class="stat" id="stState"></dl>
      <label for="stProv">使う AI<select id="stProv"></select></label>
      <p class="note" id="stHelp"></p>
      <label for="stKey" id="stKeyRow">API キー（このパソコンのブラウザにだけ保存されます）<input id="stKey" type="password" autocomplete="off" spellcheck="false"></label>
      <label for="stModel" id="stModelRow">モデル名<input id="stModel" type="text" autocomplete="off" spellcheck="false" list="stModels"><datalist id="stModels"></datalist></label>
      <label for="stUrl" id="stUrlRow">Ollama の場所<input id="stUrl" type="text" autocomplete="off" spellcheck="false"></label>
      <label for="stPin">暗証番号（この画面を開くときに聞く。空なら聞かない）<input id="stPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
      <div class="row">
        <button class="btn main" id="stSave" type="button">保存</button>
        <button class="btn" id="stTest" type="button">つながるか試す</button>
        <button class="btn" id="stClear" type="button">キーを消す</button>
        <button class="btn" data-close type="button">閉じる</button>
      </div>
      <p class="note" id="stMsg"></p>
      <dl class="stat" id="stUsage"></dl>
      <p class="note">展示が終わったら「キーを消す」を押し、キーを作ったサイトでも無効にしてください。連投の制限（待ち時間・回数）はファイルの <code>LIMITS</code> で変えられます。</p>
    </div>
  </div>
</div>
<div class="idle" id="idle" hidden><span id="idleMsg"></span><button type="button" id="stay">続ける</button></div>

<script>
/* ===================================================================
 * 展示の情報（係の人が書き換える欄）。空のままなら「係の人に聞いてください」と答えます
 * =================================================================== */
const EXHIBIT = {
  place: '',      /* 例: 2年3組の教室 */
  hours: '',      /* 例: 10:00〜15:00 */
  creator: '',    /* 例: 2年3組 ○○ */
  play: ''        /* 遊び方の決まり。例: 1回2試合まで・並んでいる人がいたら交代 */
};

/* ===================================================================
 * 案内のもとになる知識。AI もこの内容だけをもとに答えます。
 * keys: 質問に含まれていたらこの話題とみなす言葉
 * =================================================================== */
const KB = [
  { id: 'about', cat: 'ゲームのこと', q: 'これはどんなゲーム？',
    keys: ['どんな', 'なに', '何の', 'ゲーム', '概要', 'これ', '内容', 'ジャンル', '格闘', '格ゲー'],
    a: '「電脳奉納試合」は、**2人で向かい合って戦う2D格闘ゲーム**です。舞台は、ネオンが光る「電脳空間の神社」。巫女や狛犬、天狗、河童など、神社や昔話でおなじみのものたちが、デジタルの存在になって腕比べをします。\n\nパンチやキックのような攻撃と必殺技を出し合い、相手の体力を先になくした方が勝ちです。インターネットの画面（ブラウザ）だけで動くゲームとして、生徒が作りました。' },
  { id: 'name', cat: 'ゲームのこと', q: '「奉納試合」ってどういう意味？',
    keys: ['奉納', '名前', 'タイトル', '意味', '電脳', 'サイバー', '神社'],
    a: '**奉納試合**は、神社のお祭りで神様に見ていただくために行う試合のことです（奉納相撲や奉納演武など）。\n\nこのゲームでは、それを「電脳＝コンピューターの中の神社」で行う、という設定にしています。キャラクターも狛犬や巫女、招き猫などを「AI」「バグ」「ウイルス」風にアレンジしていて、昔ながらのものと電子の世界を混ぜた見た目が特徴です。' },
  { id: 'chars', cat: 'ゲームのこと', q: 'どんなキャラクターがいるの？',
    keys: ['キャラ', '登場', '何人', '種類', '巫女', '狛犬', '鬼', '狐', '天狗', '招き猫', '提灯', '河童', '鶴', '白虎'],
    a: '全部で**10人**います。それぞれ戦い方の個性がちがいます。\n・電脳巫女（バランス型）・狛犬AI（突進型）・404鬼（パワー型）\n・無限ループ狐（すばやい）・電脳天狗（空中・遠距離）・招き猫Bot（投げ・一発逆転）\n・提灯お化け（ため撃ち）・河童ウイルス（罠・毒）・白鶴（途中で姿が変わる）・白虎（追い込み型）\n\nキャラクターは全員「影絵（シルエット）＋ネオンのふち取り」で描いていて、1人目が赤、2人目が水色に光ります。' },
  { id: 'loop', cat: '動くしくみ', q: 'ゲームはどうやって動いているの？',
    keys: ['動いて', '動く', '仕組み', 'しくみ', 'どうやって', '原理', 'フレーム', '60', '計算'],
    a: 'ゲームは**1秒間に60回**、同じ手順をくり返しています。\n・ボタンやスティックの入力を読む\n・キャラクターの動きを計算する（歩く、跳ぶ、技を出す）\n・攻撃が当たったかを調べ、体力を減らす\n・その結果を画面に描く\n\nこの1回分を「フレーム」と呼びます。60分の1秒ごとに絵を描き直すので、パラパラ漫画のようになめらかに動いて見えます。技の速さや強さも「何フレームで出るか」で細かく決めています。' },
  { id: 'art', cat: '動くしくみ', q: 'キャラクターの絵はどうやって描いているの？',
    keys: ['絵', '描', 'グラフィック', '画像', 'イラスト', 'シルエット', '見た目', 'アニメ', 'デザイン', 'ネオン'],
    a: '実はこのゲームには、**画像ファイルが1枚もありません**。キャラクターも背景も、すべてプログラムが毎回その場で描いています。\n\nキャラクターは、人形のように「頭・胴・腕・脚」の関節を持った骨組みがあり、そこに衣装の形（袖、尻尾、羽など）を重ねて、黒い影絵として描きます。ポーズは関節の角度を少しずつ変えて作るので、絵を何十枚も用意しなくても動きを作れます。最後に、ふちをネオンのように光らせています。' },
  { id: 'hitbox', cat: '動くしくみ', q: '攻撃が「当たった」はどう決めているの？',
    keys: ['当たり', '当たった', '判定', 'ヒット', 'ガード', 'ダメージ', '体力'],
    a: '目には見えない**四角い枠**で決めています。キャラクターの体には「ここを打たれたら当たり」という枠、技には「ここが攻撃の届く範囲」という枠があり、2つが重なったら命中です。\n\n相手が後ろに下がって守っていれば「ガード」になり、ダメージがほとんど入りません。練習モードでは、この枠を色つきで画面に出すこともできます（緑が体、赤が攻撃）。' },
  { id: 'sound', cat: '動くしくみ', q: '音や音楽はどうしているの？',
    keys: ['音', 'BGM', '音楽', '効果音', 'サウンド', '曲'],

const $ = id => document.getElementById(id);

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
/* かんたんな書式: **太字**、「・」「- 」で始まる行は箇条書き、空行で段落 */
function render(text) {
  const blocks = String(text).trim().split(/\n\s*\n/);
  return blocks.map(b => {
    const lines = b.split('\n').map(s => s.trim()).filter(Boolean);
    const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const isLi = s => /^(・|- |\* |• )/.test(s);
    let html = '', list = [];
    const flush = () => { if (list.length) { html += '<ul>' + list.map(s => '<li>' + inl(s.replace(/^(・|- |\* |• )/, '')) + '</li>').join('') + '</ul>'; list = []; } };
    const para = [];
    for (const s of lines) {
      if (isLi(s)) { if (para.length) { html += '<p>' + para.map(inl).join('<br>') + '</p>'; para.length = 0; } list.push(s); }
      else { flush(); para.push(s); }
    }
    if (para.length) html += '<p>' + para.map(inl).join('<br>') + '</p>';
    flush();
    return html;
  }).join('');
}

 *   1) AI（Claude）が使えるときは、上の知識だけをもとに会話で答える
 *   2) 使えないとき（ネットがない・許可されていない）は、知識から一番近い答えを出す
 * =================================================================== */
function score(text, k) {
  const t = text.toLowerCase(); let s = 0;
  k.keys.forEach(w => { if (t.indexOf(w.toLowerCase()) >= 0) s += w.length >= 3 ? 2 : 1; });
  if (t.indexOf(k.q.replace(/[？?]/g, '').toLowerCase()) >= 0) s += 5;
  return s;
}
function bestTopics(text, n) {
  return KB.map(k => ({ k, s: score(text, k) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, n).map(x => x.k);
}
function related(text, exclude) {
  const got = bestTopics(text, 6).map(k => k.id).filter(id => id !== exclude);
  const fill = ['loop', 'art', 'online', 'make', 'cpu', 'safety'];
  for (const id of fill) { if (got.length >= 3) break; if (got.indexOf(id) < 0 && id !== exclude) got.push(id); }
  return got.slice(0, 3);
}
function offlineAnswer(text, id) {
  const k = id ? KB.find(x => x.id === id) : bestTopics(text, 1)[0];
  if (k) return { text: k.a, id: k.id };

  provider: 'gemini', keys: {}, models: {}, ollamaUrl: 'http://localhost:11434', pin: '', off: false,   /* はじめは Gemini（キーを入れるまでは用意した答えだけ） */
  load() {
    try {
      const o = JSON.parse(localStorage.getItem('guide-staff') || '{}');
      if (o.key && !o.keys) { o.keys = { claude: o.key }; o.provider = 'claude'; o.models = { claude: o.model }; }   /* 前の形式 */
      this.provider = PROVIDERS[o.provider] ? o.provider : 'gemini';
      this.keys = o.keys || {}; this.models = o.models || {}; this.ollamaUrl = o.ollamaUrl || this.ollamaUrl; this.pin = o.pin || '';
    } catch (e) { }
  },
  save() { try { localStorage.setItem('guide-staff', JSON.stringify({ provider: this.provider, keys: this.keys, models: this.models, ollamaUrl: this.ollamaUrl, pin: this.pin })); } catch (e) { } },
  model() { return this.models[this.provider] || (PROVIDERS[this.provider] || {}).model || ''; },
  key() { return this.keys[this.provider] || ''; },
  /* この設定で AI を呼べるか */
  ready() {
    const P = PROVIDERS[this.provider];
    if (this.off || !P || this.provider === 'none') return false;
    return P.key ? !!this.key() : true;
  }
};
Staff.load();
/* 使った量（その日の分。料金は Claude のときだけ目安を出す） */
const Usage = {
  get() {
    const day = new Date().toISOString().slice(0, 10);
    let o = null; try { o = JSON.parse(localStorage.getItem('guide-usage') || 'null'); } catch (e) { }
    return o && o.day === day ? o : { day: day, calls: 0, inp: 0, out: 0, cw: 0, cr: 0, usd: 0 };
  },
  add(inp, out, cw, cr, usd) {
    const o = this.get();
    o.calls++; o.inp += inp || 0; o.out += out || 0; o.cw += cw || 0; o.cr += cr || 0; o.usd += usd || 0;
    try { localStorage.setItem('guide-usage', JSON.stringify(o)); } catch (e) { }
  }
};
/* ストリームを 1行ずつ読む（SSE も NDJSON も） */
async function readLines(res, onLine) {
  const rd = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const r = await rd.read();
    if (r.done) break;
    buf += dec.decode(r.value, { stream: true }).replace(/\r/g, '');
    let i;
    while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) onLine(line); }
  }
  if (buf.trim()) onLine(buf.trim());
}
const Api = {
  fallbacks: true, lastError: '',
  /* system: 決まりの文と知識。messages: {role:'user'|'assistant', content} の列（user で始まり user で終わる） */
  async ask(system, messages, onText, signal) {
    const p = Staff.provider;
    const r = p === 'gemini' ? await this.gemini(system, messages, onText, signal)
      : p === 'ollama' ? await this.ollama(system, messages, onText, signal)
      : await this.claude(system, messages, onText, signal);
    if (!r.text.trim()) throw { code: 'empty' };
    this.lastError = '';
    return r;
  },
  async fail(res, name) {
    const t = await res.text().catch(() => '');
    this.lastError = name + ' ' + res.status + ' ' + t.slice(0, 160);
    throw { code: 'http_' + res.status, status: res.status, body: t };
  },
  /* ---- Claude（Anthropic API）---- */
  async claude(system, messages, onText, signal, retried) {
    const model = Staff.model(), opus = model.indexOf('opus') >= 0;
    const body = {
      model: model, max_tokens: 4000, stream: true,
      system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral', ttl: '1h' } }],   /* 毎回同じ → キャッシュで安く */
      messages: messages,
      output_config: { effort: 'low' }   /* 案内の答えに深い考えはいらない（使う量も減る） */
    };
    const headers = { 'content-type': 'application/json', 'x-api-key': Staff.key(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
    if (opus && this.fallbacks) { body.fallbacks = 'default'; headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; }
    const res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: headers, body: JSON.stringify(body), signal: signal });
    if (!res.ok) {
      if (res.status === 400 && body.fallbacks && !retried) {
        const t = await res.clone().text().catch(() => '');
        if (/fallback/i.test(t)) { this.fallbacks = false; return this.claude(system, messages, onText, signal, true); }
      }
      await this.fail(res, 'Claude');
    }
    let text = '', stop = '', usage = {};
    await readLines(res, line => {
      if (line.indexOf('data:') !== 0) return;
      let ev = null; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
      if (ev.type === 'message_start' && ev.message && ev.message.usage) Object.assign(usage, ev.message.usage);
      else if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') { text += ev.delta.text; onText(text); }
      else if (ev.type === 'message_delta') { if (ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason; if (ev.usage) Object.assign(usage, ev.usage); }
      else if (ev.type === 'error') { this.lastError = 'Claude ' + ((ev.error && ev.error.type) || 'stream error'); throw { code: 'stream_error' }; }
    });
    const M = CLAUDE_PRICE[model] || CLAUDE_PRICE['claude-opus-5-5'];
    const inp = usage.input_tokens || 0, out = usage.output_tokens || 0, cw = usage.cache_creation_input_tokens || 0, cr = usage.cache_read_input_tokens || 0;
    /* 1時間キャッシュの書き込みは入力の2倍、読み出しは入力の1割 */
    Usage.add(inp, out, cw, cr, (inp * M.inp + out * M.out + cw * M.inp * 2 + cr * M.inp * 0.1) / 1e6);
    if (stop === 'refusal') throw { code: 'refusal' };
    return { text: text, truncated: stop === 'max_tokens' };
  },
  /* ---- Gemini（Google AI Studio の API キー。無料枠あり）---- */
  async gemini(system, messages, onText, signal) {
    const model = Staff.model();
    const body = {
      systemInstruction: { parts: [{ text: system }] },
      contents: messages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
      generationConfig: { maxOutputTokens: 4000 }
    };
    const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse';
    const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': Staff.key() }, body: JSON.stringify(body), signal: signal });
    if (!res.ok) await this.fail(res, 'Gemini');
    let text = '', finish = '', inp = 0, out = 0;
    await readLines(res, line => {
      if (line.indexOf('data:') !== 0) return;
      let ev = null; try { ev = JSON.parse(line.slice(5).trim()); } catch (e) { return; }
      const c = ev.candidates && ev.candidates[0];
      if (c && c.content && c.content.parts) c.content.parts.forEach(pt => { if (pt.text && !pt.thought) { text += pt.text; onText(text); } });
      if (c && c.finishReason) finish = c.finishReason;
      if (ev.usageMetadata) { inp = ev.usageMetadata.promptTokenCount || inp; out = ev.usageMetadata.candidatesTokenCount || out; }
    });
    Usage.add(inp, out, 0, 0, 0);
    if (!text && /SAFETY|BLOCK|PROHIBITED/.test(finish)) throw { code: 'refusal' };
    return { text: text, truncated: finish === 'MAX_TOKENS' };
  },
  /* ---- ローカルAI（Ollama。このパソコンの中で動く）---- */
  async ollama(system, messages, onText, signal) {
    const body = {
      model: Staff.model(), stream: true,
      messages: [{ role: 'system', content: system }].concat(messages),
      options: { num_ctx: 8192, num_predict: 900 }   /* 知識が全部入る長さ・答えは短め */
    };
    let res;
    try { res = await fetch(Staff.ollamaUrl.replace(/\/$/, '') + '/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: signal }); }
    catch (e) { if (e && e.name === 'AbortError') throw e; this.lastError = 'Ollama につながりません（起動しているか・OLLAMA_ORIGINS を確かめてください）'; throw { code: 'network' }; }
    if (!res.ok) await this.fail(res, 'Ollama');
    let text = '', inp = 0, out = 0;
    await readLines(res, line => {
      let ev = null; try { ev = JSON.parse(line); } catch (e) { return; }
      if (ev.error) { this.lastError = 'Ollama ' + ev.error; throw { code: 'stream_error' }; }
      if (ev.message && ev.message.content) { text += ev.message.content; onText(text); }
      if (ev.done) { inp = ev.prompt_eval_count || 0; out = ev.eval_count || 0; }
    });
    Usage.add(inp, out, 0, 0, 0);
    return { text: text, truncated: false };
  }
};
/* AI で答えられるか（展示用パソコンの設定 / claude.ai の中で許可されている） */
function aiReady() { return Staff.ready() || (!!sample && aiOk); }

let sample = null, aiOk = true, busy = false, ctl = null;
const turns = [];   /* AI との会話（最近の分だけ送る） */
(async () => {
  try { if (window.claude && claude.use) sample = await claude.use('sample'); } catch (e) { sample = null; }
})();

async function ask(text, id) {
  text = String(text || '').trim().slice(0, 120);
  if (!text || busy) return;
  /* 書いて送る質問は、待ち時間が終わるまで送れない（ボタンの質問はいつでも） */
  if (!id && Date.now() < nextAt) return;
  bump();
  busy = true; $('send').disabled = true;
  addMe(text);
  /* AI を使うのは「用意した答えでは足りない、自由に書いた質問」だけ。
   * ボタンの質問・はっきり当てはまる話題がある・同じ質問をくり返した・回数の上限 → 用意した答え */
  const key = norm(text), top = bestTopics(text, 1)[0], strong = top && score(text, top) >= 4;
  const cached = !id && answerCache.get(key);
  const block = aiBlock();
  if (id || !aiReady() || strong || cached || block) {
    let r = cached ? { text: cached, id: null } : offlineAnswer(text, id);
    let label = id ? '' : cached ? '前と同じ質問への答え' : '案内データから回答';
    if (!id && !cached && !strong && aiReady() && block) {
      r = { text: (block === 'visitor' ? 'AIへの質問はここまでにさせてください（次の方の分を残すため）。' : 'いまAIの案内係は少し休憩中です。') + '用意した答えからお答えします。\n\n' + r.text, id: r.id };
    }
    const node = addBot('<span class="dots"><i></i><i></i><i></i></span>', label);
    await new Promise(res => setTimeout(res, 380));
    node.querySelector('.body').innerHTML = render(r.text);
    relatedChips(node, related(text + ' ' + r.text, r.id));
    turns.push({ role: 'user', content: text }, { role: 'assistant', content: r.text.replace(/\*\*/g, '') });
    done(!id); return;
  }
  aiUsed++; noteAi();
  const node = addBot('<span class="dots"><i></i><i></i><i></i></span>', 'AI が回答');
  const body = node.querySelector('.body');
  ctl = new AbortController();
  /* 送る量を減らす: 直前の 2往復だけ、長い答えは切る */
  const recent = turns.slice(-4).map(t => ({ role: t.role, content: t.content.slice(0, 300) }));
  const show = t => { body.innerHTML = render(t); scrollDown(); };
  try {
    let res;
    if (Staff.ready()) {
      /* 展示用パソコン: 選んだ AI に直接（決まりの文は system に置く） */
      res = await Api.ask(RULES(), recent.concat([{ role: 'user', content: text }]), show, ctl.signal);
    } else {
      /* claude.ai の中で開いたとき: 決まりの文 → 最近の会話 → 今の質問（user で始まり user で終わる） */
      const input = [{ role: 'user', content: RULES() }].concat(recent, [{ role: 'user', content: text }]);
      res = await sample(input, { modelTier: 'quick', cache: false, signal: ctl.signal, onText: ({ text: t }) => show(t) });
    }
    body.innerHTML = render(res.text);
    relatedChips(node, related(text + ' ' + res.text, null));
    turns.push({ role: 'user', content: text }, { role: 'assistant', content: res.text });
    answerCache.set(key, res.text);
  } catch (e) {
    if (e && (e.code === 'cancelled' || e.name === 'AbortError')) { done(); return; }
    /* AI が使えない・混んでいるときは、用意した答えで代わりに答える */
    /* キーがまちがっている → このページを開いている間は AI を使わない（係の人の設定に理由が出る） */
    if (e && (e.status === 401 || e.status === 403 || (e.status === 400 && /API_KEY|api key/i.test(e.body || '')))) { Api.lastError = 'API キーが使えません（' + e.status + '）'; Staff.off = true; }
    if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].indexOf(e.code) >= 0) aiOk = false;
    const r = offlineAnswer(text, null);
    node.querySelector('.src').textContent = '案内データから回答';
    body.innerHTML = render(r.text);
    relatedChips(node, related(text + ' ' + r.text, r.id));
    turns.push({ role: 'user', content: text }, { role: 'assistant', content: r.text.replace(/\*\*/g, '') });
  }
  done(true);
}
function done(cool) { busy = false; ctl = null; if (cool) startCool(); else if (Date.now() >= nextAt) { $('send').disabled = false; $('send').textContent = '聞く'; } }

/* ===================================================================
 * 端末として: 最初から / 文字の大きさ / しばらく触られなければ最初に戻る
 * =================================================================== */
function start() {
  if (ctl) { try { ctl.abort(); } catch (e) { } }
  busy = false; turns.length = 0; aiUsed = 0;
  if (Date.now() >= nextAt) { $('send').disabled = false; $('send').textContent = '聞く'; }
  log.innerHTML = '';
  const n = addBot(render(GREETING) + introCard());
  relatedChips(n, ['loop', 'art', 'make']);
  animateLoop();
  $('q').value = '';
  log.scrollTop = 0;
}
$('f').addEventListener('submit', e => { e.preventDefault(); const v = $('q').value; $('q').value = ''; ask(v, null); });
$('reset').onclick = () => { start(); $('q').focus(); };
$('big').onclick = () => {

try { if (localStorage.getItem('guide-big')) { document.documentElement.classList.add('big'); $('big').setAttribute('aria-pressed', 'true'); } } catch (e) { }

/* 2分さわられなかったら「最初に戻ります」を出し、さらに15秒で次の方のために最初に戻す */
const IDLE = 120, WARN = 15;
let idleS = 0;
function bump() { idleS = 0; $('idle').hidden = true; }
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => window.addEventListener(ev, bump, { passive: true }));
$('stay').onclick = bump;
setInterval(() => {
  if (turns.length === 0 && !busy) { idleS = 0; return; }   /* 最初の画面のままなら何もしない */
  idleS++;
  if (idleS >= IDLE + WARN) { bump(); start(); return; }
  if (idleS >= IDLE) { $('idle').hidden = false; $('idleMsg').textContent = 'あと ' + (IDLE + WARN - idleS) + ' 秒で、次の方のために最初の画面に戻ります'; }
}, 1000);

/* ---- 係の人の設定画面 ---- */
const St = {
  open() {
    $('staff').hidden = false;
    const locked = !!Staff.pin;
    $('stLock').hidden = !locked; $('stBody').hidden = locked;
    if (locked) { $('stPinIn').value = ''; $('stPinMsg').textContent = ''; $('stPinIn').focus(); } else this.fill();
  },
  close() { $('staff').hidden = true; },
  HELP: {
    none: '用意した答えだけで答えます（AI の費用はかかりません）。',
    gemini: 'Google AI Studio（aistudio.google.com）で「Get API key」からキーを作って貼ってください。無料枠の範囲なら料金はかかりません（1日・1分あたりの回数に上限があり、超えると用意した答えで返します）。無料枠では、送った質問が Google のサービス改善に使われることがあります。',
    ollama: 'このパソコンに Ollama（ollama.com）を入れ、モデルを入れておきます（例: コマンドで ollama pull gemma3:4b）。ネットも料金も不要ですが、メモリ 8GB 以上・できれば GPU のあるパソコン向けです。つながらないときは、環境変数 OLLAMA_ORIGINS に * を設定して Ollama を起動し直してください。',
    claude: 'Anthropic Console（console.anthropic.com）で API キーを作って貼ってください。有料です。Console で月の使用上限を低めに決めておくと安心です。'
  },
  MODEL_LIST: { gemini: ['gemini-flash-latest', 'gemini-flash-lite-latest', 'gemini-2.5-flash'], ollama: ['gemma3:4b', 'qwen2.5:7b', 'llama3.2:3b'], claude: ['claude-opus-5-5', 'claude-haiku-5-5'] },
  /* 使う AI を変えたときの欄の出し入れ */
  shape() {

    $('stState').innerHTML = '<dt>いまの答え方</dt><dd>' + esc(mode) + '</dd>' + (Api.lastError ? '<dt>最後のエラー</dt><dd class="warn">' + esc(Api.lastError) + '</dd>' : '');
    if (window.claude) $('stState').innerHTML += '<dt>注意</dt><dd class="warn">claude.ai の中では、ここで選んだ AI は使えません。展示用パソコンでは start-guide.bat で guide.html を直接開いてください。</dd>';
    const u = Usage.get();
    $('stUsage').innerHTML = '<dt>今日 AI に聞いた回数</dt><dd>' + u.calls + ' 回（この 1時間: ' + hourLog().length + ' / ' + LIMITS.perHour + '）</dd>' +
      '<dt>使った量</dt><dd>入力 ' + (u.inp + u.cw + u.cr).toLocaleString() + ' / 出力 ' + u.out.toLocaleString() + ' トークン</dd>' +
      (u.usd > 0 ? '<dt>Claude の料金の目安</dt><dd>約 $' + u.usd.toFixed(3) + '（約 ' + Math.round(u.usd * 150) + ' 円）</dd>' : '');
  },

    Staff.ollamaUrl = $('stUrl').value.trim() || 'http://localhost:11434';
    Staff.pin = $('stPin').value.trim(); Staff.off = false;

  },
  async test() {
    this.save();
    if (Staff.provider === 'none') { $('stMsg').textContent = '「使う AI」を選んでください。'; return; }
    if (!Staff.ready()) { $('stMsg').textContent = 'API キーを入れてください。'; return; }
    $('stMsg').textContent = '試しています…';
    let msg;
    try {
      const r = await Api.ask('あなたは接続テストの相手です。', [{ role: 'user', content: '「つながりました」とだけ答えてください。' }], () => { }, undefined);
      msg = 'つながりました（AI の返事: ' + r.text.slice(0, 40) + '）';
    } catch (e) {
      msg = 'つながりませんでした: ' + (Api.lastError || e.code || '') + (e.status === 401 ? '（キーがまちがっています）' : '');
    }
    this.fill(); $('stMsg').textContent = msg;
  }
};
$('stSave').onclick = () => St.save();
$('stTest').onclick = () => St.test();
$('stClear').onclick = () => { Staff.keys = {}; Staff.off = false; Staff.save(); St.fill(); $('stMsg').textContent = 'すべての API キーを消しました。'; };
$('stProv').onchange = () => St.shape();
$('stUnlock').onclick = () => { if ($('stPinIn').value.trim() === Staff.pin) { $('stLock').hidden = true; $('stBody').hidden = false; St.fill(); } else $('stPinMsg').textContent = '暗証番号がちがいます。'; };
$('stPinIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('stUnlock').click(); });
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => St.close());

  else if (e.key === 'Escape' && !$('staff').hidden) St.close();

{
