/* 乱数（mulberry32 と同じ列）。状態 s を自分のプロパティに持つので、試合の状態ごと保存・巻き戻しできる */
class Rng {
  constructor(seed) { this.seed = seed >>> 0; this.s = this.seed | 0; }

const Ease = {
  linear: t => t,
  inQuad: t => t * t,
  outQuad: t => t * (2 - t),
  inOutQuad: t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  inCubic: t => t * t * t,
  outCubic: t => { const u = t - 1; return u * u * u + 1; },
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  inBack: (t, s) => { s = (s == null ? 1.70158 : s); return t * t * ((s + 1) * t - s); },
  outBack: (t, s) => { s = (s == null ? 1.70158 : s); const u = t - 1; return 1 + u * u * ((s + 1) * u + s); },
  inOutBack: (t, s) => {
    s = (s == null ? 1.70158 : s) * 1.525;

  },

const _rgbCache = {};

  else c = [parseInt(h.substr(1, 2), 16) || 0, parseInt(h.substr(3, 2), 16) || 0, parseInt(h.substr(5, 2), 16) || 0];
  _rgbCache[h] = c;

}
const _rgbaCache = {};

  return s;
}

}

}

function parseHash() {
  const h = (location.hash || '').replace(/^#/, '');
  const out = { mode: '', p: {} };
  const parts = h.split('&').filter(Boolean);
  parts.forEach((s, i) => {
    let k = s.indexOf('=');
    try {
      if (i === 0 && k < 0) out.mode = decodeURIComponent(s);
      else if (k < 0) out.p[decodeURIComponent(s)] = true;
      else out.p[decodeURIComponent(s.slice(0, k))] = decodeURIComponent(s.slice(k + 1));
    } catch (e) { /* 無視 */ }
  });
  return out;
}

function normFeel(f) {
  const o = {};
  for (const k in FEEL_DEF) {
    o[k] = Object.assign({}, FEEL_DEF[k], (f && f[k]) || {});
    /* 伸び縮み（sx, sy）は 1 に近づける */
    if (o[k].sx != null) o[k].sx = 1 + (o[k].sx - 1) * CALM.squash;

function sampleTrack(tr, t) {
  const n = tr.f.length;
  if (n === 0) return 0;
  if (t <= tr.f[0]) return tr.v[0];
  if (t >= tr.f[n - 1]) return tr.v[n - 1];
  let i = 1;
  while (i < n - 1 && tr.f[i] < t) i++;
  const f0 = tr.f[i - 1], f1 = tr.f[i];
  const span = f1 - f0;
  if (span <= 0) return tr.v[i];
  const u = (t - f0) / span;
  return tr.v[i - 1] + (tr.v[i] - tr.v[i - 1]) * easeApply(tr.e[i], u, tr.b[i]);
}

  for (let c = 0; c < NCH; c++) out[c] = sampleTrack(cc.tracks[c], tt);

  if (!sq) return out;
  let tt = cc.loop ? (t % cc.length) : t;
  const n = sq.f.length;
  if (tt <= sq.f[0]) { out[0] = sq.sx[0]; out[1] = sq.sy[0]; return out; }
  if (tt >= sq.f[n - 1]) { out[0] = sq.sx[n - 1]; out[1] = sq.sy[n - 1]; return out; }
  let i = 1;
  while (i < n - 1 && sq.f[i] < tt) i++;
  const span = sq.f[i] - sq.f[i - 1];
  const u = span > 0 ? (tt - sq.f[i - 1]) / span : 1;
  const e = easeApply(sq.e[i], u);
  out[0] = sq.sx[i - 1] + (sq.sx[i] - sq.sx[i - 1]) * e;
  out[1] = sq.sy[i - 1] + (sq.sy[i] - sq.sy[i - 1]) * e;

 * ---------------------------------------------------------------- */
const LookAdapter = {
  body(ch) { return ch.look.body; },                                      /* FK の骨の長さ */
  neon(ch) { return Object.assign({}, NEON_DEF, ch.look.neon || {}); },   /* ネオン管の太さなど */
  chains(ch) { return ch.look.chains || []; },                            /* 二次揺れの定義 */
  palette(ch, palKey) { return ch.look[palKey]; },                        /* drawFighterVisual に渡すパレット */
  /* 影絵の縁の色: 1P側の配色 = ネオン赤、2P側の配色 = ネオンシアン（キャラ共通） */
  edge(ch, palKey) { return palKey === 'paletteP2' ? '#3ff0ff' : '#ff4a6b'; },
  glow(ch, palKey) { return this.edge(ch, palKey); },                     /* エフェクト用の代表色(hex) */
  accent(ch, palKey) { return ch.look[palKey].accent || this.edge(ch, palKey); },
  paletteColor(ch, palKey, name) { return name === 'glow' ? this.edge(ch, palKey) : ch.look[palKey][name]; },   /* 飛び道具・軌跡の色名 → hex */
  propLen(ch) { const p = ch.look.prop; return p && p.kind !== 'none' ? p.len : 30; },   /* 軌跡の先端用 */
  propAngle(ch) { const p = ch.look.prop; return p ? (p.angle || 0) : 0; }
};

/* キャラのランタイムを作る: クリップをトラックへコンパイルし restPelvisH を計算 */
/* モード変化（ch.mode2）: 体力が mode2.at（割合）以下になると、stats / moves / projectiles を mode2 の中身で上書きした別キャラに切り替わる。
 * 名前は「名前・ラベル」。クリップは同じ ch.clips を使う（変化後の技は clip 名を別にしておく） */
function modeChar(c) {
  const m = c && c.mode2;
  if (!m) return null;
  const a = Object.assign({}, c, {
    name: m.name || (c.name + '・' + (m.label || '2')), modeName: m.key || 'mode2',
    stats: Object.assign({}, c.stats, m.stats || {}), moves: Object.assign({}, c.moves, m.moves || {}),
    projectiles: Object.assign({}, c.projectiles, m.projectiles || {}), clips: Object.assign({}, c.clips, m.clips || {}),
    passive: m.passive || null
  });
  delete a.mode2;
  return a;
}
function compileCharacter(ch) {
  const rt = {
    id: ch.id, ch: ch, body: LookAdapter.body(ch), clips: {}, feel: normFeel(ch.feel),
    base: poseToArray(ch.basePose), restPelvisH: 0, neon: LookAdapter.neon(ch),
    height: 0, mode: ch.modeName || null
  };
  if (ch.mode2) rt.alt = compileCharacter(modeChar(ch));
  const state = {};
  const tmp = new Float64Array(NCH);
  function comp(name) {
    if (rt.clips[name]) return rt.clips[name];
    const clip = ch.clips[name];
    if (!clip || state[name] === 1) return null;
    state[name] = 1;
    let baseArr = rt.base;
    if (clip.base && clip.base !== name && ch.clips[clip.base]) {
      const bc = comp(clip.base);
      if (bc) { baseArr = new Float64Array(NCH); sampleClip(bc, 0, baseArr); }
    }
    const len = Math.max(1, clip.length | 0);
    const cc = {
      name: name, length: len, loop: !!clip.loop, plant: clip.plant === 'root' ? 'root' : 'feet',
      blend: Util.isNum(clip.blend) ? clip.blend : 4, tracks: [], squash: null, events: clip.events || [], base: baseArr
    };
    const keys = (clip.keys || []).slice().sort((a, b) => a.f - b.f);
    let k0 = null;
    for (let i = 0; i < keys.length; i++) if (keys[i].f === 0) { k0 = keys[i]; break; }
    for (let c = 0; c < NCH; c++) {
      const tr = { f: [], v: [], e: [], b: [] };
      const nm = CH[c];
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i];
        let val;
        if (k.p === 'base') val = baseArr[c];
        else if (k.p && typeof k.p === 'object' && Util.isNum(k.p[nm])) val = k.p[nm];
        else continue;
        const last = tr.f.length - 1;
        if (last >= 0 && tr.f[last] === k.f) { tr.v[last] = val; tr.e[last] = k.ease || 'linear'; tr.b[last] = k.back; }
        else { tr.f.push(k.f); tr.v.push(val); tr.e.push(k.ease || 'linear'); tr.b.push(k.back); }
      }
      if (tr.f.length === 0 || tr.f[0] > 0) {
        tr.f.unshift(0); tr.v.unshift(baseArr[c]); tr.e.unshift(k0 && k0.ease ? k0.ease : 'linear'); tr.b.unshift(k0 ? k0.back : undefined);
      }
      if (cc.loop) {
        tr.f.push(len); tr.v.push(tr.v[0]); tr.e.push(tr.e[0]); tr.b.push(tr.b[0]);
      }
      cc.tracks.push(tr);
    }
    if (clip.squash && clip.squash.length) {
      const sq = { f: [], sx: [], sy: [], e: [] };
      const arr = clip.squash.slice().sort((a, b) => a.f - b.f);
      if (arr[0].f > 0) { sq.f.push(0); sq.sx.push(1); sq.sy.push(1); sq.e.push('linear'); }
      arr.forEach(s => { sq.f.push(s.f); sq.sx.push(s.sx); sq.sy.push(s.sy); sq.e.push(s.ease || 'linear'); });
      cc.squash = sq;
    }
    rt.clips[name] = cc;
    return cc;
  }
  for (const name in ch.clips) comp(name);
  /* restPelvisH: basePose を feet で組んだときの骨盤の高さ */
  const jt = newJoints();
  const bp = new Float64Array(rt.base);
  bp[CI.rootY] = 0;
  solveRig(rt, bp, 0, jt);
  rt.restPelvisH = jt.H;
  /* 見た目の高さ（頭頂まで） */
  rt.height = jt.y[J.HEAD] + rt.body.headR;
  void tmp;
  return rt;
}

/* ---------- Rig (FK) ---------- */
const J = { PELVIS: 0, NECK: 1, HEAD: 2, SHOULDER: 3, ELBOW_F: 4, HAND_F: 5, ELBOW_B: 6, HAND_B: 7, KNEE_F: 8, ANKLE_F: 9, TOE_F: 10, KNEE_B: 11, ANKLE_B: 12, TOE_B: 13 };
const BONE_START = [J.PELVIS, J.PELVIS, J.NECK, J.SHOULDER, J.ELBOW_F, J.SHOULDER, J.ELBOW_B, J.PELVIS, J.KNEE_F, J.ANKLE_F, J.PELVIS, J.KNEE_B, J.ANKLE_B];
const BONE_END = [J.PELVIS, J.NECK, J.HEAD, J.ELBOW_F, J.HAND_F, J.ELBOW_B, J.HAND_B, J.KNEE_F, J.ANKLE_F, J.TOE_F, J.KNEE_B, J.ANKLE_B, J.TOE_B];
const BONE_THETA0 = [0, 180, 180, 0, 0, 0, 0, 0, 0, 90, 0, 0, 90];
const DEG = Math.PI / 180;

function newJoints() {
  return { x: new Float64Array(14), y: new Float64Array(14), th: new Float64Array(13), rho: new Float64Array(13), H: 0, rot: 0, sole: 0, soleF: 0, soleB: 0 };
}

/* plantW: 0=feet(最も低い足裏を接地)  1=root(骨盤の高さ = restPelvisH + rootY)。中間値はブレンド */
function solveRig(rt, pose, plantW, out) {
  const b = rt.body;
  const rootX = pose[0], rootY = pose[1], rot = pose[2];
  const tT = 180 - pose[3];
  const tH = tT - pose[4];
  const tUF = tT + 180 + pose[5], tFF = tUF + pose[6];
  const tUB = tT + 180 + pose[7], tFB = tUB + pose[8];
  const tThF = pose[9], tShF = tThF - pose[10], tFtF = tShF + 90 + pose[11];
  const tThB = pose[12], tShB = tThB - pose[13], tFtB = tShB + 90 + pose[14];
  const x = out.x, y = out.y;
  function sx(t) { return Math.sin(t * DEG); }
  function sy(t) { return -Math.cos(t * DEG); }
  x[J.PELVIS] = 0; y[J.PELVIS] = 0;
  x[J.NECK] = b.torsoLen * sx(tT); y[J.NECK] = b.torsoLen * sy(tT);
  const hl = b.neckLen + b.headR;
  x[J.HEAD] = x[J.NECK] + hl * sx(tH); y[J.HEAD] = y[J.NECK] + hl * sy(tH);
  x[J.SHOULDER] = x[J.NECK] - b.shoulderDrop * sx(tT); y[J.SHOULDER] = y[J.NECK] - b.shoulderDrop * sy(tT);
  x[J.ELBOW_F] = x[J.SHOULDER] + b.uArmLen * sx(tUF); y[J.ELBOW_F] = y[J.SHOULDER] + b.uArmLen * sy(tUF);
  x[J.HAND_F] = x[J.ELBOW_F] + b.fArmLen * sx(tFF); y[J.HAND_F] = y[J.ELBOW_F] + b.fArmLen * sy(tFF);
  x[J.ELBOW_B] = x[J.SHOULDER] + b.uArmLen * sx(tUB); y[J.ELBOW_B] = y[J.SHOULDER] + b.uArmLen * sy(tUB);
  x[J.HAND_B] = x[J.ELBOW_B] + b.fArmLen * sx(tFB); y[J.HAND_B] = y[J.ELBOW_B] + b.fArmLen * sy(tFB);
  x[J.KNEE_F] = b.thighLen * sx(tThF); y[J.KNEE_F] = b.thighLen * sy(tThF);
  x[J.ANKLE_F] = x[J.KNEE_F] + b.shinLen * sx(tShF); y[J.ANKLE_F] = y[J.KNEE_F] + b.shinLen * sy(tShF);
  x[J.TOE_F] = x[J.ANKLE_F] + 0.75 * b.footLen * sx(tFtF); y[J.TOE_F] = y[J.ANKLE_F] + 0.75 * b.footLen * sy(tFtF);
  x[J.KNEE_B] = b.thighLen * sx(tThB); y[J.KNEE_B] = b.thighLen * sy(tThB);
  x[J.ANKLE_B] = x[J.KNEE_B] + b.shinLen * sx(tShB); y[J.ANKLE_B] = y[J.KNEE_B] + b.shinLen * sy(tShB);
  x[J.TOE_B] = x[J.ANKLE_B] + 0.75 * b.footLen * sx(tFtB); y[J.TOE_B] = y[J.ANKLE_B] + 0.75 * b.footLen * sy(tFtB);
  /* 足裏の最下点（回転前・骨盤基準） */
  const hF = Math.min(y[J.TOE_F], y[J.ANKLE_F] - 0.25 * b.footLen * sy(tFtF)) - b.footH / 2;
  const hB = Math.min(y[J.TOE_B], y[J.ANKLE_B] - 0.25 * b.footLen * sy(tFtB)) - b.footH / 2;
  const lowest = Math.min(hF, hB);
  const Hfeet = -lowest + rootY;
  const Hroot = rt.restPelvisH + rootY;
  const Hh = plantW <= 0 ? Hfeet : (plantW >= 1 ? Hroot : Hfeet + (Hroot - Hfeet) * plantW);
  /* 全体回転（骨盤中心、時計回り+） */
  const cr = Math.cos(rot * DEG), sr = Math.sin(rot * DEG);
  for (let i = 0; i < 14; i++) {
    const px = x[i], py = y[i];
    x[i] = px * cr + py * sr + rootX;
    y[i] = -px * sr + py * cr + Hh;
  }
  out.H = Hh; out.rot = rot;
  out.sole = Hh + (rot === 0 ? lowest : Math.min(y[J.TOE_F] - Hh, y[J.TOE_B] - Hh, lowest));
  out.soleF = hF; out.soleB = hB;
  const th = out.th, rho = out.rho;
  const ths = [0, tT, tH, tUF, tFF, tUB, tFB, tThF, tShF, tFtF, tThB, tShB, tFtB];
  for (let i = 0; i < 13; i++) {
    th[i] = ths[i] - rot;
    rho[i] = -(ths[i] - BONE_THETA0[i]) + rot;
  }
  rho[0] = rot;
  return out;
}

/* ボーンに貼り付いた点（キャラ空間）。at: start|end|mid、(lx,ly) はボーン局所のオフセット */
function boneAnchor(j, boneIdx, at, lx, ly, out) {
  const s = BONE_START[boneIdx], e = BONE_END[boneIdx];
  let px, py;
  if (at === 'end') { px = j.x[e]; py = j.y[e]; }
  else if (at === 'mid') { px = (j.x[s] + j.x[e]) / 2; py = (j.y[s] + j.y[e]) / 2; }
  else { px = j.x[s]; py = j.y[s]; }
  if (lx || ly) {
    const r = j.rho[boneIdx] * DEG, c = Math.cos(r), sn = Math.sin(r);
    px += lx * c + ly * sn;
    py += -lx * sn + ly * c;
  }
  out[0] = px; out[1] = py;
  return out;
}

/* ---------- ClipPlayer ---------- */
class ClipPlayer {
  constructor(rt) {
    this.rt = rt; this.name = ''; this.cc = null; this.t = 0; this.speed = 1;
    this.from = new Float64Array(NCH); this.fromPlant = 0; this.bLen = 0; this.bT = 99;
    this.pose = new Float64Array(NCH); this.prev = new Float64Array(NCH);
    this.plant = 0; this.plantPrev = 0;
    this.sq = [1, 1]; this.sqPrev = [1, 1];
    this.play('idle', 0, true);
    this.tick(0);
    this.commit(true);
  }
  play(name, blend, force) {
    const cc = this.rt.clips[name];
    if (!cc) return false;
    if (this.cc === cc && !force) return false;
    if (blend == null) blend = cc.blend;
    this.from.set(this.pose); this.fromPlant = this.plant;
    this.cc = cc; this.name = name; this.t = 0; this.speed = 1; this.bLen = blend | 0; this.bT = 0;
    return true;
  }
  /* 1ロジックフレーム進める。t を渡すとその時刻にする */
  tick(t) {
    const cc = this.cc;
    if (t != null) this.t = t; else this.t += this.speed;
    if (cc.loop) { if (this.t >= cc.length) this.t %= cc.length; }
    else if (this.t > cc.length) this.t = cc.length;
    this.bT++;
  }
  evalInto(out) {
    sampleClip(this.cc, this.t, out);
    let plant = this.cc.plant === 'root' ? 1 : 0;
    if (this.bT <= this.bLen) {
      const w = Ease.inOutQuad(this.bT / (this.bLen + 1));
      for (let c = 0; c < NCH; c++) out[c] = this.from[c] + (out[c] - this.from[c]) * w;
      plant = this.fromPlant + (plant - this.fromPlant) * w;
    }
    return plant;
  }
  commit(snap) {
    this.prev.set(this.pose);
    this.plantPrev = this.plant;
    this.sqPrev[0] = this.sq[0]; this.sqPrev[1] = this.sq[1];
    this.plant = this.evalInto(this.pose);
    sampleSquash(this.cc, this.t, this.sq);
    if (snap) { this.prev.set(this.pose); this.plantPrev = this.plant; this.sqPrev[0] = this.sq[0]; this.sqPrev[1] = this.sq[1]; }
  }
  renderPose(alpha, out) {
    const a = this.prev, b = this.pose;
    for (let c = 0; c < NCH; c++) out[c] = a[c] + (b[c] - a[c]) * alpha;
    return this.plantPrev + (this.plant - this.plantPrev) * alpha;
  }
  /* 指定クリップを時刻 t で一度だけ評価（ブレンドなし）。ゴースト/ギャラリー用 */
  static sampleAt(rt, name, t, out) {
    const cc = rt.clips[name];
    sampleClip(cc, t, out);
    return cc.plant === 'root' ? 1 : 0;
  }
}

/* ---------- 二次揺れ (Chain) ---------- */
class ChainSim {
  constructor(def) {
    this.def = def;
    const n = def.segs + 1;
    this.n = n;
    this.x = new Float64Array(n); this.y = new Float64Array(n);
    this.ox = new Float64Array(n); this.oy = new Float64Array(n);
    this.rx = new Float64Array(n); this.ry = new Float64Array(n);
    this.lax = 0; this.lay = 0; this.lvx = 0; this.lvy = 0;
    this.ready = false;
    this.bone = BONE_IDX[def.anchor.bone] != null ? BONE_IDX[def.anchor.bone] : 2;
    /* 揺れを控えめに: 減衰を強く・戻る力を強く・揺さぶりを弱く（びよびよ防止） */
    this.damping = Math.max(Util.isNum(def.damping) ? def.damping : 0.1, CALM.chainDamping);
    this.stiffness = Math.min(0.6, Math.max(CALM.chainStiffMin, (Util.isNum(def.stiffness) ? def.stiffness : 0.1) * CALM.chainStiff));
    this.inertia = 1 + ((Util.isNum(def.inertia) ? def.inertia : 1) - 1) * CALM.chainInertia;
    this.kickMul = (Util.isNum(def.kick) ? def.kick : 1) * CALM.chainKick;
  }
  reset(ax, ay, facing) {
    const d = this.def;
    const rdx = facing * Math.sin(d.rest * DEG), rdy = -Math.cos(d.rest * DEG);
    for (let i = 0; i < this.n; i++) {
      this.x[i] = ax + rdx * d.segLen * i; this.y[i] = ay + rdy * d.segLen * i;
      this.ox[i] = this.x[i]; this.oy[i] = this.y[i]; this.rx[i] = this.x[i]; this.ry[i] = this.y[i];
    }
    this.lax = ax; this.lay = ay; this.lvx = 0; this.lvy = 0;
    this.ready = true;
  }
  step(ax, ay, facing, wind) {
    if (!this.ready || Math.abs(ax - this.x[0]) > 160 || Math.abs(ay - this.y[0]) > 160) this.reset(ax, ay, facing);
    const d = this.def, n = this.n, x = this.x, y = this.y, ox = this.ox, oy = this.oy;
    for (let i = 0; i < n; i++) { this.rx[i] = x[i]; this.ry[i] = y[i]; }
    const vax = ax - this.lax, vay = ay - this.lay;
    const accx = vax - this.lvx, accy = vay - this.lvy;
    this.lax = ax; this.lay = ay; this.lvx = vax; this.lvy = vay;
    x[0] = ax; y[0] = ay; ox[0] = ax; oy[0] = ay;
    const rdx = facing * Math.sin(d.rest * DEG), rdy = -Math.cos(d.rest * DEG);
    const damp = 1 - this.damping, sl = d.segLen, vmax = sl * 0.35;
    const ik = this.inertia - 1;
    for (let i = 1; i < n; i++) {
      let vx = (x[i] - ox[i]) * damp, vy = (y[i] - oy[i]) * damp;
      const tx = x[i - 1] + rdx * sl, ty = y[i - 1] + rdy * sl;
      vx += (tx - x[i]) * this.stiffness; vy += (ty - y[i]) * this.stiffness;
      vy -= d.gravity * CALM.chainGravity;
      vx -= accx * ik * 0.5; vy -= accy * ik * 0.5;
      vx += wind * facing * 0.02 * i;
      const sp = Math.sqrt(vx * vx + vy * vy);
      if (sp > vmax) { vx *= vmax / sp; vy *= vmax / sp; }
      ox[i] = x[i]; oy[i] = y[i];
      x[i] += vx; y[i] += vy;
    }
    for (let i = 1; i < n; i++) {
      let dx = x[i] - x[i - 1], dy = y[i] - y[i - 1];
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 1e-6) { const k = sl / dist; x[i] = x[i - 1] + dx * k; y[i] = y[i - 1] + dy * k; }
      else { x[i] = x[i - 1]; y[i] = y[i - 1] - sl; }
    }
  }
  kick(ix, iy) {
    const m = this.kickMul;
    for (let i = 1; i < this.n; i++) { const w = i / this.n; this.ox[i] -= ix * m * w; this.oy[i] -= iy * m * w; }
  }
}

/* ---------- Puppet: 絵として動く1体（Fighter / プレビュー / ギャラリー共通） ---------- */
class Puppet {
  constructor(rt, usePal2) {
    this.rt = rt;
    this.pal = usePal2 ? 'paletteP2' : 'palette';
    this.cp = new ClipPlayer(rt);
    this.x = 0; this.y = 0; this.px = 0; this.py = 0;
    this.facing = 1; this.pfacing = 1;
    this.chains = LookAdapter.chains(rt.ch).map(c => new ChainSim(c));
    this.joints = newJoints();
    this.tmpPose = new Float64Array(NCH);
    this.phase = 0;                 /* 呼吸の位相（ロジックフレーム） */
    /* Feel タイマー（ロジックフレーム単位。-1 は無効） */
    this.landT = -1; this.jumpT = -1; this.dashT = -1; this.hitT = -1; this.hitImpact = 1; this.hitDir = 1;
    this.shakeAmp = 0; this.shakeLeft = 0; this.shakeTotal = 0;
    this.breathOn = false;
    this.ghosts = [];               /* 残像 */
    this.ghostTick = 0;
    this.trail = [];                /* 軌跡 {x,y}[] 先頭が最新 */
    this.trailInfo = null;
    this.snapNext = true;
    this.cosmetic = true;
    this.flash = 0;                 /* 被弾フラッシュ(0..1) */
    this.alpha = 1;
    this.purify = -1;               /* 浄化の経過フレーム。-1 で無効 */
    this.glitchT = 0; this.glitchMax = 1; this.glitchPow = 0;
    this.pre = 0;                   /* 屈伸の進行(0..1) */
    this.rotOv = null;              /* 投げられ中の体の回転(deg)。null で無効 */
    this.jfresh = false;
  }
  /* 論理ポーズでのFK（必要なときだけ解く） */
  getJoints() {
    if (!this.jfresh) { solveRig(this.rt, this.cp.pose, this.cp.plant, this.joints); this.jfresh = true; }
    return this.joints;
  }
  /* エフェクト用の代表色 */
  glow() { return LookAdapter.glow(this.rt.ch, this.pal); }
  accent() { return LookAdapter.accent(this.rt.ch, this.pal); }
  setPos(x, y, facing, snap) {
    this.x = x; this.y = y; this.facing = facing;
    if (snap) { this.px = x; this.py = y; this.pfacing = facing; this.snapNext = true; }
  }
  /* 位置の prev を現在値に（ロジックステップ冒頭で呼ぶ） */
  beginStep() {
    this.px = this.x; this.py = this.y; this.pfacing = this.facing;
  }
  /* ステップ末尾: ポーズ確定 + 二次揺れ + Feelタイマー */
  commit(snap, frozen) {
    this.cp.commit(snap || this.snapNext);
    this.jfresh = false;
    if (this.cosmetic) {
      this.updateChains(snap || this.snapNext, frozen);
    }
    if (snap || this.snapNext) { this.px = this.x; this.py = this.y; this.pfacing = this.facing; }
    this.snapNext = false;
    if (!frozen) {
      this.phase++;
      if (this.landT >= 0) { this.landT++; if (this.landT > this.rt.feel.land.frames) this.landT = -1; }
      if (this.jumpT >= 0) { this.jumpT++; if (this.jumpT > this.rt.feel.jump.frames) this.jumpT = -1; }
      if (this.dashT >= 0) { this.dashT++; if (this.dashT > this.rt.feel.dash.frames) this.dashT = -1; }
      if (this.hitT >= 0) { this.hitT++; if (this.hitT > Math.max(this.rt.feel.recoil.frames + RECOIL_EXTRA[this.hitImpact - 1], this.rt.feel.squashHit.frames) + 1) this.hitT = -1; }

  updateChains(snap, frozen) {

      return;
    }
    const rt = this.rt;
    const j = this.getJoints(), a = [0, 0];

    for (let i = 0; i < this.chains.length; i++) {

  resetChains() { this.snapNext = true; for (let i = 0; i < this.chains.length; i++) this.chains[i].ready = false; }
  kickChains(ix, iy) { for (let i = 0; i < this.chains.length; i++) this.chains[i].kick(ix, iy); }
  /* 被弾の反応（描画用） */

  /* 描画に使う 全体スケール(sx, sy)。足元基準。alpha は補間係数 */
  renderScale(alpha, out) {

    let sy = this.cp.sqPrev[1] + (this.cp.sq[1] - this.cp.sqPrev[1]) * alpha;
    if (this.landT >= 0) {
      const u = Ease.outCubic(Util.clamp((this.landT + alpha) / f.land.frames, 0, 1));
      sx *= f.land.sx + (1 - f.land.sx) * u; sy *= f.land.sy + (1 - f.land.sy) * u;
    }
    if (this.jumpT >= 0) {
      const u = Ease.outQuad(Util.clamp((this.jumpT + alpha) / f.jump.frames, 0, 1));
      sx *= f.jump.sx + (1 - f.jump.sx) * u; sy *= f.jump.sy + (1 - f.jump.sy) * u;
    }
    if (this.dashT >= 0) {
      const u = Ease.outQuad(Util.clamp((this.dashT + alpha) / f.dash.frames, 0, 1));
      sx *= f.dash.sx + (1 - f.dash.sx) * u; sy *= f.dash.sy + (1 - f.dash.sy) * u;
    }
    if (this.hitT >= 0 && f.squashHit.frames > 0) {
      const u = Ease.outQuad(Util.clamp((this.hitT + alpha) / f.squashHit.frames, 0, 1));
      sx *= f.squashHit.sx + (1 - f.squashHit.sx) * u; sy *= f.squashHit.sy + (1 - f.squashHit.sy) * u;
    }

  }
  /* 描画用ポーズ（補間 + やられ反動）を tmpPose に作り plantW を返す */
  renderPoseInto(alpha) {
    const plant = this.cp.renderPose(alpha, this.tmpPose);
    if (this.hitT >= 0) {
      /* やられ反動: 強い攻撃ほど大きく・長く、上体と頭がのけぞる（弱は小さく短い） */
      const f = this.rt.feel.recoil, i = this.hitImpact - 1, len = Math.max(1, f.frames + RECOIL_EXTRA[i]);
      const u = 1 - Ease.outCubic(Util.clamp((this.hitT + alpha) / len, 0, 1));
      this.tmpPose[CI.rootX] -= f.x[i] * 1.6 * u;
      this.tmpPose[CI.rot] -= f.rot[i] * u;
      this.tmpPose[CI.torso] -= RECOIL_TORSO[i] * u;
      this.tmpPose[CI.head] -= RECOIL_HEAD[i] * u;
      this.tmpPose[CI.uarmF] += RECOIL_ARM[i] * u; this.tmpPose[CI.uarmB] += RECOIL_ARM[i] * u;
    }
    if (this.rotOv !== null) this.tmpPose[CI.rot] = this.rotOv;

  }
}

/* やられ反動の大きさ（衝撃 1〜4 ごと） */
const RECOIL_EXTRA = [1, 3, 7, 10], RECOIL_TORSO = [4, 9, 16, 22], RECOIL_HEAD = [4, 8, 14, 18], RECOIL_ARM = [3, 8, 16, 24];

/* ================================================================

  parse(buf, pf, gauge, easy) {

    if (n === 2) return gauge >= CFG.SUPER_COST ? 'super' : 'sp1';
    return 'sp1';
  }
};

function holdAt(hold, g) {
  const n = hold.length;

  for (let i = 1; i < n; i++) {

    }

  takeOff() {

    this.vy = st.jumpVy; this.vx = h * st.jumpVx; this.y = 0.01;
    this.airSUsed = false;
    this.airJumpsLeft = st.airJumps; this.noAct = false; this.airLag = null;
    this.setState('AIR', 'jumpUp');
    this.pup.jumpT = 0; this.pup.pre = 0;
    this.fx.sfx('jump', this.x);
    this.fx.dust(this.x, 0, this.facing, 3);
    this.vy -= st.gravity; this.y += this.vy; this.dx = this.vx;
  }
  startDash(dir) {
    const s = dir > 0 ? this.st.dashF : this.st.dashB;
    this.dashDir = dir; this.dashFrames = s.frames; this.dashSpeed = s.speed; this.dashN = 0; this.runN = 0;
    this.setState(dir > 0 ? 'DASH_F' : 'DASH_B', dir > 0 ? 'dashF' : 'dashB');
    this.pup.dashT = 0;
    this.fx.sfx('dash', this.x);
    this.fx.dust(this.x, 0, -this.facing * dir, 5);
    this.stepDash();
  }
  stepDash() {
    this.dashN++;
    /* 走り: 前を押し続けている間は、減速せずに走り続ける（最大 70F） */
    if (this.dashDir > 0 && this.st.dashF.run && this.buf.fwd() && this.dashN >= Math.floor(this.dashFrames * 0.6) && this.runN < 70) {
      this.dashN = Math.floor(this.dashFrames * 0.6); this.runN++;
      if (this.runN % 10 === 0) this.fx.dust(this.x, 0, -this.facing, 3);
    }
    if (this.dashN > this.dashFrames) return false;
    const p = (this.dashN - 1) / this.dashFrames;
    const sp = p < 0.7 ? this.dashSpeed : this.dashSpeed * (1 - (p - 0.7) / 0.3);
    this.vx = this.dashDir * this.facing * sp;
    this.dx = this.vx;
    return true;
  }

  /* ガードブレイク: しばらく無防備（のけぞりと同じ扱い。相手の攻撃は全部当たる） */
  guardBreak() {
    this.mv = null; this.vx = 0;
    this.setState('HITSTUN', 'hurtHigh', 1, true);
    this.hitCrouch = false; this.stunLeft = CFG.BREAK_STUN;
    this.kb = { total: 0, dir: 1, i: 10 };
    this.shield = CFG.BREAK_REFILL; this.brokenT = CFG.BREAK_STUN;
    this.fx.guardBreak(this.x, this.y + 90, this);
    this.fx.sfx('guardBreak', this.x);
  }
  /* ---------- 毎ステップの更新（ヒットストップ中は呼ばれない） ---------- */
  update(opp) {
    this.stateT++;
    if (this.throwInv > 0) this.throwInv--;
    if (this.techInv > 0) this.techInv--;
    if (this.comboShow.t > 0) this.comboShow.t--;
    this.dx = 0; this.kbPart = 0;
    const b = this.buf, st = this.st;
    let free = false;
    if (this.brokenT > 0) this.brokenT--;
    if (this.poison && this.poison.left > 0 && this.match.phase === 'FIGHTING' && this.hp > 1) {
      if (++this.poison.t >= this.poison.every) {
        this.poison.t = 0; this.poison.left--;
        const d = Math.min(this.poison.dmg, this.hp - 1);
        this.hp -= d; this.dmgRound += d; this.fx.poison(this);
      }
    }
    /* モード変化: 体力が mode2.at 以下になったら切り替わる（1ラウンドに1回。ゲージ少し回復） */
    /* mode2.backAt があれば、体力がそこまで戻ると元のモードに戻る（ゲージ回復は1ラウンドに最初の1回だけ） */
    const m2 = this.rt0.ch.mode2;
    if (m2 && this.hp > 0 && this.match.phase === 'FIGHTING') {
      if (!this.mode && this.hp <= this.maxHp * (m2.at || 0.5)) {
        this.setMode(1);
        if (!this.modeGauge) { this.modeGauge = true; this.gauge = Math.min(CFG.GAUGE_MAX, this.gauge + (m2.gauge || 0)); if (m2.burst) this.burstPending = true; }
        this.fx.modeShift(this, m2.label || '');
      } else if (this.mode && m2.backAt && this.hp >= this.maxHp * m2.backAt) {

        this.fx.modeShift(this, m2.backLabel || '');
      }
    }
    /* mode2.burst: 変化した瞬間（地上に足が着いていれば、のけぞり中・ガード中・技の途中でも）に無敵の衝撃波の技を出す。1ラウンドに1回 */
    if (this.burstPending && this.y <= 0.001 && BURST_ST[this.state] && this.match.phase === 'FIGHTING') {
      this.burstPending = false;
      this.mv = null; this.stunLeft = 0; this.kb.i = 10; this.vx = 0;
      this.startMove(m2.burst);
      return;
    }
    if (this.empowered && this.match.frame % 14 === 0) this.fx.chargeKeep(this, 1);
    if (this.marks > 0) { if (--this.markT <= 0) this.marks = 0; else if (this.match.frame % 20 === 0) this.fx.markKeep(this, this.marks); }
    if (this.chargeStock > 0 && this.match.frame % 24 === 0) this.fx.chargeKeep(this, this.chargeStock / (this.ch.moves.sp1.charge ? this.ch.moves.sp1.charge.max : 1));
    if (this.breakPending) { this.breakPending = false; this.guardBreak(); return; }
    /* ガードの耐久: ボタンで構えている間は減り、構えていない間は回復 */
    const ready = this.state === 'IDLE' || this.state === 'CROUCH' || this.state === 'BLOCKSTUN' || this.state === 'WALK_F' || this.state === 'WALK_B';
    this.shieldHeld = ready && (b.cur & B_G) !== 0 && this.y <= 0.001;
    if (this.shieldHeld) {
      this.shield -= CFG.SHIELD_DRAIN;
      if (this.shield <= 0) { this.guardBreak(); return; }
    } else if (this.state !== 'BLOCKSTUN') this.shield = Math.min(CFG.SHIELD_MAX, this.shield + CFG.SHIELD_REGEN);

    switch (this.state) {
      case 'IDLE': case 'WALK_F': case 'WALK_B': case 'CROUCH':
        free = true; break;
      case 'PREJUMP':
        this.vx = 0;
        this.pup.pre = Math.min(1, this.stateT / Math.max(1, st.prejump));
        if (this.stateT >= st.prejump) this.takeOff();
        break;
      case 'AIR': {
        if (!this.noAct) {
          const id = this.pickMove(null, true);
          if (id) { this.performMove(id); break; }
          if (this.airJumpsLeft > 0 && b.upEdge()) {
            this.airJumpsLeft--;
            this.vy = st.jumpVy * 0.95; this.vx = b.horiz(0) * st.jumpVx;
            this.pup.cp.play('jumpUp', 2, true); this.pup.jumpT = 0;
            this.fx.sfx('jump', this.x); this.fx.burst(this.x, this.y + 10, '#f4f7ff', 8);
            this.noAct = false;
          }
        }
        this.vy -= st.gravity; this.y += this.vy; this.dx = this.vx;
        if (this.vy <= 0 && this.pup.cp.name === 'jumpUp') this.pup.cp.play('jumpFall', 6);
        if (this.y <= 0 && this.vy <= 0) {
          const lag = this.airLag != null ? this.airLag : st.landLag;
          this.pup.landT = 0; this.fx.sfx('land', this.x); this.fx.dust(this.x, 0, this.facing, 5);
          this.noAct = false; this.airLag = null;
          if (this.beginLanding(lag)) free = true;

      }
      case 'LANDING':
        if (this.stateT >= this.landFrames) free = true;
        break;
      case 'DASH_F': {
        /* キャラ固有: 走り（dashF.run）。走りながら強で 必殺1 */
        if (this.st.dashF.run && this.runN > 4 && b.has('H')) { b.use('H'); this.performMove('sp1'); break; }
        if (this.dashN >= 4) {

        }
        /* 減速に入ったら（全体の7割を過ぎたら）もう自由に動ける（ガード・歩き・もう一度ダッシュ）。走り続けている狛犬は除く */
        if (this.dashN >= Math.ceil(this.dashFrames * 0.7) && !(this.st.dashF.run && b.fwd())) { this.vx = 0; free = true; break; }
        if (!this.stepDash()) { this.vx = 0; free = true; }
        break;
      }
      case 'DASH_B':
        if (!this.stepDash()) { this.vx = 0; free = true; }
        break;
      case 'ATTACK': {
        if (this.tryCancel()) break;
        const r = this.stepMove();
        if (r === 0) free = true;
        break;
      }
      case 'SUPERFLASH':
        this.startMove('super');
        break;
      case 'BLOCKSTUN': case 'HITSTUN':
        if (this.state === 'BLOCKSTUN' && this.stateT > 1) {
          /* ガードキャンセル: ガード中に 前+強（ゲージ半分）。出始め無敵の反撃 */
          if (b.has('H') && b.fwd() && this.gauge >= CFG.GC_COST) {
            b.use('H'); this.gauge -= CFG.GC_COST;
            this.performMove('5H'); this.mv.gc = true;
            this.fx.gc(this.x, this.y + 90, this);
            break;
          }
          /* 押し返し: ガード中に 弱+強。相手を押しのける（1回のガードにつき1回） */
          if (!this.pushUsed && b.has('L') && b.has('H') && Math.abs(b.pf.L - b.pf.H) <= CFG.CHORD_WINDOW) {
            b.use('L'); b.use('H'); this.pushUsed = true;
            const o = this.match.opp(this), dir = o.x >= this.x ? 1 : -1;
            o.pushOut = { total: CFG.PUSHBLOCK_DIST, dir: dir, i: 0 };

          }
        }
        this.applyKnock();
        this.stunLeft--;
        if (this.stunLeft <= 0) { this.throwInv = CFG.THROW_INV_AFTER_STUN; this.endCombo(); free = true; }
        break;
      case 'AIR_HURT':
        /* 空中受け身: 浮かされてから少したったら、ボタンで空中で体勢を立て直す（少しの間 無敵） */
        if (!this.ko && this.stateT >= CFG.AIR_TECH_AFTER && this.y > 30 && b.anyPressEdge()) {
          this.setState('AIR', 'jumpFall', 2, true);
          this.vx = -this.facing * 2.6; this.vy = 5.5; this.noAct = false; this.airLag = null;
          this.techInv = CFG.AIR_TECH_INV;
          this.endCombo();
          this.fx.tech(this.x, this.y + 80); this.fx.sfx('jump', this.x);
          break;
        }
        this.vy -= st.gravity; this.y += this.vy; this.dx = this.vx;
        if (this.y <= 0 && this.vy <= 0) {
          this.y = 0; this.vy = 0; this.vx = 0; this.dx = 0;
          this.setState('DOWN', 'down', 3); this.otgUsed = false;
          this.pup.landT = 0;
          this.fx.sfx('down', this.x); this.fx.dust(this.x, 0, -this.facing, 8); this.fx.knockdown(this.x, this);
          this.endCombo();
        }
        break;
      case 'DOWN':
        /* 起き上がりの選択肢:
         *   倒れてすぐボタン = 早起き / 倒れてすぐ後ろを入れる = 後ろ受け身（転がって離れる）
         *   下を押しっぱなし = 遅らせ起き（相手の重ねをずらす） / 何もしない = 通常 */
        if (!this.ko) {
          const back = b.horiz(0) * this.facing < 0;
          if (this.stateT <= CFG.QUICK_WINDOW && back && (b.anyPressEdge() || b.horiz(0) !== 0)) this.startWake(true, true);
          else if (this.stateT <= CFG.QUICK_WINDOW && (b.anyPressEdge() || (b.edge & B_UP))) this.startWake(true);
          else if (this.stateT >= CFG.DOWN_FRAMES + (b.down() ? CFG.WAKE_DELAY : 0)) this.startWake(false);

      case 'WAKEUP':
        if (this.roll) this.dx = -this.facing * CFG.ROLL_SPEED;
        if (this.stateT >= this.wakeLen) { free = true; this.roll = false; this.throwInv = Math.max(this.throwInv, CFG.WAKE_THROW_INV); }
        break;
      case 'GRAB':
        free = this.grabUpdate();
        break;
      case 'THROWN': case 'INTRO': case 'WIN': case 'LOSE':
        break;
      default: break;
    }
    if (free) this.freeUpdate(opp);
    /* 押し返しで押された（どの状態でも効く。状態ごとの移動のあとに足す） */
    if (this.pushOut && this.pushOut.i < 12) { const P = this.pushOut; this.dx += P.total * (12 - P.i) / 78 * P.dir; P.i++; }
    this.pup.breathOn = this.state === 'IDLE';
    this.animTick();
  }
  freeUpdate(opp) {
    const b = this.buf, st = this.st;
    this.pup.pre = 0;
    this.mv = null;
    const id = this.pickMove(null, false);
    if (id) { this.performMove(id); return; }
    if (b.up()) { this.setState('PREJUMP', 'idle', 3); this.vx = 0; this.dx = 0; this.pup.pre = 0; return; }
    if (b.dtForward()) { b.useDT(); this.startDash(1); return; }
    if (b.dtBack()) { b.useDT(); this.startDash(-1); return; }
    if (b.down()) {
      if (this.state !== 'CROUCH') this.setState('CROUCH', 'crouch');
      this.vx = 0; return;
    }
    const h = (b.cur & B_G) ? 0 : b.horiz(0) * this.facing;
    if (h > 0) {
      if (this.state !== 'WALK_F') this.setState('WALK_F', 'walkF');
      this.vx = st.walkF * this.facing;
    } else if (h < 0) {
      if (this.state !== 'WALK_B') this.setState('WALK_B', 'walkB');
      this.vx = -st.walkB * this.facing;
    } else {
      if (this.state !== 'IDLE') this.setState('IDLE', 'idle');
      this.vx = 0;
    }
    this.dx = this.vx;
  }
  startWake(quick, roll) {
    this.quick = quick; this.roll = !!roll;
    this.wakeLen = roll ? CFG.ROLL_FRAMES : (quick ? CFG.WAKEUP_QUICK : CFG.WAKEUP_FRAMES);
    if (roll) this.fx.dust(this.x, 0, this.facing, 6);
    this.setState('WAKEUP', 'wakeup', 1, true);
    this.pup.cp.speed = CFG.WAKEUP_FRAMES / this.wakeLen;
    this.fx.sfx('step', this.x);
  }
  applyKnock() {
    const k = this.kb;
    if (k.i < 10) {
      const d = k.total * (10 - k.i) / 55;
      k.i++;
      this.kbPart = d * k.dir;
      this.dx += this.kbPart;
    }
  }
  tryCancel() {
    const mv = this.mv, m = mv.m, b = this.buf;
    /* 弱+強の同時押し: 発生前なら投げに置き換える */
    if (mv.trigBtn && mv.n <= m.startup && mv.hitCount === 0 && !mv.contact) {
      const other = mv.trigBtn === 'L' ? 'H' : 'L';
      if (b.has(other) && b.pf[other] >= mv.trigFrame && b.pf[other] - mv.trigFrame <= CFG.CHORD_WINDOW) {
        b.use('L'); b.use('H');
        this.performMove('throw');
        return true;
      }
    }
    if (mv.contact === 'hit' && m.cancel && mv.cancelLeft > 0 && m.cancel.into.indexOf('jump') >= 0 && b.up()) {
      this.mv = null; this.takeOff(); this.vx = this.facing * this.st.jumpVx * 0.6;
      return true;
    }
    if (mv.contact && m.cancel && mv.cancelLeft > 0) {
      mv.cancelLeft--;
      const set = new Set(m.cancel.into);
      const id = this.pickMove(set, this.y > 0.001);
      if (id) { this.performMove(id); return true; }
    }
    return false;
  }
  grabUpdate() {
    const g = this.grab;
    if (!g) return true;
    const t = g.def, tg = g.target;
    g.g++;
    if (tg.state === 'THROWN' && g.g <= t.grabFrames) {
      const h0 = holdAt(t.hold, g.g);
      /* 後ろ投げは、持ち上げながら前→頭の上→背中側へ回す（holdAt はデータそのものを返すことがあるので写してから変える） */
      const hp = g.back ? { x: h0.x * (1 - 2 * Ease.inOutQuad(Util.clamp(g.g / t.grabFrames, 0, 1))), y: h0.y, rot: h0.rot } : h0;
      // 壁際の投げ: 掴まれた側が壁の外に出るなら、投げた側を内側へずらす
      let tx = this.x + this.facing * hp.x;
      const over = tx - Util.clamp(tx, CFG.WALL_MIN, CFG.WALL_MAX);
      if (over !== 0) { this.x = Util.clamp(this.x - over, CFG.WALL_MIN, CFG.WALL_MAX); tx = Util.clamp(this.x + this.facing * hp.x, CFG.WALL_MIN, CFG.WALL_MAX); }
      tg.x = tx; tg.y = Math.max(0, hp.y);
      tg.facing = -this.facing; tg.pup.rotOv = hp.rot;
    }
    if (g.g === t.grabFrames && tg.state === 'THROWN') this.match.combat.releaseThrow(this, tg, t);
    if (g.g >= t.grabFrames + t.afterRecovery) { this.grab = null; this.vx = 0; return true; }
    return false;
  }
  animTick() {
    const cp = this.pup.cp, pt = cp.t;
    if (this.state === 'ATTACK' && this.mv) cp.tick(this.mv.n - 1);
    else if (this.state === 'GRAB' && this.grab) cp.tick(this.grab.g);
    else cp.tick();
    const evs = cp.cc.events;
    if (evs && evs.length && this.state !== 'ATTACK' && this.state !== 'GRAB') {
      const nt = cp.t, wrapped = nt < pt;
      for (let i = 0; i < evs.length; i++) {
        const f = evs[i].f;
        const hit = wrapped ? (f > pt || f <= nt) : (f > pt && f <= nt);
        if (hit && pt !== nt) {
          this.fx.sfx(evs[i].sfx, this.x);
          if (evs[i].sfx === 'step') this.fx.dust(this.x, 0, -this.facing, 1);
        }
      }
    }
  }
}

const NullFX = new Proxy({}, { get: function () { return function () { }; } });
/* オンライン対戦（net.js）。中身は使うときに参照するのでゲッターで渡す */
const { Snap, Net, NetSession, NetTest } = window.DennoNet({
  get Game() { return Game; }, get FX() { return FX; }, get NullFX() { return NullFX; }, get Match() { return Match; }, get HASH() { return HASH; }
});

function rectOv(a, b) { return a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1]; }
function rectCenter(a, b) {
  return [(Math.max(a[0], b[0]) + Math.min(a[2], b[2])) / 2, (Math.max(a[1], b[1]) + Math.min(a[3], b[3])) / 2];
}

class Projectiles {
  constructor(match) { this.m = match; this.list = []; }
  clear() { this.list.length = 0; }
  spawn(owner, s) {
    const def = owner.ch.projectiles[s.projectile];
    if (!def) return false;
    let cnt = 0;
    for (let i = 0; i < this.list.length; i++) { const p = this.list[i]; if (p.alive && p.owner === owner && p.id === s.projectile) cnt++; }
    if (cnt >= def.maxActive) {
      /* replaceOld: 上限まで置いてあれば一番古いものを消して置き直す（河童の水たまり） */
      if (!def.replaceOld) return false;
      let old = null;
      for (let i = 0; i < this.list.length; i++) { const p = this.list[i]; if (p.alive && p.owner === owner && p.id === s.projectile && (!old || p.serial < old.serial)) old = p; }
      if (old) old.alive = false;
    }
    let slot = null;
    for (let i = 0; i < this.list.length; i++) if (!this.list[i].alive) { slot = this.list[i]; break; }
    let alive = 0;
    for (let i = 0; i < this.list.length; i++) if (this.list[i].alive) alive++;
    if (!slot && alive >= CFG.POOL.proj) return false;
    const dir = owner.facing;
    const p = slot || {};
    p.alive = true; p.owner = owner; p.id = s.projectile; p.def = def; p.dir = dir;
    p.ox = s.x; p.oy = s.y;
    p.x = owner.x + dir * s.x; p.y = def.ground ? 0 : owner.y + s.y;
    p.px = p.x; p.py = p.y; p.vx = def.vx * dir; p.vy = def.vy;
    p.life = def.life; p.maxLife = def.life; p.age = 0; p.hitsLeft = def.hits; p.hitTimer = 0;
    p.serial = ++this.m.serial; p.clash = 0; p.srcMove = owner.mv ? owner.mv.id : null; p.cmd = !!(owner.mv && owner.mv.cmd);
    /* ため撃ち（def.chargeScale）: ためた量 k(0〜1) で速さ・大きさ・威力・ヒット数が増える */
    p.sc = 1; p.hit = null; p.pri = def.priority;
    const cs = def.chargeScale, mv = owner.mv;
    if (cs && mv && mv.m.charge) {
      const k = Math.min(1, (mv.charge || 0) / mv.m.charge.max), L = (a) => a[0] + (a[1] - a[0]) * k;
      p.k = k;
      if (cs.vx) p.vx = L(cs.vx) * dir;
      if (cs.size) p.sc = L(cs.size);
      if (cs.hits) p.hitsLeft = Math.round(L(cs.hits));
      if (cs.dmg) { p.hit = Object.assign({}, def.hit, { damage: Math.round(def.hit.damage * L(cs.dmg)), chip: Math.round((def.hit.chip || 0) * L(cs.dmg)) }); }
      /* chargeScale.beat {k, priority}: k 以上ためると相殺の強さが上がる（提灯: ためた鬼火は普通の弾に勝って進む） */
      if (cs.beat && k >= cs.beat.k) p.pri = cs.beat.priority;
      if (k >= 1 && cs.full) p.hit = Object.assign({}, p.hit || def.hit, cs.full);
    }
    if (!slot) this.list.push(p);
    return true;
  }
  boxWorld(p) {
    const b = p.def.box;
    if (!b) return null;
    const k = p.sc || 1;
    const x0 = p.x + (p.dir > 0 ? b.x * k : -(b.x + b.w) * k);
    return [x0, p.y + b.y * k, x0 + b.w * k, p.y + (b.y + b.h) * k];
  }
  step() {
    const L = this.list;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      if (!p.alive) continue;

    if (A.state !== 'ATTACK' || A.mv !== t.mv || t.mv.thrown) return;
    if (struck[A.slot]) return;
    if (!D.canBeThrown(def.combo)) return;
    const comboed = D.state === 'HITSTUN';
    const tech = def.techable && (
      (D.buf.frame - D.throwInputFrame() <= CFG.THROW_TECH) ||
      (D.state === 'ATTACK' && D.mv && D.mv.m.throw && D.mv.n <= D.mv.m.startup + D.mv.m.active));
    if (tech) { this.techBoth(A, D); return; }
    const m = this.m;
    t.mv.thrown = true;
    A.mv = null; A.vx = 0;
    /* 空中からつかんだとき（八咫烏の急降下）は、その場で着地してから投げる */
    if (A.y > 0.001) { A.y = 0; A.vy = 0; }
    A.setState('GRAB', def.attackerClip, 1, true);
    /* 後ろ投げ: 通常投げを ← を押しながら出すと、相手を頭の上を越えて背中側へ投げる（位置を入れ替えて画面端へ追い込める） */
    A.grab = { def: def, target: D, g: 0, back: !!t.mv.backThrow, comboed: comboed };
    A.usedInCombo = {};
    A.usedMoves.throwHit = (A.usedMoves.throwHit || 0) + 1;
    D.mv = null; D.vx = 0; D.kb.i = 10; D.thrownBy = A;
    D.setState('THROWN', 'thrown', 2, true);
    D.combo = { techs: 1, hits: 0, dmg: 0, serial: t.mv.serial };
    const hp = holdAt(def.hold, 0);
    /* 壁際: 掴んだ瞬間も、掴まれた側が壁の外に出るなら投げた側を内側へずらす（grabUpdate と同じ） */
    let tx = A.x + A.facing * hp.x;
    const over = tx - Util.clamp(tx, CFG.WALL_MIN, CFG.WALL_MAX);
    if (over !== 0) { A.x = Util.clamp(A.x - over, CFG.WALL_MIN, CFG.WALL_MAX); tx = Util.clamp(A.x + A.facing * hp.x, CFG.WALL_MIN, CFG.WALL_MAX); }
    D.x = tx; D.y = Math.max(0, hp.y); D.facing = -A.facing; D.pup.rotOv = hp.rot;
    A.hitstop = CFG.THROW_HITSTOP; A.hitstopTotal = CFG.THROW_HITSTOP;
    D.hitstop = CFG.THROW_HITSTOP; D.hitstopTotal = CFG.THROW_HITSTOP; D.hitstopHit = true;
    D.pup.onHit(2, A.facing);
    m.fx.sfx('grab', A.x);
    m.fx.guard({ x: (A.x + D.x) / 2, y: 90, impact: 2, dir: A.facing, att: A, def: D, grab: true });
  }
  techBoth(A, D) {
    const m = this.m;
    [A, D].forEach((f, i) => {
      const o = i === 0 ? D : A;
      const dir = f.x >= o.x ? 1 : -1;
      f.mv = null; f.vx = 0;
      f.setState('HITSTUN', 'hurtHigh', 1, true);
      f.hitCrouch = false; f.stunLeft = CFG.THROW_TECH_STUN;
      f.kb = { total: CFG.THROW_TECH_PUSH, dir: dir, i: 0 }; f.kbSrc = null;
      f.hitstop = Math.max(f.hitstop, 6); f.hitstopTotal = Math.max(f.hitstopTotal, 6);
      f.lastTeched = m.frame;
    });
    m.fx.sfx('block', (A.x + D.x) / 2);
    m.fx.throwTech((A.x + D.x) / 2, 90);
  }
  /* 投げの解放（ダメージ + 打ち上げ） */
  /* passive.desperate（背水）: 体力が最大の from（割合）を下回った分だけ、攻撃力が最大 1+desperate 倍まで上がる */
  boost(A) {
    const pv = A.ch.passive;
    if (!pv || !pv.desperate) return 1;
    return 1 + pv.desperate * Util.clamp(1 - A.hp / (A.maxHp * (pv.from || 0.5)), 0, 1);
  }
  /* passive.drain: 与えたダメージの一部で体力が回復する（今は使うキャラなし） */
  drain(A, dmg) {
    const pv = A.ch.passive;
    if (!pv || !pv.drain || A.hp <= 0) return;
    const h = Math.min(A.maxHp - A.hp, Math.max(1, Math.round(dmg * pv.drain)));
    if (h > 0) { A.hp += h; this.m.fx.drain(A, h); }
  }
  releaseThrow(A, D, def) {
    const m = this.m;
    D.pup.rotOv = null; D.thrownBy = null;
    /* コンボの途中でつかんだとき（throw.combo）は威力を comboScale 倍 */
    const scale = Math.max(CFG.COMBO_SCALE[0], 0.5) * (A.grab && A.grab.comboed ? (def.comboScale || 0.75) : 1);
    const dmg = Math.max(1, Math.round(def.damage * scale * (A.st.dmgMul || 1) * this.boost(A)));
    D.hp = Math.max(0, D.hp - dmg); D.dmgRound += dmg;
    this.drain(A, dmg);
    D.combo.hits = 1; D.combo.dmg = dmg; D.combo.seq = ['throw'];
    m.noteCombo(A.slot, 1);
    this.addGauge(A, def.gauge ? def.gauge.hit : 0); this.addGauge(D, Math.floor(dmg * 0.6));
    const ko = D.hp <= 0;
    if (ko) D.ko = true;
    D.setState('AIR_HURT', 'hurtAir', 1, true);
    D.vx = def.launch.vx * (A.grab && A.grab.back ? -A.facing : A.facing); D.vy = def.launch.vy; if (D.y <= 0) D.y = 0.01;
    D.juggle = CFG.JUGGLE_DEFAULT; D.kb.i = 10;
    const hs = ko ? CFG.KO_HITSTOP : def.hitstop;
    A.hitstop = Math.max(A.hitstop, hs); A.hitstopTotal = A.hitstop;
    D.hitstop = Math.max(D.hitstop, hs); D.hitstopTotal = D.hitstop; D.hitstopHit = true;
    D.pup.onHit(def.impact, A.facing);
    D.pup.kickChains(A.facing * (1.5 + def.impact * 1.2), 0.6 * def.impact);
    A.hitMoves.throw = (A.hitMoves.throw || 0) + 1;
    m.fx.hit({ x: D.x, y: Math.max(40, D.y + 60), impact: def.impact, dir: A.facing, att: A, def: D, ko: ko, superHit: false, dmg: dmg, thrown: true });
    m.fx.sfx('throwImpact', D.x);
  }
}

const Physics = {
  limits(m, f) {
    let lo = CFG.WALL_MIN, hi = CFG.WALL_MAX;
    if (m.useCamLimit) {
      const cam = m.cam, vw = CFG.W / cam.zoom;
      lo = Math.max(lo, cam.x - vw / 2 + CFG.CAM_MARGIN);
      hi = Math.min(hi, cam.x + vw / 2 - CFG.CAM_MARGIN);
    }
    const o = m.opp(f);
    lo = Math.max(lo, o.x - CFG.MAX_DIST); hi = Math.min(hi, o.x + CFG.MAX_DIST);
    return [lo, hi];
  },
  /* 横移動。外側へは制限に達したら止まるが、すでに外にいる場合は内側へ引き戻さない */
  moveX(m, f, dx) {
    if (dx === 0) return 0;
    const lim = this.limits(m, f);
    let nx = f.x + dx;
    if (lim[0] <= lim[1]) {
      if (dx > 0 && nx > lim[1]) nx = Math.max(f.x, lim[1]);
      else if (dx < 0 && nx < lim[0]) nx = Math.min(f.x, lim[0]);
    }
    nx = Util.clamp(nx, CFG.WALL_MIN, CFG.WALL_MAX);
    const actual = nx - f.x;
    f.x = nx;
    return actual;
  },
  step(m) {
    const F = m.fighters;
    for (let i = 0; i < 2; i++) {
      const f = F[i];
      if (f.state === 'THROWN') continue;
      const dx = f.dx;
      if (dx !== 0) {
        const actual = this.moveX(m, f, dx);
        const left = dx - actual;
        if (f.kbPart !== 0 && f.kbSrc && Math.abs(left) > 1e-6 && Util.sgn(left) === Util.sgn(f.kbPart)) {
          const lk = Util.sgn(f.kbPart) * Math.min(Math.abs(left), Math.abs(f.kbPart));
          this.moveX(m, f.kbSrc, -lk);
        }
      }
    }
    this.pushApart(m);
    const a = F[0], b = F[1];
    if (a.x !== b.x) m.leftIdx = a.x < b.x ? 0 : 1;
  },
  pushApart(m) {
    const F = m.fighters, a = F[0], b = F[1];
    if (a.state === 'THROWN' || b.state === 'THROWN' || a.state === 'GRAB' || b.state === 'GRAB') return;
    const pa = a.pushDims(), pb = b.pushDims();
    if (a.y >= pb.h || b.y >= pa.h) return;
    const dx = b.x - a.x, need = (pa.w + pb.w) / 2, ov = need - Math.abs(dx);
    if (ov <= 0) return;
    const dirA = Math.abs(dx) < 0.01 ? (m.leftIdx === 0 ? -1 : 1) : (dx > 0 ? -1 : 1);
    const share = Math.min(ov / 2, CFG.PUSH_MAX);
    const ma = this.moveX(m, a, dirA * share), mb = this.moveX(m, b, -dirA * share);
    let rem = ov - Math.abs(ma) - Math.abs(mb);
    if (rem > 0.01) {
      const mb2 = this.moveX(m, b, -dirA * Math.min(rem, CFG.PUSH_MAX));
      rem -= Math.abs(mb2);
      if (rem > 0.01) this.moveX(m, a, dirA * Math.min(rem, CFG.PUSH_MAX));
    }
  }
};

class Camera {
  constructor() {
    this.x = 640; this.zoom = 1; this.y = 0; this.px = 640; this.pz = 1; this.py = 0;
  }
  snap(a, b) {
    this.target(a, b);
    this.x = this.tx; this.zoom = this.tz; this.y = this.ty;
    this.px = this.x; this.pz = this.zoom; this.py = this.y;
  }
  target(a, b) {
    const dist = Math.abs(a.x - b.x);
    const viewW = Util.clamp(dist + 440, 768, 960);
    this.tz = CFG.W / viewW;
    this.tx = (a.x + b.x) / 2;
    const top = Math.max(a.y, b.y);
    this.ty = Math.min(40, Math.max(0, top - 120) * 0.35);
  }
  update(a, b) {
    this.px = this.x; this.pz = this.zoom; this.py = this.y;
    this.target(a, b);
    this.zoom += (this.tz - this.zoom) * CFG.CAM_FOLLOW_Z;
    this.x += (this.tx - this.x) * CFG.CAM_FOLLOW_X;
    this.y += (this.ty - this.y) * 0.10;
    const hw = CFG.W / this.zoom / 2;
    this.x = Util.clamp(this.x, hw, CFG.WORLD_W - hw);
  }
  view(alpha, out) {
    out.x = this.px + (this.x - this.px) * alpha;
    out.zoom = this.pz + (this.zoom - this.pz) * alpha;
    out.y = this.py + (this.y - this.py) * alpha;
    return out;
  }
}

class Match {
  /* o: { rts:[rt,rt], pal2:[b,b], easy:[b,b], rounds, time, seed, fx, camLimit } */
  constructor(o) {
    this.fx = o.fx || NullFX;
    this.rng = new Rng(o.seed || 1);
    this.serial = 0; this.freeze = 0; this.freezeT = 0; this.flashSlot = -1; this.frame = 0; this.front = 0;
    this.need = o.rounds || 2; this.timeMax = o.time == null ? 99 : o.time;
    this.useCamLimit = o.camLimit !== false;
    this.leftIdx = 0;
    this.projs = new Projectiles(this);
    this.combat = new Combat(this);
    this.cam = new Camera();
    this.fighters = [new Fighter(this, 0, o.rts[0], !!o.pal2[0], o.easy[0]), new Fighter(this, 1, o.rts[1], !!o.pal2[1], o.easy[1])];
    this.round = 0; this.overtime = false; this.ended = false; this.result = null;
    this.wins = [0, 0]; this.lostTo = [0, 0]; this.perfect = [0, 0]; this.maxCombo = [0, 0];
    this.roundLog = [];
    this.phase = 'NONE'; this.phaseT = 0; this.koWinner = -2; this.timeUp = false; this.lastTimeUp = false;
    this.timer = 0; this.tickF = 0; this.roundWinner = -2; this.perfectNow = false;
    this.startRound();
  }
  opp(f) { return this.fighters[1 - f.slot]; }
  noteCombo(slot, hits) { if (hits > this.maxCombo[slot]) this.maxCombo[slot] = hits; }
  timeScale() { return this.phase === 'KO' ? CFG.KO_SLOW_SCALE : 1; }
  controlsOn() { return this.phase === 'READY' || this.phase === 'FIGHTING'; }
  isFinalRound() { return this.overtime || (this.wins[0] === this.need - 1 && this.wins[1] === this.need - 1); }
  startRound() {
    this.round++;
    const F = this.fighters;
    F[0].resetRound(this.overtime); F[1].resetRound(this.overtime);
    this.projs.clear();
    this.cam.snap(F[0], F[1]);
    this.timer = this.overtime ? 99 : this.timeMax;
    this.tickF = 0; this.koWinner = -2; this.timeUp = false; this.roundWinner = -2; this.perfectNow = false;
    this.freeze = 0; this.deficit = [0, 0]; this.koBySuper = false; this.roundTag = '';
    this.enter('ROUND_INTRO');
  }
  enter(ph) {
    this.phase = ph; this.phaseT = 0;
    const F = this.fighters;
    switch (ph) {
      case 'ROUND_INTRO': this.fx.sfx('roundStart', 640); this.fx.roundStart(this); break;
      case 'READY':
        F[0].toNeutral(); F[1].toNeutral();
        this.fx.sfx('fight', 640);
        break;
      case 'FIGHTING': break;
      case 'KO': {
        const W = this.koWinner >= 0 ? F[this.koWinner] : null;
        this.koBySuper = !!(W && ((W.mv && W.mv.id === 'super') || W.state === 'SUPERFLASH'));
        this.fx.ko(this, this.koWinner);
        break;
      }
      case 'TIME_UP': {
        this.timeUp = true;
        const r0 = F[0].hp / F[0].maxHp, r1 = F[1].hp / F[1].maxHp;
        this.koWinner = Math.abs(r0 - r1) < 1e-9 ? -1 : (r0 > r1 ? 0 : 1);
        if (this.koWinner >= 0) F[1 - this.koWinner].timeLoser = true;
        this.fx.sfx('timeup', 640);
        break;
      }
      case 'ROUND_END': this.endRound(); break;
      case 'MATCH_END': break;
      default: break;
    }
  }
  endRound() {
    const F = this.fighters, w = this.koWinner;
    this.roundWinner = w;
    this.lastTimeUp = this.timeUp;
    this.projs.clear();
    if (w >= 0) {
      this.wins[w]++; this.lostTo[1 - w]++;
      F[w].setWin(); F[1 - w].setLose();
      if (F[w].dmgRound === 0) { this.perfect[w]++; this.perfectNow = true; }
      /* 決着の特別表示（パーフェクトが最優先） */
      else if (this.koBySuper && !this.timeUp) this.roundTag = '大祓フィニッシュ！';
      else if ((this.deficit[w] || 0) >= 0.4) { this.roundTag = '大逆転！'; this.comebacks = (this.comebacks || 0) + 1; }
      else if (F[w].hp / F[w].maxHp <= 0.12) this.roundTag = 'ギリギリ勝利！';
      this.fx.sfx('win', 640);
    } else {
      this.wins[0]++; this.wins[1]++;
      F[0].setLose(); F[1].setLose();
    }
    this.roundLog.push({ round: this.round, winner: w, timeUp: this.timeUp, hp: [F[0].hp, F[1].hp], perfect: this.perfectNow });
  }
  finish(winner) {
    const F = this.fighters;
    let pts = 0;
    if (winner >= 0) {
      const f = F[winner];
      pts = Math.round(f.hp / f.maxHp * 60) + (this.lostTo[winner] === 0 ? 25 : 0) + (this.perfect[winner] > 0 ? 15 : 0);
      if (this.lastTimeUp) pts -= 10;
      if (this.comebacks) pts += 10;
      pts = Util.clamp(pts, 0, 100);
    }
    this.result = {
      winner: winner, draw: winner < 0, wins: this.wins.slice(), winPoints: pts, timeUp: this.lastTimeUp,
      hpPct: [Math.round(F[0].hp / F[0].maxHp * 100), Math.round(F[1].hp / F[1].maxHp * 100)],
      maxCombo: this.maxCombo.slice(), perfect: this.perfect.slice(), rounds: this.round
    };
    this.enter('MATCH_END');
  }
  nextOrEnd() {
    const need = this.need, w0 = this.wins[0], w1 = this.wins[1];
    if (this.overtime) { this.finish(this.roundWinner); return; }
    if (w0 >= need || w1 >= need) {
      if (w0 >= need && w1 >= need && w0 === w1) { this.overtime = true; this.startRound(); }
      else this.finish(w0 > w1 ? 0 : 1);
      return;
    }
    this.startRound();
  }
  combatOn() { return this.phase === 'READY' || this.phase === 'FIGHTING'; }

  /* 1ロジックステップ。masks: 各スロットの入力マスク */
  step(masks) {
    this.frame++;
    const F = this.fighters, ctl = this.controlsOn();
    for (let i = 0; i < 2; i++) F[i].buf.push(ctl ? (masks[i] | 0) : 0, F[i].facing, F[i].hitstop > 0 || this.freeze > 0);
    if (this.freeze > 0) { this.freeze--; this.freezeT++; if (this.freeze === 0) this.freezeT = 0; return; }
    this.phaseT++;
    switch (this.phase) {
      case 'ROUND_INTRO':
        if (this.phaseT === 12) { F[0].setIntro(); F[1].setIntro(); }
        if (this.phaseT >= CFG.PH.ROUND_INTRO) this.enter('READY');
        break;
      case 'READY':
        if (this.phaseT >= CFG.PH.READY) this.enter('FIGHTING');
        break;
      case 'FIGHTING':
        if (this.timer > 0 || this.overtime || this.timeMax > 0) {
          this.tickF++;
          if (this.tickF >= 60) {
            this.tickF = 0; this.timer--;
            if (this.timer <= 10 && this.timer > 0) this.fx.sfx('tick', 640);
            if (this.timer <= 0) { this.timer = 0; this.enter('TIME_UP'); }
          }
        }
        break;
      case 'KO': if (this.phaseT >= CFG.PH.KO) this.enter('ROUND_END'); break;
      case 'TIME_UP': if (this.phaseT >= CFG.PH.TIME_UP) this.enter('ROUND_END'); break;
      case 'ROUND_END': if (this.phaseT >= CFG.PH.ROUND_END) this.nextOrEnd(); break;
      case 'MATCH_END': if (this.phaseT >= CFG.PH.MATCH_END) this.ended = true; break;
      default: break;
    }
    this.simStep();
    if (this.phase === 'FIGHTING' && this.deficit) {
      for (let i = 0; i < 2; i++) { const a = F[i], o = F[1 - i], d = o.hp / o.maxHp - a.hp / a.maxHp; if (d > this.deficit[i]) this.deficit[i] = d; }
    }
    if (this.combatOn()) {
      const d0 = F[0].hp <= 0, d1 = F[1].hp <= 0;
      if (d0 || d1) { this.koWinner = (d0 && d1) ? -1 : (d0 ? 1 : 0); this.enter('KO'); }
    }
  }
  simStep() {
    const F = this.fighters, frozen = [false, false];
    for (let i = 0; i < 2; i++) { F[i].pup.beginStep(); F[i].dx = 0; F[i].kbPart = 0; }
    for (let i = 0; i < 2; i++) {
      if (F[i].hitstop > 0) { F[i].hitstop--; frozen[i] = true; }
      else F[i].update(F[1 - i]);
    }
    Physics.step(this);
    this.projs.step();
    if (this.combatOn()) this.combat.resolve();
    for (let i = 0; i < 2; i++) {
      const f = F[i], o = F[1 - i];
      if ((FREE_ST[f.state] || f.state === 'LANDING') && Math.abs(o.x - f.x) > 0.5) f.facing = o.x >= f.x ? 1 : -1;
      const p = f.pup;
      p.x = f.x; p.y = f.y; p.facing = f.facing;
      if (f.mv && f.mv.m.trail && f.state === 'ATTACK') {
        const mm = f.mv.m;
        if (f.mv.n > mm.startup + mm.active + mm.trail.frames && p.trail.length) p.trail.pop();
      } else if (p.trail.length) p.trail.pop();
      p.commit(false, frozen[i]);
      p.shakeAmp = f.hitstop > 0 ? (f.hitstopHit ? p.rt.feel.hitShake.amp[Util.clamp((f.lastImpact || 1) - 1, 0, 3)] * (0.4 + 0.6 * f.hitstop / Math.max(1, f.hitstopTotal)) : 0.5) : 0;
      /* 残像（ダッシュ・突進・超必殺中） */
      if (!frozen[i]) {
        const fast = f.state === 'DASH_F' || (f.state === 'ATTACK' && f.mv && (f.mv.m.kind === 'super' || (f.mv.m.motion && Math.abs(f.vx) > 5)));
        if (fast) {
          if (++p.ghostTick % 3 === 0) {
            p.ghosts.unshift({ pose: new Float64Array(p.cp.pose), plant: p.cp.plant, x: f.x, y: f.y, facing: f.facing, age: 0 });
            if (p.ghosts.length > 4) p.ghosts.pop();
          }
        } else p.ghostTick = 0;
        for (let k = p.ghosts.length - 1; k >= 0; k--) { p.ghosts[k].age++; if (p.ghosts[k].age > 14) p.ghosts.splice(k, 1); }
      }
    }
    this.cam.update(F[0], F[1]);
  }
  /* ステートのハッシュ（決定論テスト用） */
  hash() {
    const F = this.fighters;
    let s = this.frame + '|' + this.round + '|' + this.wins.join(',');
    for (let i = 0; i < 2; i++) s += '|' + F[i].hp + ',' + F[i].gauge + ',' + F[i].x.toFixed(3) + ',' + F[i].y.toFixed(3) + ',' + F[i].state;
    return Util.hash32(s).toString(16);
  }
}

/* ================================================================
 * S6  Audio (Web Audio 合成) / FX（パーティクル・リング・揺れ・グリッチ）
 * ================================================================ */
/* ================================================================
 * BGM: 琴・三味線・尺八・太鼓・鈴の実録音（bgm_kit.js, CC0）を音程を変えて並べて鳴らす。
 * bgm_kit.js が無い/読めないときは合成音で代わりに鳴らす。
 * 都節音階（D Eb G A Bb）。1 小節 = 16 ステップ。曲は小節の配列で、loop 小節目から繰り返す。
 *   title  : ゆっくり。尺八の旋律 + 琴のアルペジオ + 鈴
 *   select : 中くらい。三味線の刻み + 琴 + 軽い太鼓

/* ---------------- FX ---------------- */
const FX = {
  t: 0, parts: [], rings: [], texts: [], glitchWords: ['SEGFAULT', 'NULL', '404'],
  shakeAmp: 0, shakeDur: 0, shakeT: 0, flashA: 0, flashColor: '#ffffff', flashDecay: 4,
  punch: 0, punchT: 0, skyFlash: 0, cutin: null, debug: false, purify: [], koBanner: null,
  pulse: 0, scale: 1, hitFlash: 0, impacts: [], impactDim: 0,
  reset() {
    this.hitFlash = 0;
    this.parts.length = 0; this.rings.length = 0; this.texts.length = 0; this.purify.length = 0; this.impacts.length = 0; this.impactDim = 0;
    this.shakeAmp = 0; this.flashA = 0; this.punch = 0; this.skyFlash = 0; this.cutin = null; this.koBanner = null;
  },
  sfx(name, x) {
    const pan = x == null ? 0 : Util.clamp((x - 640) / 640, -1, 1) * 0.4;
    Audio.play(name, { pan: pan });
  },
  addPart(x, y, vx, vy, life, size, color, kind, g, extra) {
    if (this.parts.length >= CFG.POOL.part) this.parts.shift();
    const p = { x: x, y: y, vx: vx, vy: vy, life: life, max: life, size: size, color: color, kind: kind, g: g || 0, drag: 0.96, ch: '' };
    if (extra) for (const k in extra) p[k] = extra[k];
    this.parts.push(p);
    return p;
  },
  addRing(x, y, r0, r1, life, color, w, kind) {
    this.rings.push({ x: x, y: y, r0: r0, r1: r1, life: life, max: life, color: color, w: w || 3, kind: kind || 'ring', rot: fxRng.range(0, 6.28) });
    if (this.rings.length > 40) this.rings.shift();
  },
  /* 衝撃の瞬間: 当たった所に大きな白い星形、背景を一瞬だけ暗くしてキャラを浮かせる */
  addImpact(x, y, color, size, dim) {
    this.impacts.push({ x: x, y: y, color: color, size: size, life: 9, max: 9, rot: fxRng.range(0, 6.28) });
    if (this.impacts.length > 6) this.impacts.shift();
    this.impactDim = Math.max(this.impactDim, dim);
  },
  addText(text, x, y, color, size, life, vy, font) {
    this.texts.push({ text: text, x: x, y: y, vy: vy || 0.6, life: life || 40, max: life || 40, color: color || '#ffffff', size: size || 14, font: font || 'en' });
    if (this.texts.length > CFG.POOL.text) this.texts.shift();
  },
  shake(amp, frames) {
    if (!Settings.data.shake) return;
    if (amp >= this.shakeAmp * (1 - this.shakeT / Math.max(1, this.shakeDur))) { this.shakeAmp = amp; this.shakeDur = frames / 60; this.shakeT = 0; }
  },
  flash(a, color, decay) { this.flashA = Math.max(this.flashA, a); this.flashColor = color || '#ffffff'; this.flashDecay = decay || 4; },
  shakeOff(out) {
    out.x = 0; out.y = 0;
    if (this.shakeAmp > 0 && this.shakeT < this.shakeDur) {
      const k = Math.exp(-4 * this.shakeT / Math.max(0.01, this.shakeDur)) * (1 - this.shakeT / this.shakeDur);
      const a = this.shakeAmp * k;
      out.x = (fxRng.next() * 2 - 1) * a; out.y = (fxRng.next() * 2 - 1) * a * 0.45;
    }
    return out;
  },
  /* ---- Match からのイベント ---- */
  dust(x, y, dir, n) {
    for (let i = 0; i < n; i++) {
      this.addPart(x + fxRng.range(-8, 8), y + 2, dir * fxRng.range(0.3, 1.8), fxRng.range(0.4, 1.6), fxRng.range(14, 26), fxRng.range(1.5, 3), fxRng.chance(0.5) ? '#19f3ff' : '#8fa3c8', 3, -0.04);
    }
  },
  burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = fxRng.range(0, 6.283), sp = fxRng.range(1.5, 5);
      this.addPart(x, y, Math.cos(a) * sp, Math.sin(a) * sp, fxRng.range(14, 26), fxRng.range(1.5, 3), color, 0, -0.05);
    }
    this.addRing(x, y, 4, 40, 12, color, 2);
  },
  hit(i) {
    const imp = i.impact, att = i.att, def = i.def;
    const col = att.pup.glow();
    const n = [8, 12, 18, 28][imp - 1];
    for (let k = 0; k < n; k++) {
      const a = fxRng.range(0, 6.283), sp = fxRng.range(2, 5 + imp * 2.2);
      this.addPart(i.x, i.y, Math.cos(a) * sp, Math.sin(a) * sp, fxRng.range(8, 16 + imp * 3), fxRng.range(8, 14 + imp * 6), k % 3 === 0 ? '#f4f7ff' : col, 1, -0.02);
    }
    this.addPart(i.x, i.y, 0, 0, 7 + imp, 10 + imp * 7, '#f4f7ff', 4, 0);
    this.addRing(i.x, i.y, 6, 30 + imp * 18, 10 + imp * 2, col, 2 + imp * 0.6);
    this.shake([2, 4, 7, 12][imp - 1], [6, 8, 12, 24][imp - 1]);
    if (imp >= 3) { this.punch = 0.03; this.punchT = 0; this.hitFlash = 1; }
    if (imp >= 3) this.addImpact(i.x, i.y, col, imp >= 4 ? 1.35 : 1, imp >= 4 ? 0.55 : 0.38);
    if (imp >= 4) this.flash(0.35, '#ffffff', 3);
    Audio.play(['hitL', 'hitM', 'hitH', 'hitX'][imp - 1], { pan: Util.clamp((i.x - 640) / 640, -1, 1) * 0.4 });
    if (Settings.data.glitch) {
      const dur = [4, 6, 10, 16][imp - 1] / 60;
      def.pup.glitchEnd = this.t + dur; def.pup.glitchDur = dur; def.pup.glitchPow = imp;
      if (imp >= 2 && fxRng.chance(0.75)) {
        const w = this.glitchWords[fxRng.int(this.glitchWords.length)];
        this.addText(w, i.x + fxRng.range(-30, 30), i.y + fxRng.range(60, 90), fxRng.chance(0.5) ? 'rgba(255,59,92,0.7)' : 'rgba(25,243,255,0.7)', 9 + imp, 20, 0.7, 'mono');
      }
    }
    if (i.ko) { this.skyFlash = 1; this.flash(0.8, '#ffffff', 2); }
  },
  guard(i) {
    const col = '#a8e8ff';
    this.addRing(i.x, i.y, 8, 26 + i.impact * 8, 12, col, 3, 'hex');
    this.addRing(i.x, i.y, 4, 14 + i.impact * 6, 8, '#ffffff', 2, 'ring');
    for (let k = 0; k < 6; k++) {
      const a = fxRng.range(-1.2, 1.2) + (i.dir > 0 ? 0 : Math.PI), sp = fxRng.range(2, 5);
      this.addPart(i.x, i.y, Math.cos(a) * sp, Math.sin(a) * sp, 12, 5, col, 1, 0);

  counter(x, y, att) {

  /* ダウン: 床に広がる衝撃の輪と土ぼこり */
  knockdown(x, f) {
    this.addRing(x, 0, 10, 110, 16, f.pup.glow(), 3, 'floor');

    for (let k = 0; k < 10; k++) { const d = k % 2 ? 1 : -1; this.addPart(x + d * fxRng.range(0, 20), 2, d * fxRng.range(1.5, 4.5), fxRng.range(0.5, 2.2), fxRng.range(16, 28), fxRng.range(2, 3.5), k % 3 ? '#8fa3c8' : f.pup.glow(), 3, -0.06); }

  armor(x, y, def) {

  guardBreak(x, y, def) {

  /* ため: 前に光の粒が吸い込まれる。満タンで MAX */
  charge(f, k) {

  /* 爪痕: 3本の金の引っかき傷が光る。3つたまると「狩り」の合図 */

    for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283; this.addPart(x, y, Math.cos(a) * 5, Math.sin(a) * 5, 26, 3, i % 2 ? '#ffffff' : c, 0, 0); }

  /* 描く解像度の上限（基準 960x540 の何倍まで）。大きい画面でも内部はこれ以下で描き、ブラウザが拡大して表示する */
  QUALITY: { high: 2.0, normal: 1.25, low: 0.9, min: 0.72 },

  BG: { high: 1, normal: 0.8, low: 0.8, min: 0.7 },

  cap: 1.25, autoLevel: 'normal',

  },
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const c = this.canvas;
    c.style.width = this.iw + 'px'; c.style.height = this.ih + 'px';
    const s = Math.min(this.iw / CFG.W, this.ih / CFG.H);
    this.cap = this.capFor();
    const r = Math.min(1, this.cap / Math.max(1e-6, s * dpr));   /* 縮める割合 */
    c.width = Math.max(1, Math.round(this.iw * dpr * r)); c.height = Math.max(1, Math.round(this.ih * dpr * r));

    this.ox = (c.width - CFG.W * this.k) / 2; this.oy = (c.height - CFG.H * this.k) / 2;
  },
  /* 自動: 対戦中に 2 秒ごとの平均フレーム時間を見て、遅ければ画質を下げる（上げるのは 1 段まで） */
  autoT: 0, autoN: 0, autoSum: 0,
  autoTick(dt) {
    if (((Settings.data && Settings.data.quality) || 'auto') !== 'auto' || Game.name !== 'fight') { this.autoN = 0; this.autoSum = 0; return; }
    this.autoSum += dt; this.autoN++;
    if (this.autoSum < 2) return;
    const avg = this.autoSum / this.autoN; this.autoSum = 0; this.autoN = 0;
    /* 60fps を割り続けたら（平均 52fps 未満）1段下げる。自動で下がるのは「最軽量」まで、上がるのは「標準」まで */
    const order = ['min', 'low', 'normal', 'high'], i = order.indexOf(this.autoLevel);
    if (avg > 1 / 52 && i > 0) { this.autoLevel = order[i - 1]; this.resize(); }
    else if (avg < 1 / 75 && i < 2) { this.autoLevel = order[i + 1]; this.resize(); }
  },

    const g = this.ctx;

    g.setTransform(this.k, 0, 0, this.k, this.ox, this.oy);
    g.save(); g.beginPath(); g.rect(0, 0, CFG.W, CFG.H); g.clip();
    return g;
  },
  end() { this.ctx.restore(); }

/* デコ（耳・角・鬣・目など）を ops に追加 */
const _an = [0, 0];
function addDecor(ops, rt, pal, j, d, face) {
  const bi = BONE_IDX[d.attach];
  if (bi == null) return;
  boneAnchor(j, bi, d.at || 'start', d.x || 0, d.y || 0, _an);
  const ax = _an[0], ay = _an[1];
  const col = pal[d.color] || '#ffffff', rho = j.rho[bi] + (d.rot || 0);
  const al = d.alpha == null ? 1 : d.alpha;
  const o = { al: al, br: !!d.glow };
  switch (d.shape) {
    case 'circle': pushOp(ops, 'circ', [ax, ay, d.r], col, true, o); break;
    case 'ellipse': pushOp(ops, 'ell', [ax, ay, d.rx, d.ry, rho], col, true, o); break;
    case 'rect': pushOp(ops, 'poly', polyRect(ax, ay, d.w, d.h, rho), col, true, o); break;
    case 'tri': {
      const pts = [], hw = d.w / 2, hh = d.h / 2;
      [[0, hh], [-hw, -hh], [hw, -hh]].forEach(p => { const q = rot2(p[0], p[1], rho); pts.push(ax + q[0], ay + q[1]); });
      pushOp(ops, 'poly', pts, col, true, o); break;
    }
    case 'poly': {
      const pts = [];
      d.pts.forEach(p => { const q = rot2(p[0], p[1], rho); pts.push(ax + q[0], ay + q[1]); });
      pushOp(ops, 'poly', pts, col, true, o); break;
    }
    case 'line': {
      const q = rot2(d.x2, d.y2, rho);
      o.w = d.w || 2;
      pushOp(ops, 'line', [ax, ay, ax + q[0], ay + q[1]], col, false, o); break;
    }
    case 'text': {

  }
}

/* 揺れ物 (Chain) を ops に追加。ノードは char 空間へ変換 */
function addChain(ops, pal, ch, fxw, fyw, face, alpha) {
  const d = ch.def, n = ch.n;
  const px = [], py = [];
  for (let i = 0; i < n; i++) {
    const wx = ch.rx[i] + (ch.x[i] - ch.rx[i]) * alpha, wy = ch.ry[i] + (ch.y[i] - ch.ry[i]) * alpha;
    px.push((wx - fxw) * face); py.push(wy - fyw);
  }
  const col = pal[d.color] || '#ffffff';
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const i0 = Math.max(0, i - 1), i1 = Math.min(n - 1, i + 1);
    let tx = px[i1] - px[i0], ty = py[i1] - py[i0];
    const tl = Math.sqrt(tx * tx + ty * ty) || 1; tx /= tl; ty /= tl;
    const u = i / (n - 1);
    let w = (d.widthStart + (d.widthEnd - d.widthStart) * u) / 2;
    if (d.style === 'tuft') w = Math.max(0.8, w * (1 - u * 0.55));
    left.push(px[i] - ty * w, py[i] + tx * w);
    right.push(px[i] + ty * w, py[i] - tx * w);
  }
  const pts = [];
  for (let i = 0; i < left.length; i += 2) pts.push(left[i], left[i + 1]);
  for (let i = right.length - 2; i >= 0; i -= 2) pts.push(right[i], right[i + 1]);
  pushOp(ops, 'poly', pts, col, true, { al: 1 });
}

function prop(ops, rt, pal, j) {
  const pr = rt.ch.look.prop;
  if (!pr || pr.kind === 'none') return;
  const col = pal[pr.color] || '#ffd24a';
  const th = (j.th[BONE_IDX.farmF] + (pr.angle || 0)) * DEG;
  const dx = Math.sin(th), dy = -Math.cos(th);
  const hx = j.x[J.HAND_F], hy = j.y[J.HAND_F];
  const len = pr.len, thick = pr.thick || 4;
  if (pr.kind === 'gohei') {
    const tx = hx + dx * len, ty = hy + dy * len;
    pushOp(ops, 'cap', [hx - dx * 6, hy - dy * 6, thick / 2, tx, ty, thick / 2], col, true, {});
    /* 紙垂（ジグザグの紙） */
    const nx = -dy, ny = dx;
    const pts = [];
    const bx = hx + dx * len * 0.78, by = hy + dy * len * 0.78;
    for (let s = 0; s < 4; s++) {
      const u = s / 3, sg = (s % 2 ? 1 : -1);
      pts.push(bx + dx * len * 0.16 * u + nx * (9 + sg * 3), by + dy * len * 0.16 * u + ny * (9 + sg * 3));
    }
    for (let s = 3; s >= 0; s--) {
      const u = s / 3, sg = (s % 2 ? 1 : -1);
      pts.push(bx + dx * len * 0.16 * u + nx * (-1 - sg * 3), by + dy * len * 0.16 * u + ny * (-1 - sg * 3));
    }
    pushOp(ops, 'poly', pts, '#f4f7ff', true, { al: 0.95 });
  } else {
    const tx = hx + dx * len, ty = hy + dy * len;
    pushOp(ops, 'cap', [hx - dx * 8, hy - dy * 8, thick * 0.5, tx, ty, thick * 1.3], col, true, {});
    for (let s = 0; s < 4; s++) {
      const u = 0.55 + s * 0.12;
      pushOp(ops, 'circ', [hx + dx * len * u + -dy * thick * 1.1, hy + dy * len * u + dx * thick * 1.1, 1.6], '#ffe94d', false, { al: 0.9 });
    }

}

/* 1体を描く（ポーズ補間 → FK → 位置/反転/スケール/震えの変換 → drawFighterVisual）。
 * ctx はワールド座標（x 右+, y 下+ で地面=0）に変換済み。ここでは look を読まない。 */
function drawPuppet(ctx, pup, alpha, o) {
  o = o || {};
  const rt = pup.rt;
  const plant = o.pose ? o.plant : pup.renderPoseInto(alpha);
  const pose = o.pose || pup.tmpPose;
  const j = RJ;
  solveRig(rt, pose, plant, j);
  const fx = o.x != null ? o.x : Util.lerp(pup.px, pup.x, alpha);
  const fy = o.y != null ? o.y : Util.lerp(pup.py, pup.y, alpha);
  const face = o.facing != null ? o.facing : pup.facing;
  const sc = o.scale || pup.renderScale(alpha, SCR);
  let shx = 0, shy = 0;
  if (!o.ghost && !o.noShake && pup.shakeAmp > 0) {
    const par = (Math.floor(FX.t * 60) & 1) ? 1 : -1;
    shx = par * pup.shakeAmp; shy = -par * pup.shakeAmp * 0.35;
  }
  ctx.save();
  ctx.translate(fx + shx, -fy + shy);
  if (useMiko(pup)) {
    /* MikoVisual は画面向き(y下+)で描き、facing は自分で反転する。ここでは足元原点のスケール(Feel)だけ掛ける */
    ctx.scale(sc[0], sc[1]);
  } else {
    /* フォールバック描画のキャラ空間: 原点=足元の中心、x=前(+)、y=上(+)。facing=-1 は ctx 側で反転 */
    ctx.scale(face * sc[0], -sc[1]);
  }
  drawFighterVisual(ctx, pup, j, LookAdapter.palette(rt.ch, pup.pal), { fx: fx, fy: fy, face: face, alpha: alpha, ghost: !!o.ghost, ghostA: o.ghostA || 0, lite: !!o.lite });
  ctx.restore();
  return j;
}

/* ---- 影絵＋ネオンの縁（miko_visual.js の MikoVisual）---- */
/* 影絵の形があるキャラは全員これで描く（miko_visual.js に形が無いキャラだけ、下の予備描画） */

function drawMikoVisual(ctx, pup, j, o) {
  /* ChainSim の節を、足元原点・x前+・y下+ の座標へ（補間込み）。残像は固定形で描く */
  let chains = null;
  if (!o.ghost && pup.chains.length) {
    chains = {};
    const a = o.alpha, rx = Util.lerp(pup.px, pup.x, a), ry = Util.lerp(pup.py, pup.y, a), face = o.face;
    for (let i = 0; i < pup.chains.length; i++) {
      const ch = pup.chains[i], nodes = [];
      if (!ch.ready) { chains = null; break; }
      for (let k = 0; k < ch.n; k++) {
        const wx = ch.rx[k] + (ch.x[k] - ch.rx[k]) * a, wy = ch.ry[k] + (ch.y[k] - ch.ry[k]) * a;
        nodes.push([(wx - rx) * face, -(wy - ry)]);
      }
      chains[ch.def.id] = nodes;
    }
  }
  MikoVisual.draw(ctx, j, {
    x: 0, y: 0, facing: o.face, scale: 1, color: LookAdapter.edge(pup.rt.ch, pup.pal), id: pup.rt.id,
    flash: o.ghost ? 0 : pup.flash, alpha: ctx.globalAlpha * (o.ghost ? o.ghostA : 1), chains: chains,
    clip: pup.cp.name, clipT: pup.cp.t, mode: pup.rt.mode, lite: !!o.lite || Display.level() === 'low' || Display.level() === 'min'
  });
}

/* ================================================================
 * VISUAL MODULE（丸ごと差し替え可能）
 * drawFighterVisual(ctx, puppet, joints, palette, opts)
 *   ctx     : キャラ空間（原点=足元、x 前+、y 上+）に変換済み
 *   puppet  : Puppet（puppet.rt = キャラのランタイム、puppet.chains = 二次揺れ、puppet.pal = パレット名）
 *   joints  : solveRig の結果（x[],y[] = 関節座標 J.*、th[]/rho[] = ボーン角）
 *   palette : LookAdapter.palette(ch, puppet.pal)
 *   opts    : { fx, fy, face, alpha, ghost, ghostA }  fx,fy=ワールド位置(揺れ物のノード変換用)
 * look の読み込みはこの関数と、同ブロック内の addDecor / addChain / prop だけで行う。
 * ================================================================ */
const OPS = [];
function drawFighterVisual(ctx, pup, j, pal, opts) {
  if (useMiko(pup)) { drawMikoVisual(ctx, pup, j, opts); return; }
  /* ↓ MikoVisual が無い / miko 以外のキャラ用の予備（ネオン管の幾何学パーツ）。 */

  const o = opts, fx = o.fx, fy = o.fy, face = o.face, alpha = o.alpha;
  const ops = OPS; ops.length = 0;
  const lw = body.limbW;
  const cB = pal[cols.uArm] || '#fff';
  const capLimb = (j0, j1, w, c) => pushOp(ops, 'cap', [j.x[j0], j.y[j0], w[0] / 2, j.x[j1], j.y[j1], w[1] / 2], pal[c] || '#fff', true, {});
  const jointDot = (jj, c) => pushOp(ops, 'circ', [j.x[jj], j.y[jj], 2.6], pal[c] || '#fff', true, { al: 0.9 });
  const decors = look.decor || [], chains = pup.chains;
  const decorPass = (z, attaches) => {
    for (let i = 0; i < decors.length; i++) {
      const d = decors[i];
      if ((d.z || 'front') !== z) continue;
      if (attaches.indexOf(d.attach) < 0) continue;
      addDecor(ops, rt, pal, j, d, face);
    }
  };
  const chainPass = z => {
    for (let i = 0; i < chains.length; i++) if ((chains[i].def.z || 'front') === z) addChain(ops, pal, chains[i], fx, fy, face, alpha);
  };
  const ALL = ['head', 'torso', 'pelvis', 'uarmF', 'farmF', 'uarmB', 'farmB', 'thighF', 'shinF', 'footF', 'thighB', 'shinB', 'footB'];
  const footOp = (aj, tj, c) => {
    const ax = j.x[aj], ay = j.y[aj], tx = j.x[tj], ty = j.y[tj];
    pushOp(ops, 'cap', [ax - (tx - ax) / 3, ay - (ty - ay) / 3, body.footH / 2, tx, ty, body.footH / 2], pal[c] || '#fff', true, {});
  };
  if (!o.ghost) {
    chainPass('back');
    decorPass('back', ALL);
  }
  /* 奥の腕・脚 */
  capLimb(J.SHOULDER, J.ELBOW_B, lw.uArm, cols.uArm); capLimb(J.ELBOW_B, J.HAND_B, lw.fArm, cols.fArm); jointDot(J.ELBOW_B, cols.fArm);
  pushOp(ops, 'circ', [j.x[J.HAND_B], j.y[J.HAND_B], body.handR], pal[cols.hand] || '#fff', true, {});
  capLimb(J.PELVIS, J.KNEE_B, lw.thigh, cols.thigh); capLimb(J.KNEE_B, J.ANKLE_B, lw.shin, cols.shin); jointDot(J.KNEE_B, cols.shin);
  footOp(J.ANKLE_B, J.TOE_B, cols.foot);
  /* 腰・胴 */
  {
    const px = j.x[J.PELVIS], py = j.y[J.PELVIS], nx = j.x[J.NECK], ny = j.y[J.NECK];
    let ax = nx - px, ay = ny - py; const L = Math.sqrt(ax * ax + ay * ay) || 1; ax /= L; ay /= L;
    const pxn = -ay, pyn = ax, wb = body.torsoWBottom / 2, wt = body.torsoWTop / 2;
    const cT = pal[cols.torso] || '#fff';
    pushOp(ops, 'poly', [px - pxn * wb, py - pyn * wb, px + pxn * wb, py + pyn * wb, nx + pxn * wt, ny + pyn * wt, nx - pxn * wt, ny - pyn * wt], cT, true, {});
    pushOp(ops, 'poly', polyRect(px - ax * 2, py - ay * 2, body.torsoWBottom + 8, 16, j.rho[BONE_IDX.torso]), pal[cols.thigh] || cT, true, {});
  }
  if (!o.ghost) decorPass('front', ['torso', 'pelvis']);
  /* 手前の脚 */
  capLimb(J.PELVIS, J.KNEE_F, lw.thigh, cols.thigh); capLimb(J.KNEE_F, J.ANKLE_F, lw.shin, cols.shin); jointDot(J.KNEE_F, cols.shin);
  footOp(J.ANKLE_F, J.TOE_F, cols.foot);
  if (!o.ghost) decorPass('front', ['thighF', 'shinF', 'footF', 'thighB', 'shinB', 'footB']);
  /* 首・頭 */
  {
    const nx = j.x[J.NECK], ny = j.y[J.NECK], hx = j.x[J.HEAD], hy = j.y[J.HEAD];
    let dx = hx - nx, dy = hy - ny; const L = Math.sqrt(dx * dx + dy * dy) || 1;
    const k = (body.neckLen + 2) / L;
    pushOp(ops, 'cap', [nx, ny, 4, nx + dx * k, ny + dy * k, 4], pal[cols.neck] || '#fff', true, {});
    pushOp(ops, 'circ', [hx, hy, body.headR], pal[cols.head] || '#fff', true, {});
  }
  if (!o.ghost) decorPass('front', ['head']);
  /* 手前の腕 */
  capLimb(J.SHOULDER, J.ELBOW_F, lw.uArm, cols.uArm); capLimb(J.ELBOW_F, J.HAND_F, lw.fArm, cols.fArm); jointDot(J.ELBOW_F, cols.fArm);
  pushOp(ops, 'circ', [j.x[J.HAND_F], j.y[J.HAND_F], body.handR], pal[cols.hand] || '#fff', true, {});
  if (!o.ghost) { decorPass('front', ['uarmF', 'farmF', 'uarmB', 'farmB']); prop(ops, rt, pal, j); chainPass('front'); }
  else prop(ops, rt, pal, j);

  if (o.ghost) runOps(ctx, ops, rt.neon, pal.glow, o.ghostA);
  else runOps(ctx, ops, rt.neon, null, 0);
}
/* ===== VISUAL MODULE ここまで ===== */

function drawShadow(ctx, pup, alpha) {
  const x = Util.lerp(pup.px, pup.x, alpha), y = Util.lerp(pup.py, pup.y, alpha);
  const k = Util.clamp(1 - y / 320, 0.25, 1);
  const w = pup.rt.ch.boxes.push.stand.w * 0.95 * k;
  ctx.save();
  ctx.globalAlpha = 0.5 * k * (pup.alpha == null ? 1 : pup.alpha);
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.ellipse(x, 2, w, 7 * k, 0, 0, 6.2832); ctx.fill();
  ctx.globalAlpha *= 0.5;
  ctx.strokeStyle = rgba(pup.glow(), 0.5); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(x, 2, w * 1.05, 7.5 * k, 0, 0, 6.2832); ctx.stroke();
  ctx.restore();
}

/* 残像と軌跡 */
const _gp = new Float64Array(NCH);
function drawGhosts(ctx, pup) {
  const gs = pup.ghosts;
  for (let i = 0; i < gs.length; i++) {
    const g = gs[i], a = 0.28 * Math.max(0, 1 - g.age / 14) * (1 - i * 0.12);
    if (a <= 0.01) continue;
    drawPuppet(ctx, pup, 1, { ghost: true, ghostA: a, pose: g.pose, plant: g.plant, x: g.x, y: g.y, facing: g.facing, scale: [1, 1], noShake: true });
  }
}
function drawTrail(ctx, f) {
  const pup = f.pup, tr = pup.trail, info = pup.trailInfo;

  const col = LookAdapter.paletteColor(pup.rt.ch, pup.pal, info.color) || pup.glow();

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const n = tr.length;
