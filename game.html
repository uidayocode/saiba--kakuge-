      const sc = f.combo.techs > 0 ? CFG.COMBO_SCALE[Math.min(f.combo.techs, 8) - 1].toFixed(2) : '-';
      const lines = [
        'P' + (i + 1) + ' ' + f.state + (f.mv ? ' ' + f.mv.id + ' ' + f.mv.n + '/' + f.mv.total : '') + ' stop:' + f.hitstop,
        'inv:' + (f.invulnLabel() || '-') + ' combo:' + f.combo.hits + ' x' + sc + ' juggle:' + f.juggle + ' adv:' + (f.lastAdv == null ? '-' : f.lastAdv),
        'hp:' + f.hp + ' gauge:' + f.gauge + ' x:' + f.x.toFixed(1) + ' y:' + f.y.toFixed(1) + ' vx:' + f.vx.toFixed(2),
        'dir ' + f.buf.history(32)
      ];
      let btn = '';
      for (let k = 31; k >= 0; k--) {
        const fr = f.buf.frame - k;
        if (fr < 0) { btn += '.'; continue; }
        const mk = f.buf.abs[fr & 63];
        btn += (mk & B_H) ? 'H' : ((mk & B_L) ? 'L' : ((mk & B_S) ? 'S' : ((mk & B_T) ? 'T' : '.')));
      }
      lines.push('btn ' + btn);
      lines.forEach((s, k) => { ctx.fillStyle = 'rgba(0,0,0,0.55)'; const w = ctx.measureText(s).width; ctx.fillRect(i === 0 ? x - 2 : x - w - 2, 96 + k * 12, w + 4, 12); ctx.fillStyle = i === 0 ? '#ff9aa8' : '#9ff6ff'; ctx.fillText(s, x, 97 + k * 12); });
    }
    ctx.restore();
  },
  overlay(ctx) {
    ctx.save();
    ctx.font = '10px ' + FONT_MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const lines = ['FPS ' + this.fps.toFixed(0) + '  steps/s ' + this.sps.toFixed(0) + '  driver: ' + this.driver + '  scene: ' + Game.name];
    const v = this.vres;
    if (v) {
      lines.push('validate: errors ' + v.errors.length + ' / warnings ' + v.warnings.length);
      v.errors.slice(0, 5).forEach(e => lines.push('E ' + e.slice(0, 120)));
      v.warnings.slice(0, 6).forEach(e => lines.push('W ' + e.slice(0, 120)));
    }
    const y0 = Game.name === 'fight' ? 440 : 4;
    lines.forEach((s, k) => {
      const w = ctx.measureText(s).width;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(4, y0 + k * 12, w + 6, 12);
      ctx.fillStyle = s.charAt(0) === 'E' ? '#ff6b8b' : (s.charAt(0) === 'W' ? '#ffd24a' : '#7cff6b'); ctx.fillText(s, 7, y0 + 1 + k * 12);
    });
    ctx.restore();
  }
};

/* ================================================================
 * S9c  Main（起動・固定ステップ + 補間描画のループ・モード分岐・イベント）
 * ================================================================ */
const _errSeen = {};
function reportErr(e, where) {
  const msg = where + ': ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e);
  if (_errSeen[msg]) return;
  _errSeen[msg] = 1;
  console.error(where, e);
  if (window.__showErr) window.__showErr('[' + where + '] ' + (e && e.message ? e.message : e) + (e && e.stack ? '\n' + e.stack.split('\n').slice(1, 4).join('\n') : ''));
  try { Display.canvas.width = Display.canvas.width; } catch (e2) { /* 無視 */ }   /* 描画途中の例外で save/restore が崩れたときに状態を戻す */
}

const Main = {
  last: 0, acc: 0, rafOk: false, started: false,
  stepOnce() {
    Input.step();
    Toast.update();
    const sc = Game.scene;
    if (!sc) return;
    sc.update();
    Game.sceneT++;
    if (Input.idle === 0) Game.idleT = 0; else Game.idleT++;
    const lim = sc.idleLimit;
    if (lim && Game.idleT > lim && Game.scene === sc) { Game.go('title'); }
  },
  frame(now) {
    const t0 = performance.now();
    const realDt = Math.min(Math.max((now - this.last) / 1000, 0), CFG.MAX_DT);
    this.last = now;
    Game.t += realDt;
    try { Display.autoTick(realDt); } catch (e) { /* 無視 */ }
    let steps = 0;
    if (Game.mode === 'game') {
      try { Devices.poll(); } catch (e) { reportErr(e, 'gamepad'); }
      const sc = Game.scene;
      const ts = sc && sc.timeScale ? sc.timeScale() : 1;
      this.acc += realDt * ts;
      while (this.acc >= CFG.STEP && steps < CFG.MAX_STEPS) {
        try { this.stepOnce(); } catch (e) { reportErr(e, 'update'); }
        this.acc -= CFG.STEP; steps++;
      }
      if (steps >= CFG.MAX_STEPS) this.acc = 0;
      this.render(this.acc / CFG.STEP);
      try { FX.update(realDt, sc && sc.fxScale ? sc.fxScale() : (ts < 1 ? 0.5 : 1)); } catch (e) { reportErr(e, 'fx'); }
    }
    this.busy = (this.busy || 0) * 0.9 + (performance.now() - t0) * 0.1;
    Debug.tick(now, steps);
  },
  render(alpha) {
    const g = Display.begin();
    const sc = Game.scene;
    try { if (sc) sc.render(g, alpha); } catch (e) { reportErr(e, 'render'); return; }
    try {
      Overlay.draw(g, Game.t);
      /* F4: 動作の重さの表示（fps・画質・1フレームの処理時間） */
      if (Game.showFps) {
        const L = { high: '高', normal: '標準', low: '低', min: '最軽量' }, lv = Display.level();
        drawText(g, Math.round(Debug.fps) + ' fps  画質:' + (L[lv] || lv) + (((Settings.data && Settings.data.quality) || 'auto') === 'auto' ? '(自動)' : '') + '  処理 ' + (Main.busy || 0).toFixed(1) + 'ms', 8, 14, { size: 12, color: '#7cff6b', font: 'mono' });
      }
      Toast.draw(g);
      if (Debug.on) Debug.overlay(g);
    } catch (e) { reportErr(e, 'overlay'); return; }
    Display.end();
  },
  startLoops() {
    if (this.started) return;
    this.started = true;
    this.last = performance.now();
    const raf = now => { if (Debug.driver === 'timer') return; Main.rafOk = true; Main.frame(now); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
    /* rAF が止まる環境への保険: 500ms 以内に一度も来なければ setTimeout 駆動へ */
    setTimeout(() => {
      if (Main.rafOk) return;
      Debug.driver = 'timer';
      const tm = () => { Main.frame(performance.now()); setTimeout(tm, 16); };
      tm();
    }, 500);
  },
  /* ハッシュに応じたモード分岐。hashchange でも呼ばれる（進行中の試合は破棄） */
  applyMode() {
    HASH = parseHash();
    const p = HASH.p;
    Debug.on = HASH.mode === 'debug' || !!p.debug;
    FX.debug = Debug.on;
    SelfTest.stop();
    FX.reset();
    if (p.seed != null && p.seed !== true) fxRng = new Rng(parseInt(p.seed, 10) || 1);
    if (HASH.mode === 'selftest') {
      Game.mode = 'selftest'; document.title = 'SELFTEST RUNNING';
      SelfTest.start();
    } else if (HASH.mode === 'gallery') {
      Game.mode = 'gallery';
      Gallery.start();
    } else if (HASH.mode === 'play') {
      Game.mode = 'game'; document.title = '電脳奉納試合';
      const r = Game.roster;
      const a = r.indexOf(p.p1) >= 0 ? p.p1 : r[0], b = r.indexOf(p.p2) >= 0 ? p.p2 : r[Math.min(1, r.length - 1)];
      const eff = Settings.eff();
      Game.sel = [a, b]; Game.pal2 = [false, true]; Game.easy = [eff.easy.p1, eff.easy.p2];
      Game.go('versus', { training: !!p.training });
    } else {
      Game.mode = 'game'; document.title = '電脳奉納試合';
      Game.go('boot');
    }
  }
};

function showFatal(v) {
  document.title = 'DATA ERROR';
  const draw = () => {
    const g = Display.begin();
    g.fillStyle = '#12020a'; g.fillRect(0, 0, CFG.W, CFG.H);
    g.textBaseline = 'top'; g.textAlign = 'left';
    g.font = 'bold 40px ' + FONT_EN; g.fillStyle = '#ff2d55'; g.fillText('DATA ERROR', 24, 20);
    g.font = '14px ' + FONT_JP; g.fillStyle = '#ffb3c0';
    g.fillText('data.js の検証でエラーが見つかったため、ゲームを開始できません（' + v.errors.length + ' 件）。', 24, 74);
    g.font = '12px ' + FONT_MONO; g.fillStyle = '#ffd1d9';
    v.errors.slice(0, 22).forEach((e, i) => g.fillText(e.slice(0, 130), 24, 104 + i * 16));
    if (v.errors.length > 22) g.fillText('... ほか ' + (v.errors.length - 22) + ' 件（コンソールに全件あります）', 24, 104 + 22 * 16);
    g.fillStyle = '#8fa3c8'; g.fillText('警告 ' + v.warnings.length + ' 件', 24, 508);
    Display.end();
  };
  draw();
  setInterval(draw, 700);
}

function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  } catch (e) { /* 無視 */ }
}

function boot() {
  Display.init();
  /* ---- 入力イベント ---- */
  window.addEventListener('keydown', e => {
    if (e.code === 'F2') { toggleFullscreen(); e.preventDefault(); return; }
    if (e.code === 'F4') { Game.showFps = !Game.showFps; e.preventDefault(); return; }
    if (e.code === 'F3') { Audio.resume(); Audio.setMute(!Audio.muted); Toast.push(Audio.muted ? 'ミュート' : 'ミュート解除'); e.preventDefault(); return; }
    Audio.resume();
    Keys.onDown(e);
    if (Game.mode === 'gallery') Gallery.onKey(e.code);
  }, true);
  window.addEventListener('keyup', e => { Keys.onUp(e); }, true);
  window.addEventListener('contextmenu', e => e.preventDefault());
  const gest = () => { Game.gesture = true; Audio.resume(); };
  window.addEventListener('pointerdown', gest);
  window.addEventListener('touchstart', gest, { passive: true });
  const lost = () => {
    Keys.clear(); Devices.releaseAll();
    if (Game.name === 'fight') Game.blurPause = true;
  };
  window.addEventListener('blur', lost);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) lost(); else Main.last = performance.now();
  });
  window.addEventListener('gamepadconnected', () => { try { Devices.poll(); } catch (e) { /* 無視 */ } });
  window.addEventListener('gamepaddisconnected', () => { try { Devices.poll(); } catch (e) { /* 無視 */ } });
  window.addEventListener('hashchange', () => { try { Main.applyMode(); } catch (e) { reportErr(e, 'hashchange'); } });
  window.addEventListener('resize', () => { if (Game.mode === 'gallery') setTimeout(() => Gallery.render(), 150); });

  /* ---- データの検証 ---- */
  const D = window.GAME_DATA;
  const v = validateGameData(D);
  Debug.vres = v;
  v.errors.forEach(e => console.error('[validate] ' + e));
  v.warnings.forEach(e => console.warn('[validate] ' + e));
  if (v.errors.length) { showFatal(v); return; }
  Game.data = D;
  Game.roster = D.roster.slice();
  D.roster.forEach(id => { Game.chars[id] = compileCharacter(D.characters[id]); });
  FX.glitchWords = D.texts.glitchWords;
  initStage(D.stage.colors);
  Overlay.build();
  Devices.resolve();
  Game.sel = Game.defaultSel();
  Game.pal2 = [false, true];
  const eff = Settings.eff();
  Game.easy = [eff.easy.p1, eff.easy.p2];
  window.__denno = { Game: Game, Input: Input, Devices: Devices, FX: FX, Debug: Debug, SelfTest: SelfTest, Gallery: Gallery, Settings: Settings, validateGameData: validateGameData, CFG: CFG, Match: Match, NullFX: NullFX, CpuPolicy: CpuPolicy, BGM: BGM, Net: Net, Snap: Snap, NetSession: NetSession, get SV() { return SV; }, Display: Display, PerfOff: PerfOff, Audio: Audio };
  Main.applyMode();
  Main.startLoops();
}

/* フォントは最大1.5秒だけ待って続行（失敗してもフォールバックで動く） */
(function () {
  let done = false;
  const go = () => { if (done) return; done = true; try { boot(); } catch (e) { reportErr(e, 'boot'); } };
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('16px "DotGothic16"', '電脳奉納試合'), document.fonts.load('16px "Orbitron"', '0123')]).then(go, go);
      setTimeout(go, 1500);
    } else go();
  } catch (e) { go(); }
})();
})();
</script>
