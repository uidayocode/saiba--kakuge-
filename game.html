    ctx.strokeStyle = rgba(col, 0.55 * u * u);
    ctx.lineWidth = Math.max(1, info.width * u);
    ctx.beginPath(); ctx.moveTo(tr[i].x, -tr[i].y); ctx.lineTo(tr[i + 1].x, -tr[i + 1].y); ctx.stroke();
    ctx.strokeStyle = rgba('#ffffff', 0.4 * u * u);
    ctx.lineWidth = Math.max(0.5, info.width * u * 0.3);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- 飛び道具 ---------- */
function drawProjectiles(ctx, match, alpha) {
  const L = match.projs.list;
  for (let i = 0; i < L.length; i++) {
    const p = L[i];
    if (!p.alive) continue;
    const d = p.def, lk = d.look, size = (lk.size || 1) * (p.sc || 1);
    const x = Util.lerp(p.px, p.x, alpha), y = Util.lerp(p.py, p.y, alpha);
    const col = LookAdapter.paletteColor(p.owner.rt.ch, p.owner.pup.pal, lk.color) || p.owner.pup.glow();
    ctx.save();
    switch (lk.style) {
      case 'fuda': {
        ctx.translate(x, -y); ctx.scale(p.dir, 1);
        ctx.rotate(Math.sin(p.age * 0.35) * 0.2);
        const w = 26 * size, h = 38 * size;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rgba(col, 0.18); fillRR(ctx, -w * 0.9, -h * 0.75, w * 1.8, h * 1.5, 8); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(8,8,24,0.92)'; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        fillRR(ctx, -w / 2, -h / 2, w, h, 3); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = '#f4f7ff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-w * 0.25, -h * 0.3); ctx.lineTo(w * 0.25, -h * 0.3); ctx.moveTo(0, -h * 0.35); ctx.lineTo(0, h * 0.35);
        ctx.moveTo(-w * 0.25, h * 0.1); ctx.lineTo(w * 0.25, h * 0.2); ctx.stroke();
        /* 尾 */
        ctx.globalCompositeOperation = 'lighter';
        for (let k = 1; k <= 4; k++) { ctx.fillStyle = rgba(col, 0.2 - k * 0.04); ctx.fillRect(-w / 2 - k * 9, -h * 0.22, 8, h * 0.44); }
        break;
      }
      case 'orb': {
        ctx.translate(x, -y);
        ctx.globalCompositeOperation = 'lighter';
        const r = 14 * size;
        for (let k = 3; k >= 1; k--) { ctx.fillStyle = rgba(col, 0.12 * (4 - k)); ctx.beginPath(); ctx.arc(0, 0, r * (0.7 + k * 0.5), 0, 6.283); ctx.fill(); }
        ctx.fillStyle = '#f4f7ff'; ctx.beginPath(); ctx.arc(0, 0, r * 0.45, 0, 6.283); ctx.fill();
        break;
      }
      case 'shock': {
        ctx.translate(x, -y); ctx.scale(p.dir, 1);
        const w = 44 * size, h = 34 * size;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rgba(col, 0.2);
        ctx.beginPath(); ctx.moveTo(-w, 0); ctx.quadraticCurveTo(-w * 0.3, -h * 1.2, w * 0.6, -h * 0.2); ctx.lineTo(w, 0); ctx.closePath(); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(-w, 0); ctx.quadraticCurveTo(-w * 0.3, -h * 1.2, w * 0.6, -h * 0.2); ctx.lineTo(w, 0); ctx.stroke();
        ctx.strokeStyle = '#f4f7ff'; ctx.lineWidth = 1; ctx.stroke();
        for (let k = 1; k <= 3; k++) { ctx.globalAlpha = 0.5 / k; ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(-w - k * 14, 0); ctx.lineTo(-w * 0.2 - k * 14, -h * 0.6 / k); ctx.stroke(); }
        break;
      }

        const len = 360 * size, hgt = 70 * size * k;

    this.layer(ctx, L.near, 0.6, view);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.lanterns.length; i++) {
      const ln = this.lanterns[i], fl = 0.5 + 0.2 * Math.sin(t * 9 + i * 2) + 0.12 * Math.sin(t * 23 + i);
      const zl = this.zl(z, 0.6), r = 120 * zl;
      ctx.globalAlpha = fl * 0.55;
      ctx.drawImage(glowSprite(C.lantern), this.lx(ln.u, 0.6, camX, z) - r, this.ly(ln.v, 0.6, camY, z) - r, r * 2, r * 2);
    }
    ctx.restore();
    this.drawFloor(ctx, view, t);
    /* 狛犬のシルエット */
    this.komainu(ctx, view, 70, 1); this.komainu(ctx, view, 1210, -1);
  },
  drawFloor(ctx, view, t) {
    const z = view.zoom, camX = view.x, camY = view.y, C = this.col;
    const gy = v => 460 + camY + (v - 460) * z;
    const yh = gy(392);
    ctx.save();
    const gr = ctx.createLinearGradient(0, yh, 0, 540);
    gr.addColorStop(0, mixHex(C.floor, '#3a1450', 0.5)); gr.addColorStop(1, C.floor);
    ctx.fillStyle = gr; ctx.fillRect(0, yh, CFG.W, 540 - yh + 2);
    /* 鳥居の反射 */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, yh, CFG.W, 540 - yh); ctx.clip();
    const yBase = this.ly(408, 0.28, camY, z);
    ctx.translate(0, 2 * yBase); ctx.scale(1, -1);
    ctx.globalAlpha = 0.12;
    this.layer(ctx, this.L.mid, 0.28, view);
    ctx.restore();
    /* 参道の中央 */
    const vp = 480;
    const sx = (wx, d) => vp + (480 + (wx - camX) * z - vp) / d;
    ctx.fillStyle = rgba(C.grid, 0.05);
    ctx.beginPath();
    ctx.moveTo(sx(570, 0.45), gy(392 + 68 / 0.45)); ctx.lineTo(sx(570, 12), gy(392 + 68 / 12));
    ctx.lineTo(sx(710, 12), gy(392 + 68 / 12)); ctx.lineTo(sx(710, 0.45), gy(392 + 68 / 0.45)); ctx.closePath(); ctx.fill();
    /* 遠近グリッド */
    ctx.lineWidth = 1.2; ctx.lineCap = 'butt';
    for (let wx = -600; wx <= 1900; wx += 100) {
      const nearD = 0.45, farD = 12;
      ctx.strokeStyle = rgba(C.grid, wx % 400 === 0 ? 0.42 : 0.28);
      ctx.beginPath(); ctx.moveTo(sx(wx, nearD), gy(392 + 68 / nearD)); ctx.lineTo(sx(wx, farD), gy(392 + 68 / farD)); ctx.stroke();
    }
    const ds = [0.5, 0.62, 0.78, 1.0, 1.3, 1.8, 2.7, 4.5, 9];
    for (let i = 0; i < ds.length; i++) {
      const y = gy(392 + 68 / ds[i]);
      ctx.strokeStyle = rgba(C.grid, Util.clamp(0.5 / Math.sqrt(ds[i]), 0.12, 0.42));
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CFG.W, y); ctx.stroke();
    }
    /* 地平線のグロー */
    ctx.globalCompositeOperation = 'lighter';
    const hg = ctx.createLinearGradient(0, yh - 6, 0, yh + 22);
    hg.addColorStop(0, rgba(C.accent, 0)); hg.addColorStop(0.3, rgba(C.accent, 0.22)); hg.addColorStop(1, rgba(C.accent, 0));
    ctx.fillStyle = hg; ctx.fillRect(0, yh - 6, CFG.W, 28);
    ctx.restore();
  },
  komainu(ctx, view, wx, dir) {
    const z = view.zoom, C = this.col;
    ctx.save();
    ctx.translate(480 + (wx - view.x) * z, 460 + view.y);
    ctx.scale(z * dir * 1.5, -z * 1.5);
    ctx.fillStyle = '#0c0a24';
    const pts = [[-34, 0], [-34, 40], [-22, 68], [-26, 96], [-12, 108], [4, 104], [10, 120], [18, 104], [32, 104], [40, 92], [34, 80], [22, 76], [24, 56], [20, 0]];
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = rgba(C.accent, 0.32); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(C.accent, 0.95); ctx.beginPath(); ctx.arc(24, 94, 2.4, 0, 6.2832); ctx.fill();
    ctx.restore();
  },
  /* 前景: 灯籠のボケと舞うデータ片（キャラより手前） */
  drawForeground(ctx, view, t) {
    if (!this.built) return;
    const C = this.col, p = 1.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const wx = ((i * 331 + 120 + t * (3 + i)) % 1600) - 150;
      const x = 480 + (wx - 640 - (view.x - 640) * p) * 1.0, y = 440 + 30 * Math.sin(i * 2 + t * 0.3) + i * 12;
      const r = 70 + (i % 3) * 25;
      ctx.globalAlpha = 0.09;
      ctx.drawImage(glowSprite(i % 2 ? C.lantern : C.accent), x - r, y - r, r * 2, r * 2);
    }
    ctx.restore();
    ctx.save();
    for (let i = 0; i < 26; i++) {
      const sp = 8 + (i % 5) * 3, vy = 24 + (i % 7) * 7;
      let wx = (i * 137.5 + t * sp) % 1700 - 150;
      let y = (i * 61 + t * vy) % 620 - 60;
      const x = 480 + (wx - 640) - (view.x - 640) * p + Math.sin(t * 0.8 + i) * 22;
      ctx.globalAlpha = 0.55;
      if (i % 5 === 0) {
        ctx.fillStyle = '#ffb3d9'; ctx.font = '10px ' + FONT_MONO; ctx.textAlign = 'center';
        ctx.fillText(i % 2 ? '1' : '0', x, y);
      } else {
        ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.9 + i);
        ctx.fillStyle = i % 3 ? '#ffb3d9' : '#ff7fc0'; ctx.fillRect(-2.5, -1.5, 5, 3);
        ctx.restore();
      }
    }
    ctx.restore();
  }
};

/* ================================================================
 * STAGE MODULE の入口（背景は丸ごと差し替え可能）
 *   initStage(colors)                : data.stage.colors を受けて事前描画などをする（起動時に1回）
 *   drawStage(ctx, cam, t, state)    : キャラより奥。ctx は論理960x540のスクリーン座標。
 *       cam   = { x: カメラ中心(ワールドx 0〜1280), zoom: 1.0〜1.25, y: 縦スクロール(px, 下方向+) }
 *               地面(キャラの足元)は画面 y = 460 + cam.y、ズーム中心は (480, 460 + cam.y)
 *       t     = 経過秒（アニメ用）
 *       state = { phase: 'MENU'|'ROUND_INTRO'|'READY'|'FIGHTING'|'KO'|'TIME_UP'|'ROUND_END'|'MATCH_END',
 *                 skyFlash: 0..1 (KOの白い瞬き), superDim: 0..1 (超必殺中の暗転) }
 *   drawStageFront(ctx, cam, t, state): キャラより手前の前景（ボケ・舞う粒）
 * ================================================================ */
/* 現在の実装: stage.js の StageVisual（ネオン鳥居の参道）。無ければ上の Stage（手続き描画）で代用。
 * StageVisual は cam.x だけを受け取るので、ズームと縦スクロールは ctx の変換で与える（キャラと同じ (480, 地面) 中心）。
 * state.reflect(ctx) があれば、地面への映り込みとして呼ぶ（ctx はステージ空間: 地面=GROUND_Y、画面座標）。 */
let SV = null, SV_ID = '';
const SV_CACHE = {};
function initStage(colors, themeId) {
  SV = null;
  if (window.StageVisual) {
    const id = themeId || 'sando';
    try { SV = SV_CACHE[id] || (SV_CACHE[id] = window.StageVisual.create(CFG.W, CFG.H, CFG.GROUND_Y, id)); SV_ID = id; } catch (e) { console.error('StageVisual.create failed', e); SV = null; }
  }
  if (!SV) Stage.build(colors);
}
/* 試合ごとのステージ（設定が「ランダム」なら毎回選び直す） */
function pickStage() {
  const list = window.StageVisual && StageVisual.THEMES ? StageVisual.THEMES.map(x => x.id) : ['sando'];
  const want = Settings.data.stage || 'random';
  const id = want === 'random' ? list[fxRng.int(list.length)] : (list.indexOf(want) >= 0 ? want : 'sando');
  initStage(Game.data.stage.colors, id);
  return id;
}
function svState(s) {
  return { intro: s.intro == null ? 1 : s.intro, ko: s.ko || 0, hit: s.hit || 0, hurry: s.hurry || 0 };
}
function stageXform(ctx, cam, fn) {
  ctx.save();
  ctx.translate(480, CFG.GROUND_Y + cam.y); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-480, -CFG.GROUND_Y);
  fn();
  ctx.restore();
}
const BGC = { c: null, g: null };
function drawStage(ctx, cam, t, state) {
  state = state || {};
  if (!SV) { Stage.draw(ctx, cam, t, state); return; }
  const sc = { x: cam.x - 640 }, st = svState(state);
  st.reflect = state.reflect || null;   /* キャラの映り込みは、ステージの映り込みと一緒に1回で描く */
  /* 背景は画面より少し低い解像度の画像に描いてから、1回で拡大して貼る（重なった大きな画像の拡大が一番重かった） */
  const bs = Display.k * (Display.BG[Display.level()] || 1);
  if (bs >= Display.k - 0.01) { stageXform(ctx, cam, () => SV.draw(ctx, sc, t, st)); return; }
  const w = Math.ceil(CFG.W * bs), h = Math.ceil(CFG.H * bs);
  if (!BGC.c || BGC.c.width !== w || BGC.c.height !== h) { BGC.c = document.createElement('canvas'); BGC.c.width = w; BGC.c.height = h; BGC.g = BGC.c.getContext('2d'); BGC.ok = false; }
  /* 軽い画質（低・最軽量）では、背景を描き直すのは 2 回に 1 回（キャラは毎回）。カメラの寄りが変わったときは描き直す */
  const lv = Display.level(), half = lv === 'low' || lv === 'min';
  BGC.n = (BGC.n || 0) + 1;
  if (half && BGC.ok && (BGC.n & 1) && Math.abs(cam.zoom - BGC.zoom) < 0.01 && Math.abs(cam.y - BGC.cy) < 2 && Math.abs(cam.x - BGC.cx) < 12) {
    ctx.drawImage(BGC.c, 0, 0, w, h, 0, 0, w / bs, h / bs);
    return;
  }
  BGC.ok = true; BGC.zoom = cam.zoom; BGC.cy = cam.y; BGC.cx = cam.x;
  const g = BGC.g;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#05060f'; g.fillRect(0, 0, w, h);
  g.setTransform(bs, 0, 0, bs, 0, 0);
  stageXform(g, cam, () => SV.draw(g, sc, t, st));
  ctx.drawImage(BGC.c, 0, 0, w, h, 0, 0, w / bs, h / bs);
}
function drawStageFront(ctx, cam, t, state) {
  state = state || {};
  if (!SV) { Stage.drawForeground(ctx, cam, t, state); return; }
  const sc = { x: cam.x - 640 }, st = svState(state);
  stageXform(ctx, cam, () => SV.drawFront(ctx, sc, t, st));
}

/* 走査線とヴィネットの事前描画 */
const Overlay = {
  c: null, built: false,
  build() {
    const q = Math.min(window.devicePixelRatio || 1, 2);
    const c = document.createElement('canvas');
    c.width = Math.round(CFG.W * q); c.height = Math.round(CFG.H * q);
    const g = c.getContext('2d'); g.scale(q, q);
    const vg = g.createRadialGradient(480, 270, 240, 480, 270, 640);
    vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,10,0.62)');
    g.fillStyle = vg; g.fillRect(0, 0, CFG.W, CFG.H);
    this.c = c;
    const s = document.createElement('canvas');
    s.width = Math.round(CFG.W * q); s.height = Math.round(CFG.H * q);
    const sg = s.getContext('2d'); sg.scale(q, q);
    sg.fillStyle = 'rgba(0,0,0,0.20)';
    for (let y = 0; y < CFG.H; y += 3) sg.fillRect(0, y, CFG.W, 1);
    this.scan = s;
    this.built = true;
  },
  draw(ctx, t) {
    if (!this.built) this.build();
    if (!SV) ctx.drawImage(this.c, 0, 0, CFG.W, CFG.H);    /* StageVisual は自前で周辺減光を描く */
    if (Settings.data.scanline) {
      ctx.save();
      ctx.globalAlpha = 0.25;
      ctx.drawImage(this.scan, 0, 0, CFG.W, CFG.H);
      ctx.restore();
    }
  }
};

/* ================================================================
 * S8a  Game / UI部品 / Boot・Title・Howto・Settings
 * ================================================================ */
const Game = {
  data: null, chars: {}, roster: [], scenes: {}, scene: null, name: '', sceneT: 0, idleT: 0, t: 0,
  sel: ['', ''], pal2: [false, true], easy: [true, true], result: null, matchArgs: null, gesture: false,
  go(name, args) {
    if (this.scene && this.scene.exit) { try { this.scene.exit(); } catch (e) { console.error(e); } }
    this.name = name; this.scene = this.scenes[name]; this.sceneT = 0; this.idleT = 0;
    Input.lockFor(CFG.INPUT_LOCK);
    Input.navRep.prev = 0;
    this.scene.enter(args || {});
    /* 場面ごとの BGM（テスト・ギャラリーでは鳴らさない） */
    if (this.mode === 'game') {
      if (name === 'versus' || name === 'fight') BGM.play('fight');
      else if (name === 'charSelect' || name === 'cpuSelect') { BGM.play('select'); BGM.setHurry(false); }
      else if (name !== 'boot') { BGM.play('title'); BGM.setHurry(false); }
    }
  },
  charName(id) { return this.chars[id] ? this.chars[id].ch.name : id; },
  /* ロスターの先頭から。1体なら同キャラ対戦 */
  /* CPU 戦の相手: 自分と違うキャラ（できれば直前の相手とも違うキャラ）をランダムに */
  pickCpuOpp(me, prev) {
    let c = this.roster.filter(id => id !== me && id !== prev);
    if (!c.length) c = this.roster.filter(id => id !== me);
    if (!c.length) c = this.roster.slice();
    return c[fxRng.int(c.length)];
  },
  defaultSel() {
    const last = Store.get('last', null);
    const r = this.roster;
    const ok = id => typeof id === 'string' && r.indexOf(id) >= 0;
    const a = last && ok(last.p1) ? last.p1 : r[0];
    const b = last && ok(last.p2) ? last.p2 : r[Math.min(1, r.length - 1)];
    return [a, b];
  }
};

/* ---------- 共通のUI部品 ---------- */
function wrapText(ctx, str, maxW, size, font) {
  ctx.font = size + 'px ' + (font === 'en' ? FONT_EN : (font === 'mono' ? FONT_MONO : FONT_JP));
  const lines = [];
  let cur = '';
  for (let i = 0; i < str.length; i++) {
    const nx = cur + str.charAt(i);
    if (ctx.measureText(nx).width > maxW && cur) { lines.push(cur); cur = str.charAt(i); } else cur = nx;
  }
  if (cur) lines.push(cur);
  return lines;
}
function panel(ctx, x, y, w, h, color, alpha) {
  ctx.save();
  ctx.fillStyle = 'rgba(6,8,22,' + (alpha == null ? 0.78 : alpha) + ')';
  fillRR(ctx, x, y, w, h, 6); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = rgba(color || '#19f3ff', 0.2); ctx.lineWidth = 5; ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = color || '#19f3ff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function bar(ctx, x, y, w, h, v, color) {
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Util.clamp(v, 0, 1), h);
}
const Backdrop = {
  t: 0,
  draw(ctx, dim) {

    const st = { phase: 'MENU', skyFlash: 0, superDim: 0 };

};
function drawConn(ctx) {

/* ---- 実際のキー名（P1/P2 に今つながっている入力機器の割り当て） ---- */
function keyName(slot, a) {
  const d = Devices.slots[slot];
  if (!d) return '---';
  if (d.kind === 'kb') return codeLabel(d.binds[a]);
  const arr = d.profile.binds[a] || [];
  return arr.length ? arr.map(bindLabel).join('/') : '未割当';
}
function moveKeysName(slot) {
  const d = Devices.slots[slot];
  if (!d) return '---';
  if (d.kind !== 'kb') return 'スティック';
  const dirs = ['up', 'left', 'down', 'right'];
  if (dirs.every(a => (d.binds[a] || '').indexOf('Arrow') === 0)) return '矢印キー';
  return dirs.map(a => codeLabel(d.binds[a])).join('');
}

    '   必殺 ' + keyName(slot, 'S') + '   投げ ' + keyName(slot, 'T');
}

function normalDesc(m, base) {
  const h = m.hit || {}, t = [];
  if (h.level === 'low') t.push('下段');
  if (h.level === 'high') t.push('上段（立ちガードのみ）');
  if (h.effect === 'launch') t.push(h.juggle > 0 ? '当たると相手が浮く' : '当たると相手が転ぶ');
  if (m.cancel && m.cancel.into && m.cancel.into.some(x => x.indexOf('sp') === 0)) t.push('必殺技でキャンセルできる');
  return (t.length ? t.slice(0, 2).join('。').replace('。必殺技でキャンセルできる', '。必殺技につながる') : base);
}

/* ================================================================
 * オンライン対戦: 部屋を作る / 部屋番号を入れて入る。つながったらキャラ選択へ
 * ホストが P1、入った側が P2。どちらも自分の P1 の機器で操作する
 * ================================================================ */
/* ホストが試合を始める（両者に同じ seed・ルール・ステージを渡す） */
function netHostStart() {
  const list = window.StageVisual && StageVisual.THEMES ? StageVisual.THEMES.map(x => x.id) : ['sando'];
  const eff = Settings.eff(), seed = Math.floor(Math.random() * 0x7ffffffe) + 1;
  const msg = { t: 'start', sel: Game.sel.slice(), pal2: [false, true], easy: Game.easy.slice(), seed: seed, rounds: eff.rounds, time: eff.time, stage: list[seed % list.length] };
  Net.send(msg);
  netApplyStart(msg);
}
function netApplyStart(msg) {
  Game.sel = msg.sel.slice(); Game.pal2 = msg.pal2.slice(); Game.easy = msg.easy.slice();
  Game.netRules = { seed: msg.seed, rounds: msg.rounds, time: msg.time, stage: msg.stage };
  Game.training = false; Game.tutorial = false; Game.netLinger = null;
  Game.go('versus', { net: true });
}
/* 接続が切れていたらお知らせしてタイトルへ（切れていたら true） */
function netLost() {
  Net.poll();
  if (Net.state === 'open') return false;
  Toast.push(Net.err || '相手との接続が切れました');
  Net.close(); Game.go('title');
  return true;
}

    Net.poll();
    if (this.mode === 'test') {
      NetTest.poll();
      const n2 = Input.nav;
      if ((n2 & B_H) || Input.keyPressed('Escape') || (NetTest.state === 'done' && (n2 & B_L))) { Audio.play('menuCancel'); NetTest.stop(); this.mode = 'menu'; }
      return;

    const n = Input.nav, back = (n & B_H) || Input.keyPressed('Escape'), ok = (n & B_L) || Input.keyPressed('Enter') || Input.keyPressed('NumpadEnter');
    if (this.mode === 'menu') {
      this.sel = menuMove(this.sel, this.ITEMS.length, n);
      if (back) { Audio.play('menuCancel'); Game.go('title'); return; }
      if (ok) {

        if (this.sel === 0) { Net.host(); this.mode = 'host'; }

      if (n & B_DOWN) { this.dig[this.di] = (this.dig[this.di] + 9) % 10; Audio.play('menuMove'); }

        if (Input.keyPressed('Digit' + d) || Input.keyPressed('Numpad' + d)) { this.dig[this.di] = d; this.di = Math.min(3, this.di + 1); Audio.play('menuMove'); }

      if (ok) { Audio.play('menuOk'); Net.join(this.dig.join('')); this.mode = 'join'; }

    } else {

      }
      if (st !== 'error' && st !== 'closed') sub('強 / Esc: やめる', 420);
    }
    drawConn(ctx);
  }
};

Game.scenes.charSelect = {
  idleLimit: 3600,
  enter(args) {
    const r = Game.roster, def = Game.defaultSel();
    this.cards = r.slice();
    if (r.length > 1) this.cards.push('?');
    const eff = Settings.eff();
    this.p = [0, 1].map(i => ({
      cur: Math.max(0, r.indexOf(def[i])), decided: false, picked: null, pal: i === 0 ? 0 : 1,
      easy: i === 0 ? eff.easy.p1 : eff.easy.p2, pup: null, key: ''
    }));
    this.cd = -1; this.t = 0;
    Game.tutorial = false;
    this.training = !!Game.training || !!HASH.p.training;
    /* 乱入: P1 は今のキャラで決定済み。P2 だけ選ぶ */
    this.challenger = !!(args && args.challenger);
    if (this.challenger) {
      this.training = false;
      const a = this.p[0], b = this.p[1];
      a.cur = Math.max(0, r.indexOf(Game.sel[0])); a.decided = true; a.picked = Game.sel[0];
      a.pal = Game.pal2[0] ? 1 : 0; a.easy = Game.easy[0]; b.pal = 1 - a.pal;
    }
    /* オンライン: 自分の側だけ操作。配色は P1 赤 / P2 シアンで固定 */
    this.net = !!(args && args.net) && Net.state === 'open';
    this.local = Game.netSlot || 0; this.sent = ''; this.idleLimit = this.net ? 0 : 3600;
    if (this.net) { this.training = false; Game.training = false; this.p[0].pal = 0; this.p[1].pal = 1; }
    this.refreshPreview(0); this.refreshPreview(1);
    FX.reset();
  },
  netRecv() {
    let m;
    while ((m = Net.take('sel'))) {
      const q = this.p[1 - this.local];
      q.cur = m.cur | 0; q.decided = !!m.decided; q.picked = m.picked || null; q.easy = !!m.easy;
      if (!q.decided) this.cd = -1;
    }
    const st = Net.take('start');
    if (st) { netApplyStart(st); return true; }
    return false;
  },
  perRow() { const n = this.cards.length; return n > 5 ? Math.ceil(n / 2) : n; },
  hoverId(i) {
    const p = this.p[i], c = this.cards[p.cur];
    if (p.decided && p.picked) return p.picked;
    return c === '?' ? null : c;
  },
  refreshPreview(i) {
    const p = this.p[i], id = this.hoverId(i);
    const key = (id || '?') + ':' + p.pal + ':' + (p.decided ? 1 : 0);
    if (key === p.key) return;
    const wasDecided = p.key.endsWith(':1');
    p.key = key;
    if (!id) { p.pup = null; return; }
    p.pup = makePreview(id, p.pal === 1);
    previewPlay(p.pup, p.decided && !wasDecided ? 'intro' : 'idle', 0);
  },
  togglePal(i) {
    if (this.net) return;
    const p = this.p[i], q = this.p[1 - i];
    p.pal = 1 - p.pal;
    /* 同じキャラ同士なら配色がかぶらないよう、相手と入れ替える */
    const a = this.hoverId(i), b = this.hoverId(1 - i);
    /* 縁の色は配色で決まる（赤/シアン）。キャラが違っても、相手と同じ配色にはしない */
    if (q.pal === p.pal) { q.pal = 1 - q.pal; this.refreshPreview(1 - i); }
    Audio.play('menuMove');
    this.refreshPreview(i);
  },
  update() {
    this.t++;
    const R = Game.roster.length;
    const anyDecided = this.p[0].decided || this.p[1].decided;
    if (this.net) {
      if (netLost() || this.netRecv()) return;
      const me = this.p[this.local];
      if (Input.keyPressed('Escape') || ((Input.edge[0] & B_H) && !me.decided)) { Audio.play('menuCancel'); Net.close(); Game.go('title'); return; }
    }
    for (let i = 0; i < 2; i++) {
      /* オンライン: 相手の側は届いた状態を表示するだけ。自分の側は自分の機器（P1 の機器）で動かす */
      if (this.net && i !== this.local) { this.refreshPreview(i); continue; }
      const src = this.net ? 0 : i;
      const p = this.p[i], pu = Input.pulse[src], ed = Input.edge[src];
      if (!p.decided) {
        if (pu & B_LEFT) { if (R > 1) { p.cur = (p.cur + this.cards.length - 1) % this.cards.length; Audio.play('menuMove'); } else this.togglePal(i); }
        if (pu & B_RIGHT) { if (R > 1) { p.cur = (p.cur + 1) % this.cards.length; Audio.play('menuMove'); } else this.togglePal(i); }
        /* 2段のときは ↑↓ で段を移る */
        const per = this.perRow();
        if ((pu & (B_UP | B_DOWN)) && per < this.cards.length) {
          const nx = p.cur + ((pu & B_DOWN) ? per : -per);
          if (nx >= 0 && nx < this.cards.length) { p.cur = nx; Audio.play('menuMove'); }
          else if (nx >= this.cards.length && p.cur < per) { p.cur = this.cards.length - 1; Audio.play('menuMove'); }
        }
        if (ed & B_T) this.togglePal(i);
        if (ed & B_L) {
          p.decided = true;
          let id = this.cards[p.cur];
          if (id === '?') id = Game.roster[fxRng.int(Game.roster.length)];
          p.picked = id;
          Audio.play('menuOk');
          /* 同キャラかつ同配色なら、後から決めた側が自動で入れ替わる */
          const q = this.p[1 - i];
          if (q.decided && q.pal === p.pal) { p.pal = 1 - p.pal; }
        }
      } else if (ed & B_H) {
        p.decided = false; p.picked = null; this.cd = -1; Audio.play('menuCancel');
      }
      if (ed & B_S) { p.easy = !p.easy; Audio.play('menuMove'); }
      this.refreshPreview(i);
    }
    /* 戻る: 誰も決定していなければ強/Escでタイトルへ */
    if (!this.net && (Input.keyPressed('Escape') || ((Input.edge[0] | Input.edge[1]) & B_H && !anyDecided))) {
      if (anyDecided) { this.p.forEach(p => { p.decided = false; p.picked = null; }); this.cd = -1; Audio.play('menuCancel'); }
      else { Audio.play('menuCancel'); Game.go('title'); return; }
    }
    if (!this.net && !(Settings.data.lock && !Game.staff) && (Input.startHold[0] === 45 || Input.startHold[1] === 45 || Input.keyPressed('Tab'))) { Game.go('inputConfig', { from: 'charSelect' }); return; }
    /* 1人で練習: P2 は CPU。P1 が決めたら同じキャラ・別の配色で自動的に決まる */
    if (this.training) {
      const a = this.p[0], b = this.p[1];
      if (a.decided && !b.decided) { b.decided = true; b.picked = Game.pickCpuOpp(a.picked, null); b.pal = 1 - a.pal; this.refreshPreview(1); }
      else if (!a.decided && b.decided) { b.decided = false; b.picked = null; this.refreshPreview(1); }
    }
    if (this.net) {

      if (key !== this.sent) { this.sent = key; Net.send({ t: 'sel', cur: me.cur, decided: me.decided, picked: me.picked, easy: me.easy }); }
    }
    if (this.p[0].decided && this.p[1].decided) {
      if (this.cd < 0) this.cd = 60;
      this.cd--;

    } else this.cd = -1;

  },
  start() {

Game.scenes.versus = {
  idleLimit: 0,
  enter(args) {
    this.args = args || {};
    if (Game.tutorial) initStage(Game.data.stage.colors, 'sando');
    else if (this.args.net && Game.netRules && Game.netRules.stage) initStage(Game.data.stage.colors, Game.netRules.stage);
    else pickStage();
    this.pups = [0, 1].map(i => {
      const p = makePreview(Game.sel[i], Game.pal2[i]);
      p.cp.play('intro', 0, true); p.cp.tick(26); p.cp.commit(true);
      return p;
    });
    Audio.play('roundStart');
    FX.reset();
  },
  update() {
    this.pups.forEach(p => { p.beginStep(); p.commit(false, false); });
    /* 掛け合いがあるときは少し長く見せる（決定で飛ばせる） */
    if (this.args.net && netLost()) return;
    const len = vsLines(Game.sel[0], Game.sel[1]) && !Game.tutorial ? 210 : 120;
    if (!this.args.net && Game.sceneT > 30 && (Input.nav & B_L) && Game.sceneT < len - 20) Game.sceneT = len - 20;
    if (Game.sceneT >= len) Game.go('fight', { training: this.args.training, net: this.args.net });
  },
  render(ctx) {
    const t = Game.sceneT, T = Game.data.stage;
    Backdrop.draw(ctx, 0.55);
    const slide = Ease.outCubic(Util.clamp(t / 30, 0, 1));
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 150, CFG.W, 220);
    ctx.restore();
    drawPreview(ctx, this.pups[0], -150 + 420 * slide, 400, 1.5, 1, 1);
    drawPreview(ctx, this.pups[1], 1110 - 420 * slide, 400, 1.5, 1, -1);
    for (let i = 0; i < 2; i++) {
      const ch = Game.chars[Game.sel[i]].ch, col = i === 0 ? UI_COL.p1 : UI_COL.p2;
      const x = i === 0 ? 40 : 920, a = i === 0 ? 'left' : 'right';
      const off = (1 - slide) * (i === 0 ? -300 : 300);
      drawText(ctx, 'P' + (i + 1), x + off, 190, { size: 22, font: 'en', color: col, align: a, glow: col });
      drawText(ctx, ch.name, x + off, 232, { size: 36, color: '#ffffff', align: a, glow: col });
      drawText(ctx, ch.nameEn, x + off, 258, { size: 14, font: 'en', color: col, align: a });
    }
    const vs = Ease.outBack(Util.clamp((t - 10) / 20, 0, 1));
    ctx.save(); ctx.translate(480, 270); ctx.scale(vs, vs);
    drawText(ctx, 'VS', 0, 20, { size: 84, font: 'en', align: 'center', color: '#ffffff', glow: '#ffe94d' });
    ctx.restore();
    drawText(ctx, (SV && SV.name) || T.name, 480, 430, { size: 22, align: 'center', color: '#e6f1ff', glow: '#19f3ff', alpha: Util.clamp((t - 30) / 20, 0, 1) });
    drawText(ctx, (SV && SV.subtitle) || T.subtitle || '', 480, 456, { size: 14, align: 'center', color: '#8fa3c8', alpha: Util.clamp((t - 30) / 20, 0, 1) });
    /* 掛け合い: P1 → P2 の順に吹き出し */
    const L = Game.tutorial ? null : vsLines(Game.sel[0], Game.sel[1]), len = L ? 210 : 120;
    if (L) {
      for (let i = 0; i < 2; i++) {
        const t0 = 40 + i * 60, a = Util.clamp((t - t0) / 10, 0, 1);
        if (a <= 0) continue;
        const col = i === 0 ? UI_COL.p1 : UI_COL.p2, x = i === 0 ? 40 : 520, y = i === 0 ? 288 : 330;
        ctx.save(); ctx.globalAlpha = a;
        panel(ctx, x, y, 400, 34, col, 0.9);
        const n = Math.floor(Util.clamp((t - t0) / 2, 0, L[i].length));   /* 1文字ずつ出す */
        drawText(ctx, '「' + L[i].slice(0, n) + (n >= L[i].length ? '」' : ''), x + 16, y + 18, { size: 16, color: '#ffffff', base: 'middle' });
        ctx.restore();
      }
    }
    if (t > len - 20) { ctx.fillStyle = 'rgba(5,6,15,' + ((t - (len - 20)) / 20) + ')'; ctx.fillRect(0, 0, CFG.W, CFG.H); }
  }
};

const _V = { x: 640, zoom: 1, y: 0 }, _SHK = { x: 0, y: 0 };

const PerfOff = {};
/* 集中線: 大祓が当たっている間と KO の直後、画面の外から中心へ向かう細い線 */
function drawSpeedLines(ctx, m, cam) {
  let f = null, a = 0;
  for (let i = 0; i < 2; i++) {
    const g = m.fighters[i];
    if (g.state === 'ATTACK' && g.mv && g.mv.m.kind === 'super' && g.mv.n > g.mv.m.startup && (g.mv.hitCount > 0 || g.mv.thrown)) { f = g; a = 1; }
  }
  if (!f && m.phase === 'KO' && m.koWinner >= 0) { f = m.fighters[1 - m.koWinner]; a = Util.clamp(1 - m.phaseT / 50, 0, 1); }
  if (!f || a <= 0) return;
  const cx = 480 + (f.x - cam.x) * cam.zoom, cy = 460 + cam.y - (f.y + 80) * cam.zoom;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.22 * a).toFixed(3) + ')'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let k = 0; k < 44; k++) {
    const ang = fxRng.range(0, 6.283), r1 = 700, r0 = fxRng.range(230, 360);
    ctx.moveTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1); ctx.lineTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
  }
  ctx.stroke(); ctx.restore();
}
function renderFightWorld(ctx, m, alpha, o) {
  o = o || {};

    const k = m.phase === 'KO' ? Ease.outCubic(Util.clamp((m.phaseT + alpha) / 26, 0, 1)) : 1 - Ease.outCubic(m.phaseT / 24);
    const L = F[1 - m.koWinner];

  else if (FX.impactDim > 0) { ctx.fillStyle = 'rgba(0,0,8,' + FX.impactDim.toFixed(3) + ')'; ctx.fillRect(-20, -20, CFG.W + 40, CFG.H + 40); }

/* 攻撃の「当たる時間」に、当たり判定の範囲へ光る三日月の斬撃を描く。
 * 影絵は細部が見えにくいので、いつ・どこまで届くかをこれで見せる（形は当たり判定そのもの）。 */
function drawStrike(ctx, f) {
  const mv = f.mv;
  if (f.state !== 'ATTACK' || !mv || !mv.m.hit || mv.m.kind === 'super' || !mv.m.boxes) return;
  const col = LookAdapter.edge(f.rt.ch, f.pup.pal);
  for (let i = 0; i < mv.m.boxes.length; i++) {
    const b = mv.m.boxes[i], span = b.f1 - b.f0 + 1;
    if (mv.n < b.f0 || mv.n > b.f1 + 4) continue;
    const k = (mv.n - b.f0) / span, fade = mv.n > b.f1 ? 1 - (mv.n - b.f1) / 5 : 1;
    const w = f.boxWorld(b), near = f.facing > 0 ? w[0] : w[2], far = f.facing > 0 ? w[2] : w[0];
    const rx = Math.max(16, Math.abs(far - near)), ry = Math.max(14, (w[3] - w[1]) * 0.75), cy = (w[1] + w[3]) / 2;
    /* 振り抜く: 上から下へ扇が開いていき、終わりぎわに細く消える */
    const a1 = -1.15 + 2.3 * Math.min(1, k * 1.5 + 0.35), a0 = Math.max(-1.15, a1 - 1.6);
    ctx.save();
    ctx.translate(near, -cy); ctx.scale(f.facing, 1);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const pass = (lw, c, a) => { ctx.strokeStyle = c; ctx.globalAlpha = a * fade; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, a0, a1); ctx.stroke(); };
    pass(16, col, 0.16); pass(7, col, 0.5); pass(2.5, '#ffffff', 0.9);
    /* 先端の光 */
    ctx.globalAlpha = 0.85 * fade; ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(Math.cos(a1) * rx, Math.sin(a1) * ry, 3.5, 0, 6.2832); ctx.fill();
    ctx.restore();
  }
}

/* ガード中: 体の前に六角形の結界を出す（しゃがみガードなら低く）。色はそのプレイヤーの縁 */
/* 技の仕組みを目で分かるように:

function drawMoveFx(ctx, f) {

    ctx.beginPath(); ctx.moveTo(bx, by + 14); ctx.quadraticCurveTo(bx - f.facing * 34, by - 6 + fl, bx - f.facing * 60, by + 22 + fl); ctx.stroke();

function drawGuardShield(ctx, f) {

    for (let p = 0; p < m.need; p++) {

    else { gp.moveTo(gx, y); gp.lineTo(gx + gw - sk, y); gp.lineTo(gx + gw, y + gh); gp.lineTo(gx + sk, y + gh); }
    gp.closePath();

    if (full) { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = rgba('#ffd24a', 0.35 + 0.25 * Math.sin(t * 9)); ctx.lineWidth = 7; ctx.stroke(gp); }
    /* 半分の印（ガードキャンセルに使える量） */

    ctx.restore();

    else if (D.comboShow.t > 0) { hits = D.comboShow.hits; dmg = D.comboShow.dmg; fade = Util.clamp(D.comboShow.t / 14, 0, 1); }

      drawText(ctx, hits + ' HIT', 0, 0, { size: [44, 50, 56][tier], font: 'en', color: hc, align: a, glow: gl, alpha: fade, stroke: 'rgba(0,0,0,0.5)', strokeW: 4 });

      ctx.restore();

function drawFightBanners(ctx, m, scene) {
  const T = Game.data.texts.banners, ph = m.phase, pt = m.phaseT;
  if (ph === 'ROUND_INTRO') {
    const k = Util.clamp((pt - 14) / 12, 0, 1), out = Util.clamp((CFG.PH.ROUND_INTRO - pt) / 8, 0, 1);
    if (pt > 14) drawBannerBand(ctx, m.isFinalRound() ? T.finalRound : T.round.replace('{n}', String(m.round)), 220, k * out, { color: '#ffe94d', size: 54 });
  } else if (ph === 'READY') {
    const k = pt / 40;
    drawText(ctx, T.fight, 480, 230, { size: 96 + k * 40, font: 'en', align: 'center', base: 'middle', color: '#ffffff', glow: '#ff3b5c', alpha: Util.clamp(1 - Math.max(0, k - 0.55) / 0.45, 0, 1) });
  } else if (ph === 'KO') {
    const k = Util.clamp((pt - 4) / 22, 0, 1);
    if (pt > 4) {
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 120, CFG.W * Ease.outExpo(k), 200); ctx.clip();
      drawBannerBand(ctx, T.ko, 220, 1, { color: '#ffffff', size: 76, font: 'jp', h: 120 });
      ctx.restore();
    }
  } else if (ph === 'TIME_UP') {
    drawBannerBand(ctx, T.timeup, 220, Util.clamp(pt / 12, 0, 1), { color: '#ffb347', size: 60 });
  } else if (ph === 'ROUND_END') {
    const k = Util.clamp(pt / 14, 0, 1);
    if (m.koWinner < 0) drawBannerBand(ctx, T.draw, 220, k, { color: '#8fa3c8', size: 60 });
    else if (pt > 20) {
      const col = m.koWinner === 0 ? UI_COL.p1 : UI_COL.p2;
      drawBannerBand(ctx, m.fighters[m.koWinner].ch.name + '  ' + T.win, 220, Util.clamp((pt - 20) / 12, 0, 1), { color: col, size: 40, font: 'jp' });
    }
    if (!m.perfectNow && m.roundTag && pt > 36) {
      const a = Util.clamp((pt - 36) / 10, 0, 1), sc = 1 + 0.5 * (1 - Ease.outBack(a));
      ctx.save(); ctx.translate(480, 292); ctx.scale(sc, sc);
      drawText(ctx, m.roundTag, 0, 0, { size: 46, align: 'center', base: 'middle', color: '#ffffff', glow: '#ff4fa3', alpha: a });
      ctx.restore();
    }
    if (m.perfectNow && pt > 36) drawText(ctx, T.perfect, 480, 290, { size: 44, font: 'en', align: 'center', color: '#ffe94d', glow: '#ffe94d', alpha: Util.clamp((pt - 36) / 10, 0, 1) * (0.7 + 0.3 * Math.sin(Game.t * 12)) });
  } else if (ph === 'MATCH_END') {
    ctx.fillStyle = 'rgba(5,6,15,' + Util.clamp(pt / 30, 0, 1) + ')'; ctx.fillRect(0, 0, CFG.W, CFG.H);
  }
}

  /* ポーズ中もメニュー操作のため update は回す（シミュレーションは進めない） */
  timeScale() { if (this.replay) return this.REPLAY.speed; return (this.paused || !this.match || this.challenger) ? 1 : this.match.timeScale(); },
  fxScale() { if (this.replay) return this.REPLAY.speed; return (this.paused || !this.match || this.challenger) ? 0 : (this.match.phase === 'KO' ? 0.5 : 1); },
  /* ---- 乱入: CPU 戦の最中に P2 がスタートを押すと、2人対戦に切り替わる ---- */
  canChallenge() {
    const m = this.match;
    return !!(m && this.cpu && this.p2Easy && !Game.tutorial && !this.practice() && !m.ended && m.phase !== 'KO');
  },
  startChallenger() {
    this.challenger = { t: 0 };
    Audio.play('challenger');
    Input.lockFor(30);
  },
  challengerUpdate() {
    const C = this.challenger;
    if (++C.t < 150) return;
    /* P1 のキャラはそのまま。P2 だけ選ぶ */
    Game.training = false; Game.cpuStreak = 0;
    this.match = null; this.challenger = null;
    Game.go('charSelect', { challenger: true });
  },
  drawChallenger(ctx) {
    const t = this.challenger.t, col = UI_COL.p2;
    const k = Ease.outCubic(Util.clamp(t / 14, 0, 1));
    ctx.save();
    ctx.fillStyle = 'rgba(3,4,12,' + (0.55 * k) + ')'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    const h = 120 * k;
    ctx.fillStyle = 'rgba(8,10,24,0.92)'; ctx.fillRect(0, 270 - h / 2, CFG.W, h);
    ctx.fillStyle = rgba(col, 0.9); ctx.fillRect(0, 270 - h / 2, CFG.W, 3); ctx.fillRect(0, 270 + h / 2 - 3, CFG.W, 3);
    ctx.restore();
    if (t < 8) { ctx.fillStyle = 'rgba(255,255,255,' + (1 - t / 8) * 0.8 + ')'; ctx.fillRect(0, 0, CFG.W, CFG.H); }
    if (t > 10) {
      const blink = t < 110 ? (Math.floor(t / 6) % 2 === 0 ? 1 : 0.55) : 1;
      const x = 480 + Math.max(0, 40 - (t - 10) * 4) * 12;
      drawText(ctx, 'HERE COMES A NEW CHALLENGER', x, 252, { size: 30, font: 'en', align: 'center', base: 'middle', color: '#ffffff', glow: col, alpha: blink });
      drawText(ctx, '新たな挑戦者！', 960 - x, 296, { size: 26, align: 'center', base: 'middle', color: col, glow: col });
    }
  },
  /* ---- KO のリプレイ: 最後の一撃を、記録した入力から再シミュレートしてスローで見せる ---- */
  REPLAY: { pre: 100, post: 70, speed: 0.45 },
  startReplay() {
    try {
      const m2 = new Match(Object.assign({ fx: NullFX }, this.mArgs));
      if (this.p2Easy) m2.fighters[1].easy = true;
      const start = Math.max(0, this.koStep - this.REPLAY.pre), end = Math.min(this.rec.length, this.koStep + this.REPLAY.post);
      for (let i = 0; i < start; i++) m2.step(this.rec[i]);
      FX.reset(); m2.fx = FX;
      this.replay = { m: m2, i: start, end: end, t: 0 };
      return true;
    } catch (e) { console.error(e); this.replay = null; return false; }
  },
  replayUpdate() {
    const R = this.replay; R.t++;
    const skip = ((Input.edge[0] | Input.edge[1]) & (B_L | B_H | B_START)) || Input.keyPressed('Enter') || Input.keyPressed('Escape');
    if ((skip && R.t > 12) || R.i >= R.end) { this.replay = null; FX.reset(); Game.go('result'); return; }
    R.m.step(this.rec[R.i++]);
  },
  drawReplay(ctx) {
    const R = this.replay, bar = 46;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CFG.W, bar); ctx.fillRect(0, CFG.H - bar, CFG.W, bar);
    if (Math.floor(R.t / 20) % 2 === 0) { ctx.fillStyle = '#ff3b5c'; ctx.beginPath(); ctx.arc(34, bar / 2, 7, 0, Math.PI * 2); ctx.fill(); }
    drawText(ctx, 'REPLAY', 50, bar / 2, { size: 20, font: 'en', base: 'middle', color: '#ffffff' });
    drawText(ctx, '決着の一撃', 160, bar / 2, { size: 14, base: 'middle', color: '#8fa3c8' });
    drawText(ctx, '弱で スキップ', CFG.W - 24, CFG.H - bar / 2, { size: 12, align: 'right', base: 'middle', color: '#8fa3c8' });
  },
  pauseItems() {
    if (this.pauseWhy === 'disconnect') return ['キーボードで継続', 'タイトルへ'];
    const a = (Settings.data.lock && !Game.staff) ? ['再開', '技一覧', 'キャラ選択へ', 'タイトルへ'] : ['再開', '技一覧', '入力設定', 'キャラ選択へ', 'タイトルへ'];
    if (this.practice()) a.splice(1, 0, '練習台の動き: ' + this.DUMMY_LABEL[Game.dummyMode || 'stand'], 'コンボチャレンジ: ' + (Settings.data.challenge === false ? 'OFF' : 'ON'));
    if (this.training && !Game.tutorial) a.splice(1, 0, '判定表示: ' + (Game.showBoxes ? 'ON' : 'OFF'));
    return a;
  },
  openPause(why) {
    if (this.paused) return;
    this.paused = true; this.pauseSel = 0; this.pauseWhy = why || 'menu'; this.showMoves = false;
    Input.lockFor(10);
    Audio.play('menuOk');
  },
  update() {
    if (this.replay) { this.replayUpdate(); return; }
    if (this.challenger) { this.challengerUpdate(); return; }
    if (this.net) { this.netUpdate(); return; }
    const m = this.match, hud = this.hud;
    if (this.paused) { this.updatePause(); return; }
    if (Game.blurPause) { Game.blurPause = false; this.openPause('blur'); return; }
    const join = this.canChallenge();
    if (join && (Input.edge[1] & B_START)) { this.startChallenger(); return; }
    const st = (Input.edge[0] | (join ? 0 : Input.edge[1])) & B_START;
    if (st || Input.keyPressed('Enter') || Input.keyPressed('Escape') || Input.keyPressed('NumpadEnter')) { this.openPause('menu'); return; }
    for (let i = 0; i < 2; i++) {
      const d = this.devs[i];
      if (d && d.kind === 'pad' && !d.connected) { this.openPause('disconnect'); this.discIdx = i; return; }
    }
    const masks = [Input.raw[0] & ~B_START, Input.raw[1] & ~B_START];
    if (this.cpu) masks[1] = this.cpu.next(m, 1);
    this.rec.push([masks[0], masks[1]]);
    m.step(masks);
    if (m.phase === 'KO' && this.lastPhase !== 'KO') { this.koStep = this.rec.length; this.koRound = m.round; }
    this.lastPhase = m.phase;
    BGM.setHurry(m.timeMax > 0 && m.timer <= 10 && m.phase === 'FIGHTING');
    if (this.tut) this.tutUpdate(m);
    if (this.practice()) this.practiceUpdate(m);
    this.hudStep(m);
    if (m.ended) {
      Game.result = Object.assign({}, m.result, { ids: Game.sel.slice(), pal2: Game.pal2.slice() });
      /* KO で決着したら、最後の一撃をリプレイしてからリザルトへ */
      const ko = this.koStep >= 0 && this.koRound === m.round && m.result && m.result.winner >= 0;
      this.match = null;
      if (ko && !Game.tutorial && !this.practice() && this.startReplay()) return;
      Game.go('result');
      return;
    }
    /* 両者無入力のタイムアウト */
    if (Input.idle > 2400) { this.match = null; Game.go('title'); }
  },
  /* HUD の遅延バー */
  hudStep(m) {
    const hud = this.hud;
    if (m.round !== hud.round) { hud.round = m.round; for (let i = 0; i < 2; i++) { hud.lag[i] = m.fighters[i].hp; hud.last[i] = m.fighters[i].hp; } }
    for (let i = 0; i < 2; i++) {
      const f = m.fighters[i];
      if (f.hp < hud.last[i]) { hud.wait[i] = CFG.HP_BAR_LAG; f.lastHitFrame = m.frame; }
      hud.last[i] = f.hp;
      if (hud.wait[i] > 0) hud.wait[i]--;
      else if (hud.lag[i] > f.hp) hud.lag[i] = Math.max(f.hp, hud.lag[i] - f.maxHp * 0.012);
      else hud.lag[i] = f.hp;
    }
    for (let i = 0; i < 2; i++) { const d = m.fighters[1 - i]; if (d.combo.hits >= 2) d.lastHitFrame = d.lastHitFrame || 0; }
  },
  /* ---- オンライン対戦の 1 フレーム ---- */
  netUpdate() {
    if (netLost()) { this.match = null; this.net = null; return; }
    const S = this.net;
    /* オンラインは止められないので、やめるときは確認だけ出して試合は進める */
    if (this.quitAsk) {
      if ((Input.nav & B_L) || Input.keyPressed('Enter')) { Audio.play('menuOk'); Net.close(); this.match = null; this.net = null; Game.go('title'); return; }
      if ((Input.nav & B_H) || Input.keyPressed('Escape')) { this.quitAsk = false; Audio.play('menuCancel'); }
    } else if (Input.keyPressed('Escape') || (Input.edge[0] & B_START)) { this.quitAsk = true; Audio.play('menuOk'); }
    const mask = this.quitAsk ? 0 : (Input.raw[0] & ~B_START);
    /* 終わった後は進めない（入力は送り続けて、相手の確定を待つ） */
    if (S.match.ended) { S.sendInputs(); if (S.rbFrom >= 0) S.rollback(); }
    else S.tick(mask);
    const m = this.match = S.match;
    BGM.setHurry(m.timeMax > 0 && m.timer <= 10 && m.phase === 'FIGHTING');
    this.hudStep(m);
    if (m.ended && S.settled()) {
      Game.result = Object.assign({}, m.result, { ids: Game.sel.slice(), pal2: Game.pal2.slice() });
      Game.netLinger = S;   /* リザルト画面でも少しのあいだ入力を送り続ける（相手の確定のため） */
      this.rec = S.record();
      const ko = this.findKo();
      this.match = null; this.net = null;
      if (ko && m.result.winner >= 0 && this.startReplay()) return;
      Game.go('result');
    }
  },
  /* 記録した入力を流し直して、最後のラウンドが KO で決まったか・そのフレームを調べる */
  findKo() {
    try {
      const m = new Match(Object.assign({ fx: NullFX }, this.mArgs));
      let ko = -1, koRound = 0, last = '';
      for (let i = 0; i < this.rec.length; i++) {
        m.step(this.rec[i]);
        if (m.phase === 'KO' && last !== 'KO') { ko = i + 1; koRound = m.round; }
        last = m.phase;
      }
      this.koStep = ko; this.p2Easy = false;
      return ko >= 0 && koRound === m.round;
    } catch (e) { return false; }
  },
  drawNet(ctx) {
    const S = this.net; if (!S) return;
    const me = S.local, col = me === 0 ? UI_COL.p1 : UI_COL.p2;
    drawText(ctx, 'YOU', me === 0 ? 40 : 920, 112, { size: 13, font: 'en', align: me === 0 ? 'left' : 'right', color: col, glow: col });
    /* 通信の経路: 中継サーバー経由のときは目立つ色で */
    const rt = Net.route, rLabel = rt === 'relay' ? '中継サーバー経由' : rt === 'lan' ? '直接（同じネットワーク）' : rt === 'direct' ? '直接' : '';
    drawText(ctx, 'ONLINE  ' + Math.round(Net.rtt) + 'ms', 480, 488, { size: 11, font: 'en', align: 'center', color: '#8fa3c8', alpha: 0.7 });
    if (rLabel) drawText(ctx, rLabel, 480, 474, { size: 11, align: 'center', color: rt === 'relay' ? '#ffb347' : '#7cff6b', alpha: 0.8 });
    if (S.waitT > 20) drawText(ctx, '通信を待っています…', 480, 210, { size: 18, align: 'center', color: '#ffb347', glow: '#ffb347' });
    if (S.desync >= 0) drawText(ctx, '同期ずれが起きました（2人の画面の結果が違う可能性があります）', 480, 456, { size: 13, align: 'center', color: '#ff6b8b' });
    if (this.quitAsk) {
      ctx.fillStyle = 'rgba(3,4,12,0.6)'; ctx.fillRect(0, 210, CFG.W, 110);
      drawText(ctx, '対戦をやめて 切断しますか？', 480, 246, { size: 22, align: 'center', base: 'middle', color: '#ffffff' });
      drawText(ctx, '弱: やめる   強 / Esc: 続ける（試合は止まりません）', 480, 288, { size: 14, align: 'center', base: 'middle', color: '#8fa3c8' });
    }
  },
  updatePause() {
    const n = Input.nav, items = this.pauseItems();
    if (this.showMoves) {
      if (n & (B_LEFT | B_RIGHT)) { this.movePage = 1 - (this.movePage || 0); Audio.play('menuMove'); }
      if (n & (B_UP | B_DOWN)) { this.moveWho = 1 - (this.moveWho || 0); Audio.play('menuMove'); }
      if ((n & (B_H | B_L | B_START)) || Input.keyPressed('Escape') || Input.keyPressed('Enter')) { this.showMoves = false; Audio.play('menuCancel'); }
      return;
    }
    if (this.pauseWhy === 'disconnect') {
      const d = this.devs[this.discIdx];
      if (d && d.connected) { this.paused = false; Toast.push('コントローラーが再接続されました'); return; }
    }
    this.pauseSel = menuMove(this.pauseSel, items.length, n);
    if (n & B_H || Input.keyPressed('Escape')) {
      if (this.pauseWhy !== 'disconnect') { this.paused = false; Audio.play('menuCancel'); Input.lockFor(10); return; }
    }
    if ((n & B_L) || (n & B_START) || Input.keyPressed('Enter')) {
      const it = items[this.pauseSel];
      Audio.play('menuOk');
      if (it === '再開') { this.paused = false; Input.lockFor(10); }
      else if (it.indexOf('コンボチャレンジ') === 0) { Settings.data.challenge = Settings.data.challenge === false; }
      else if (it.indexOf('判定表示') === 0) { Game.showBoxes = !Game.showBoxes; }
      else if (it.indexOf('練習台の動き') === 0) { const M = this.DUMMY_MODES; Game.dummyMode = M[(M.indexOf(Game.dummyMode || 'stand') + 1) % M.length]; }
      else if (it === '技一覧') this.showMoves = true;
      else if (it === 'キーボードで継続') {
        Devices.setSlot(this.discIdx, this.discIdx === 0 ? 'kb1' : 'kb2');
        this.devs = [Devices.slots[0], Devices.slots[1]];
        this.paused = false; Input.lockFor(10);
      }
      else if (it === '入力設定') Game.go('inputConfig', { from: 'fight' });
      else if (it === 'キャラ選択へ') { this.match = null; Game.go('charSelect'); }
      else if (it === 'タイトルへ') { this.match = null; Game.go('title'); }
    }
  },
  exit() { },
  render(ctx, alpha) {
    if (this.replay) {
      renderFightWorld(ctx, this.replay.m, alpha, {});
      drawFightBanners(ctx, this.replay.m, this);
      if (FX.flashA > 0) { ctx.fillStyle = rgba(FX.flashColor, Math.min(1, FX.flashA)); ctx.fillRect(0, 0, CFG.W, CFG.H); }
      this.drawReplay(ctx);
      return;
    }
    const m = this.match;
    if (!m) return;
    /* 判定表示: デバッグ時か、練習中にポーズで ON にしたとき */
    const showBox = Debug.on || (this.training && !Game.tutorial && Game.showBoxes);
    const dbg = showBox ? (c, mm) => Debug.world(c, mm, !Debug.on) : null;
    renderFightWorld(ctx, m, this.paused ? 1 : alpha, { debugWorld: dbg });
    drawCutin(ctx, m, this);
    if (!PerfOff.hud) drawHUD(ctx, m, this.hud, Game.t);
    if (this.practice()) this.drawChallenge(ctx, m);
    if (this.net) this.drawNet(ctx);
    else if (!this.paused && !this.challenger) {
      drawText(ctx, 'Esc: ポーズ / 技一覧', 480, 503, { size: 11, align: 'center', color: '#8fa3c8', alpha: 0.75 });
      if (this.canChallenge()) drawText(ctx, 'P2: ' + keyName(1, 'start') + ' で乱入！', 940, 503, { size: 12, align: 'right', color: UI_COL.p2, alpha: 0.6 + 0.3 * Math.sin(Game.t * 3) });
    }
    drawFightBanners(ctx, m, this);
    if (this.tut && !this.paused) this.tutRender(ctx);
    if (Input.idle > 1800 && !this.paused && !this.net) {
      drawText(ctx, '10秒後にタイトルへ戻ります', 480, 150, { size: 20, align: 'center', color: '#ffb347', alpha: 0.6 + 0.4 * Math.sin(Game.t * 8) });
    }
    if (Debug.on) Debug.hud(ctx, m);
    else if (showBox && !this.paused) Debug.legend(ctx);
    if (FX.flashA > 0) { ctx.fillStyle = rgba(FX.flashColor, Math.min(1, FX.flashA)); ctx.fillRect(0, 0, CFG.W, CFG.H); }
    if (this.challenger) this.drawChallenger(ctx);
    if (this.paused) this.renderPause(ctx);
  },
  renderPause(ctx) {
    ctx.fillStyle = 'rgba(3,4,12,0.72)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
    const items = this.pauseItems();
    if (this.showMoves) {
      ctx.fillStyle = 'rgba(3,4,12,0.6)'; ctx.fillRect(0, 0, CFG.W, CFG.H);
      const f = this.match.fighters[this.moveWho || 0];
      drawMoveList(ctx, f.ch, '技一覧  P' + ((this.moveWho || 0) + 1) + ' ' + f.ch.name, this.movePage || 0, f.rt.id, '↑↓: P1 / P2');
      drawText(ctx, '閉じる: 強 / Esc', 480, 532, { size: 12, align: 'center', color: '#8fa3c8' });
      return;
    }
    if (this.pauseWhy === 'disconnect') {
      const n = this.discIdx + 1;
      drawText(ctx, 'P' + n + ' コントローラー切断', 480, 150, { size: 30, align: 'center', color: '#ff6b8b', glow: '#ff3b5c' });
      drawText(ctx, '再接続するか、キーボードのEnterで継続（P' + n + 'はキーボードに切替）', 480, 188, { size: 15, align: 'center', color: '#e6f1ff' });
    } else drawText(ctx, 'PAUSE', 480, 150, { size: 44, font: 'en', align: 'center', color: '#ffffff', glow: '#19f3ff' });
    /* 項目が多いとき（練習中）は間隔を詰めて画面に収める */
    const gap = Math.min(46, Math.floor(300 / Math.max(1, items.length - 1)));
    drawMenuList(ctx, items, this.pauseSel, 480, items.length > 6 ? 215 : 250, gap);
    drawConn(ctx);
  }
};

/* ================= RESULT ================= */
Game.scenes.result = {
  idleLimit: 2700,
  enter() {
    const r = Game.result;
    this.r = r; this.t = 0; this.sel = 0; this.items = ['もう一度', 'キャラ選択へ', 'タイトルへ'];
    /* オンライン: もう一度は 2人とも選んだら始まる */
    this.net = Net.state === 'open'; this.wantAgain = false; this.peerAgain = false; this.idleLimit = this.net ? 0 : 2700;
    /* CPU 戦の連勝数 */
    this.vsCpu = !!Game.training && CPU_LEVELS[Game.cpuLevel];
    if (this.vsCpu) Game.cpuStreak = r.winner === 0 ? (Game.cpuStreak || 0) + 1 : 0;
    if (this.vsCpu && r.winner === 0) this.items[0] = '次の相手';
    /* 本日の記録（CPU 戦は P1 だけ、2人対戦は両方のコンボを記録） */
    {
      const combo = this.vsCpu ? r.maxCombo[0] : Math.max(r.maxCombo[0], r.maxCombo[1]);
      const whoI = this.vsCpu ? 0 : (r.maxCombo[0] >= r.maxCombo[1] ? 0 : 1);
      this.news = Records.note({ level: this.vsCpu && r.winner === 0 ? Game.cpuLevel : null, streak: Game.cpuStreak || 0, combo: combo, who: Game.charName(r.ids[whoI]) });
    }
    this.win = r.winner >= 0 ? r.winner : -1;
    const ids = r.ids;
    if (this.win >= 0) {
      this.pw = makePreview(ids[this.win], r.pal2[this.win]); previewPlay(this.pw, 'win', 4);
      this.pl = makePreview(ids[1 - this.win], r.pal2[1 - this.win]); previewPlay(this.pl, 'lose', 4);
      const q = Game.chars[ids[this.win]].ch.quotes.win;
      const wl = winLine(ids[this.win], ids[1 - this.win]);
      this.quote = wl && fxRng.int(10) < 7 ? wl : q[fxRng.int(q.length)];
      const ranks = Game.data.fortunes.ranks;
      this.rank = ranks[ranks.length - 1];
      for (let i = 0; i < ranks.length; i++) if (r.winPoints >= ranks[i].minPoints) { this.rank = ranks[i]; break; }
      this.rline = this.rank.lines[fxRng.int(this.rank.lines.length)];
      this.good = this.rank.minPoints >= 30;
    } else {
      this.pw = makePreview(ids[0], r.pal2[0]); previewPlay(this.pw, 'lose', 4);
      this.pl = makePreview(ids[1], r.pal2[1]); previewPlay(this.pl, 'lose', 4);
    }
    this.omiPlayed = false; this.winPlayed = false;
    FX.reset();
  },
  netStep() {
    if (netLost()) return true;
    if (Game.netLinger && this.t < 360) Game.netLinger.sendInputs();
    if (Net.take('again')) this.peerAgain = true;
    if (Net.take('toSelect')) { Game.go('charSelect', { net: true }); return true; }
    const st = Net.take('start');
    if (st) { netApplyStart(st); return true; }
    if (Net.role === 'host' && this.wantAgain && this.peerAgain) { netHostStart(); return true; }
    return false;
  },
  update() {
    this.t++;
    if (this.net && this.netStep()) return;
    const T0 = this.win >= 0 ? 200 : 60;
    if (this.t === 4 && this.win >= 0) Audio.play('win');
    if (this.win >= 0 && this.t === 190 && !this.omiPlayed) { this.omiPlayed = true; Audio.play('omikuji', { good: this.good }); }
    if (this.pw) previewStep(this.pw);
    if (this.pl) previewStep(this.pl);
    if (this.t < T0) {
      if (Input.nav & B_L) { this.t = T0; this.omiPlayed = true; }
      return;
    }
    const n = Input.nav;
    this.sel = (n & B_LEFT) ? (this.sel + 2) % 3 : ((n & B_RIGHT) ? (this.sel + 1) % 3 : this.sel);
    if (n & (B_LEFT | B_RIGHT)) Audio.play('menuMove');
    if (n & B_L) {
      Audio.play('menuOk');
      if (this.net) {
        if (this.sel === 0) { if (!this.wantAgain) { this.wantAgain = true; Net.send({ t: 'again' }); } }
        else if (this.sel === 1) { Net.send({ t: 'toSelect' }); Game.go('charSelect', { net: true }); }
        else { Net.close(); Game.go('title'); }
        return;
      }
      if (this.sel === 0) {

class CpuPolicy {

      case '2H': q.push(D | B_H, D); break;

      case 'jL': case 'jH': {

      case 'sp1':

        break;
      case 'sp2':
        if (easy && rng.chance(0.5)) q.push(F | B_S, 0);

        break;
      case 'sp3':
        if (easy && rng.chance(0.5)) q.push(Bk | B_S, 0);

  /* ---- 対戦用CPU（やさしい / ふつう / つよい） ---- */
  pressFor(id, me) {

      case '5L': return [B_L, 0]; case '5H': return [B_H, 0];

    if (cp.plant < 0.001 && Math.abs(pose[CI.rot]) < 0.01) {
      if (Math.abs(j.sole - pose[CI.rootY]) > 1) this.fail('floor-plant', cp.name + ' sole=' + j.sole.toFixed(2) + ' rootY=' + pose[CI.rootY]);
    }
  },
  finish() {
    this.running = false; this.done = true;
    const v = this.vres;
    /* カバレッジ警告 */
    this.chars.forEach(id => {
      MOVE_IDS.forEach(m => { if (this.coverage[id][m].used === 0) this.warnings.push(id + ' の ' + m + ' が一度も使われませんでした'); });
    });
    const allEnded = this.reached >= this.matches;
    this.pass = !this.incomplete && this.failures.length === 0 && allEnded && this.determ.ok === true && v.errors.length === 0;
    this.publish();
    this.draw();
    document.title = (this.incomplete ? 'SELFTEST INCOMPLETE' : (this.pass ? 'SELFTEST PASS' : 'SELFTEST FAIL')) + ' matches=' + this.reached + '/' + this.matches + ' failures=' + this.failures.length;
  },
  stats() {
    const el = (performance.now() - this.t0) / 1000;
    const rf = this.roundFrames, avg = rf.length ? rf.reduce((a, b) => a + b, 0) / rf.length : 0;
    return {
      elapsed: el, steps: this.totalSteps, stepsPerSec: el > 0 ? this.totalSteps / el : 0, rounds: this.rounds, outcomes: this.outcomes,
      avgRound: avg, maxRound: rf.length ? Math.max.apply(null, rf) : 0, matchesDone: this.reached
    };
  },
  publish() {
    window.__selftest = {
      pass: this.pass, done: this.done, incomplete: this.incomplete, matches: this.matches, seed: this.seed,
      failures: this.failures, warnings: this.warnings, stats: this.stats(), coverage: this.coverage,
      determinism: this.determ, pairWins: this.pairWins,
      data: { errors: this.vres.errors.length, warnings: this.vres.warnings.length, errorList: this.vres.errors, warningList: this.vres.warnings }
    };
    if (!this.done) document.title = 'SELFTEST RUNNING ' + this.idx + '/' + this.matches;
  },
  draw() {
    const g = Display.begin();
    g.fillStyle = '#05060f'; g.fillRect(0, 0, CFG.W, CFG.H);
    const st = this.stats(), lines = [];
    const status = this.done ? (this.incomplete ? 'INCOMPLETE' : (this.pass ? 'PASS' : 'FAIL')) : 'RUNNING ' + Math.min(this.idx + 1, this.matches) + '/' + this.matches;
    lines.push({ t: 'SELFTEST  seed=' + this.seed + '  matches=' + this.matches + '   [' + status + ']', c: this.done ? (this.pass ? '#7cff6b' : '#ff3b5c') : '#ffe94d', s: 16 });
    lines.push({ t: 'elapsed ' + st.elapsed.toFixed(1) + 's   steps ' + st.steps.toLocaleString() + '   speed ' + Math.round(st.stepsPerSec).toLocaleString() + ' steps/s (= ' + Math.round(st.stepsPerSec / 60) + 'x realtime)' });
    lines.push({ t: 'rounds: ' + st.rounds + '  KO ' + st.outcomes.KO + ' / TIMEUP ' + st.outcomes.TIMEUP + ' / DRAW ' + st.outcomes.DRAW + '   avg round ' + Math.round(st.avgRound) + 'F (' + (st.avgRound / 60).toFixed(1) + 's)   max ' + st.maxRound + 'F' });
    lines.push({ t: 'failures: ' + this.failures.length + '   warnings: ' + this.warnings.length + '   data: errors ' + this.vres.errors.length + ' / warnings ' + this.vres.warnings.length + '   matches ended: ' + this.reached + '/' + this.matches });
    const cov = this.chars.map(id => {
      const miss = MOVE_IDS.filter(m => this.coverage[id][m].used === 0);
      return id + ' ' + (10 - miss.length) + '/10' + (miss.length ? ' (' + miss.join(',') + ' 未使用)' : '');
    });
    lines.push({ t: 'per-char coverage:  ' + cov.join('   ') });
    const pw = Object.keys(this.pairWins).map(k => k + ' ' + this.pairWins[k][0] + '-' + this.pairWins[k][1]);
    lines.push({ t: 'per-pair win:  ' + (pw.join('   ') || '-') });
    lines.push({ t: 'determinism: ' + (this.determ.ok === null ? '...' : (this.determ.ok ? 'OK' : 'NG')) + ' (hash ' + (this.determ.a || '-') + (this.determ.ok === false ? ' vs ' + this.determ.b : '') + ')', c: this.determ.ok === false ? '#ff3b5c' : '#e6f1ff' });
    lines.push({ t: 'failures:', c: '#8fa3c8' });
    const fl = this.failures.slice(-5);
    if (!fl.length) lines.push({ t: '  (なし)', c: '#7cff6b' });
    fl.forEach(f => lines.push({ t: '  [m' + f.match + ' f' + f.frame + ' ' + f.check + '] ' + String(f.detail).slice(0, 110), c: '#ff9aa8', s: 12 }));
    if (this.vres.errors.length) { lines.push({ t: 'data errors:', c: '#ff9aa8' }); this.vres.errors.slice(0, 4).forEach(e => lines.push({ t: '  ' + e.slice(0, 118), c: '#ff9aa8', s: 12 })); }
    let y = 28;
    lines.forEach(l => { g.font = (l.s || 14) + 'px ' + FONT_MONO; g.fillStyle = l.c || '#e6f1ff'; g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillText(l.t, 16, y); y += (l.s || 14) + 8; });
    Display.end();
  }
};

/* 静止ポーズ用: 関節から揺れ物の付け根を求めて、重力で落ち着くまで回す */
const _GJ = newJoints();
function poseChains(pup, pose, plant) {
  solveRig(pup.rt, pose, plant, _GJ);
  const a = [0, 0];
  for (let i = 0; i < pup.chains.length; i++) {
    const ch = pup.chains[i], an = ch.def.anchor;
    boneAnchor(_GJ, ch.bone, an.at || 'start', an.x || 0, an.y || 0, a);
    const wx = pup.x + pup.facing * a[0], wy = pup.y + a[1];
    ch.reset(wx, wy, pup.facing);
    for (let k = 0; k < 40; k++) ch.step(wx, wy, pup.facing, 0);
    ch.rx.set(ch.x); ch.ry.set(ch.y);
  }
}

const GAL_STATE_COLS = ['idle', 'crouch', 'jumpUp', 'guardStand', 'hurtHigh', 'down'];
const GAL_FOOT_CHECK = ['idle', 'crouch', 'guardStand', 'guardCrouch', 'landing', 'intro', 'win', 'hurtHigh', 'hurtLow'];
const GAL_LYING = ['down', 'wakeup', 'thrown', 'hurtAir', 'throwHit', 'dashB'];
const Gallery = {
  pups: {}, cells: [], warnCount: 0, raf: false,
  start() {
    const p = HASH.p;
    this.cid = (typeof p.c === 'string' && Game.chars[p.c]) ? p.c : Game.roster[0];
    this.all = !!p.all; this.move = typeof p.move === 'string' ? p.move : null;
    this.p2 = !!p.p2; this.boxes = !!p.boxes || !!this.move; this.grid = !!p.grid; this.joints = !!p.joints;
    this.page = Math.max(1, parseInt(p.page, 10) || 1); this.anim = !!p.anim;
    this.render();
    if (this.anim && !this.raf) { this.raf = true; const loop = () => { if (Game.mode !== 'gallery' || !this.anim) { this.raf = false; return; } this.render(); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  },
  onKey(code) {
    const r = Game.roster;
    if (code === 'ArrowLeft' || code === 'ArrowRight') {
      const i = r.indexOf(this.cid), d = code === 'ArrowLeft' ? -1 : 1;
      this.cid = r[(i + d + r.length) % r.length]; this.page = 1;
    } else if (code === 'ArrowUp') this.page = Math.max(1, this.page - 1);
    else if (code === 'ArrowDown') this.page++;
    else if (code === 'KeyB') this.boxes = !this.boxes;
    else if (code === 'KeyP') this.p2 = !this.p2;
    else if (code === 'KeyJ') this.joints = !this.joints;
    else if (code === 'KeyG') this.grid = !this.grid;
    else return;
    this.render();
  },
  pup(id) {
    const k = id + (this.p2 ? ':2' : ':1');
    if (!this.pups[k]) this.pups[k] = makePreview(id, this.p2);
    return this.pups[k];
  },
  moveClipMap(rt) {
    const map = {};
    MOVE_IDS.forEach(id => { const m = rt.ch.moves[id]; map[m.clip || id] = { id: id, m: m }; });
    return map;
  },
  repTime(rt, name, mm) {
    const cc = rt.clips[name];
    if (mm[name]) return mm[name].m.startup;
    const src = rt.ch.clips[name];
    if (cc.loop) return cc.length / 3;
    let last = 0;
    (src.keys || []).forEach(k => { if (k.f > last) last = k.f; });
    return Math.min(last, cc.length);
  },
  layout(n, W, H) {
    let best = null;
    for (let cols = 3; cols <= 12; cols++) {
      const rows = Math.ceil(n / cols), cw = W / cols, ch = H / rows;
      const sc = Math.min(cw, ch * 0.95);
      if (!best || sc > best.sc) best = { cols: cols, rows: rows, cw: cw, ch: ch, sc: sc };
    }
    const maxRows = Math.max(1, Math.floor(H / 100));
    if (best.rows > maxRows) { best.rows = maxRows; best.ch = H / maxRows; best.cw = W / best.cols; }
    return best;
  },
  warnCell(rt, name, pose, plant, jt) {
    const w = [];
    if (plant < 0.01 && Math.abs(pose[CI.rot]) < 0.01 && GAL_FOOT_CHECK.indexOf(name) >= 0 && Math.abs(jt.soleF - jt.soleB) > 4) w.push('足の高さ差 ' + Math.abs(jt.soleF - jt.soleB).toFixed(1) + 'px');
    if (pose[CI.shinF] < -5 || pose[CI.shinB] < -5) w.push('膝が逆折れ');
    if (pose[CI.farmF] < -5 || pose[CI.farmB] < -5) w.push('肘が逆折れ');
    if (pose[CI.shinF] > 165 || pose[CI.shinB] > 165 || pose[CI.farmF] > 165 || pose[CI.farmB] > 165) w.push('関節角が大きすぎる');
    if (Math.abs(pose[CI.rot]) < 20 && GAL_LYING.indexOf(name) < 0) {
      let top = -1e9, bot = 1e9;
      for (let i = 0; i < 14; i++) { top = Math.max(top, jt.y[i]); bot = Math.min(bot, jt.y[i]); }
      top = Math.max(top, jt.y[J.HEAD] + rt.body.headR);
      const h = top - bot, ratio = h / rt.height;
      if (ratio < 0.5 || ratio > 1.5) w.push('全体高が極端 (' + Math.round(ratio * 100) + '%)');
    }
    return w;
  },
  /* 1セルを描く。x,y,w,h = セルの矩形、t = クリップ時刻 */
  drawCell(ctx, x, y, w, h, rt, clipName, t, label, o) {
    o = o || {};
    const cc = rt.clips[clipName];
    const buf = new Float64Array(NCH);
    const plant = ClipPlayer.sampleAt(rt, clipName, t, buf);
    const jt = newJoints();
    solveRig(rt, buf, plant, jt);
    const warns = this.warnCell(rt, clipName, buf, plant, jt);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = 'rgba(16,12,36,1)'; ctx.fillRect(x, y, w, h);
    const gy = y + h - (o.pad != null ? o.pad : 20);
    const s = o.scale || Math.min(1.2, (w - 6) / 180, (gy - y - 14) / (rt.height * 1.1));
    if (this.grid) {
      ctx.strokeStyle = 'rgba(25,243,255,0.25)'; ctx.lineWidth = 0.5;
      for (let hh = 0; hh <= 200; hh += 50) { ctx.beginPath(); ctx.moveTo(x, gy - hh * s); ctx.lineTo(x + w, gy - hh * s); ctx.stroke(); }
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 2, gy); ctx.lineTo(x + w - 2, gy); ctx.stroke();
    ctx.save();
    ctx.translate(x + w / 2, gy); ctx.scale(s, s);
    const pup = this.pup(rt.id);
    pup.setPos(0, 0, 1, true);
    poseChains(pup, buf, plant);
    pup.flash = 0;
    drawPuppet(ctx, pup, 1, { pose: buf, plant: plant, x: 0, y: 0, facing: 1, scale: [1, 1], noShake: true });
    /* 足元の十字 */
    ctx.strokeStyle = '#ffe94d'; ctx.lineWidth = 1 / s;
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.moveTo(0, -5); ctx.lineTo(0, 5); ctx.stroke();
    if (this.boxes) {
      const bx = (b, col) => { ctx.strokeStyle = col; ctx.lineWidth = 1.5 / s; ctx.strokeRect(b.x, -(b.y + b.h), b.w, b.h); };
      const hb = rt.ch.boxes;
      const mv = o.move;
      const stance = mv ? mv.stance : (/crouch|2L|2H/.test(clipName) ? 'crouch' : (/jump|^j[LH]$|Air/.test(clipName) ? 'air' : 'stand'));
      hb.hurt[stance === 'crouch' ? 'crouch' : (stance === 'air' ? 'air' : 'stand')].forEach(b => bx(b, '#7cff6b'));
      const pd = hb.push[stance === 'crouch' ? 'crouch' : (stance === 'air' ? 'air' : 'stand')];
      bx({ x: -pd.w / 2, y: 0, w: pd.w, h: pd.h }, '#4d7cff');
      if (mv) {
        const n = Math.floor(t) + 1;
        mv.boxes.forEach(b => { if (n >= b.f0 && n <= b.f1) bx(b, '#ff3b5c'); });
        if (mv.throw && n > mv.startup && n <= mv.startup + mv.active) bx(mv.throw.box, '#ffe94d');
      }
    }
    if (this.joints) {
      ctx.fillStyle = '#ff4fa3';
      for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(jt.x[i], -jt.y[i], 2 / s, 0, 6.2832); ctx.fill(); }
      ctx.font = (7 / s) + 'px ' + FONT_MONO; ctx.fillStyle = '#e6f1ff'; ctx.textAlign = 'left';
      [['T', J.NECK, CI.torso], ['uF', J.ELBOW_F, CI.uarmF], ['fF', J.HAND_F, CI.farmF], ['tF', J.KNEE_F, CI.thighF], ['sF', J.ANKLE_F, CI.shinF]].forEach(q => {
        ctx.fillText(q[0] + Math.round(buf[q[2]]), jt.x[q[1]] + 3 / s, -jt.y[q[1]]);
      });
    }
    ctx.restore();
    ctx.font = '9px ' + FONT_MONO; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#b9c7e6'; ctx.fillText(label || (rt.id + ' / ' + clipName), x + 3, y + 2);
    if (warns.length) {
      ctx.strokeStyle = '#ff2d55'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
      ctx.fillStyle = '#ff6b8b'; ctx.font = '8px ' + FONT_JP; ctx.fillText(warns.join(' / '), x + 3, y + 13);
    }
    ctx.restore();
    this.cells.push({ char: rt.id, clip: clipName, t: t, warnings: warns });
    this.warnCount += warns.length ? 1 : 0;
    void cc;
  },
  render() {
    const g = Display.begin();
    this.cells = []; this.warnCount = 0;
    g.fillStyle = '#0a0820'; g.fillRect(0, 0, CFG.W, CFG.H);
    const HEAD = 36, bodyH = CFG.H - HEAD;
    const rt = Game.chars[this.cid];
    let pages = 1;
    if (this.all) {
      const cols = GAL_STATE_COLS.concat(MOVE_IDS);
      const cw = CFG.W / cols.length, rows = Game.roster.length, chh = Math.min(bodyH / rows, 190);
      Game.roster.forEach((id, ri) => {
        const r = Game.chars[id], mm = this.moveClipMap(r);
        cols.forEach((c, ci) => {
          const isMove = MOVE_IDS.indexOf(c) >= 0;
          const clipName = isMove ? (r.ch.moves[c].clip || c) : c;
          const t = isMove ? r.ch.moves[c].startup : this.repTime(r, clipName, mm);
          this.drawCell(g, ci * cw, HEAD + ri * chh, cw, chh, r, clipName, t, ri === 0 ? c : '', { move: isMove ? r.ch.moves[c] : null, pad: 14 });
          if (ci === 0) { g.fillStyle = '#ffe94d'; g.font = '9px ' + FONT_MONO; g.textBaseline = 'top'; g.fillText(id, 3, HEAD + ri * chh + 14); }
        });
      });
    } else if (this.move && rt.ch.moves[this.move]) {
      const m = rt.ch.moves[this.move], cn = m.clip || this.move, total = m.startup + m.active + m.recovery;
      let pre = Math.max(0, m.startup - 3);
      (rt.ch.clips[cn].keys || []).forEach(k => { if (k.f > 0 && k.f < m.startup && k.f > pre - 8) pre = Math.max(pre, k.f); });
      const times = [0, pre, m.startup, m.startup + m.active - 1, m.startup + m.active + Math.floor(m.recovery / 2), total - 1];
      const names = ['f=0', '溜め頂点', '打撃 f=' + m.startup, '持続末', '硬直中央', '最終F'];
      const cw = CFG.W / 3, chh = bodyH / 2;
      times.forEach((t, i) => this.drawCell(g, (i % 3) * cw, HEAD + Math.floor(i / 3) * chh, cw, chh, rt, cn, Math.min(t, rt.clips[cn].length), this.move + ' ' + m.name + '  ' + names[i] + '  t=' + t, { move: m, scale: Math.min(1.6, (chh - 50) / (rt.height * 1.1)), pad: 22 }));
    } else {
      const mm = this.moveClipMap(rt);
      const names = Object.keys(rt.clips);
      const all = REQ_CLIPS.concat(names.filter(n => REQ_CLIPS.indexOf(n) < 0));
      const L = this.layout(all.length, CFG.W, bodyH), per = L.cols * L.rows;
      pages = Math.max(1, Math.ceil(all.length / per));
      this.page = Util.clamp(this.page, 1, pages);
      const t0 = (this.page - 1) * per;
      for (let i = 0; i < per && t0 + i < all.length; i++) {
        const cn = all[t0 + i];
        const t = this.anim ? ((Game.t * 60) % rt.clips[cn].length) : this.repTime(rt, cn, mm);
        const isMove = !!mm[cn];
        this.drawCell(g, (i % L.cols) * L.cw, HEAD + Math.floor(i / L.cols) * L.ch, L.cw, L.ch, rt, cn, t, cn + (isMove ? ' *' : ''), { move: isMove ? mm[cn].m : null });
      }
    }
    g.fillStyle = '#0a0820'; g.fillRect(0, 0, CFG.W, HEAD);
    g.font = '13px ' + FONT_MONO; g.fillStyle = '#e6f1ff'; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText('GALLERY  c=' + this.cid + (this.all ? '  [all]' : '') + (this.move ? '  move=' + this.move : '') + '  page ' + this.page + '/' + pages + (this.p2 ? '  P2' : ''), 10, 12);
    g.fillStyle = '#8fa3c8'; g.font = '10px ' + FONT_MONO;
    g.fillText('←→ キャラ  ↑↓ ページ  B 判定  P P2配色  J 関節  G グリッド', 10, 27);
    g.textAlign = 'right';
    g.fillStyle = this.warnCount ? '#ff6b8b' : '#7cff6b'; g.font = 'bold 13px ' + FONT_MONO;
    g.fillText('警告 ' + this.warnCount + ' / セル ' + this.cells.length, CFG.W - 10, 18);
    Display.end();
    window.__gallery = { cells: this.cells, warnings: this.warnCount, char: this.cid };
    document.title = 'GALLERY ' + this.cid + ' warnings=' + this.warnCount;
  }
};

const Debug = {

  /* 判定の枠。nice = 練習用（半透明の塗り＋枠）: 緑=やられ / 赤=攻撃 / 黄=投げ / 橙=飛び道具 / 青=押し合い */

      const pd = f.pushDims();

      const ab = f.attackBoxes();

  legend(ctx) {

    let x = 300;

    for (const [t, c] of L) { ctx.fillStyle = rgba(c, 0.35); ctx.fillRect(x, 481, 10, 10); ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.strokeRect(x, 481, 10, 10); drawText(ctx, t, x + 14, 486, { size: 11, color: '#e6f1ff', base: 'middle' }); x += 14 + t.length * 11 + 16; }
  },
  hud(ctx, m) {
