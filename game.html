    Player.reset(Game.D); Score.reset(); Boss.off(); Stage.build();
    this.sub = "READY"; this.subT = 0; this.t = 0; this.paused = false; this.banners = []; this.dlg = null; this.cutin = null;
    this.noMiss = true; this.slowT = 0; this.tally = null; this.spellName = null; this.bgT = 0;
    Player.y = 690; Player.invuln = 99;
    this.addBanner(bannerText("ready", "祓 開始"), { dur: 1.5, size: 44, y: 280, color: "#f4f7ff" });
  },
  exit() { Emitters.reset(); },
  addBanner(text, o) { o = o || {}; this.banners.push({ text, t: 0, dur: o.dur || 2, size: o.size || 30, y: o.y || 280, color: o.color || "#f4f7ff" }); },
  autoPause() { if (!this.paused && this.sub !== "GAME_OVER" && SM.cur === this) { this.paused = true; this.sel = 0; } },
  onSpellDeclare(name) {
    this.cutin = { name, t: 0 }; this.spellName = name; AudioEngine.play("spellDeclare");
  },
  startWarning() {
    this.sub = "BOSS_WARNING"; this.subT = 0;
    Emitters.reset(); Enemies.clearAll(); Bullets.clearAll(false, true);
    AudioEngine.play("warning");
  },
  startBossIntro() {
    const def = Game.data.bosses[Stage.boss];
    Boss.init(def); this.sub = "BOSS_INTRO"; this.subT = 0; this.dlg = null;
    if (Player.power < 50) Player.power = 50;
  },
  startDialogue(id, next) {
    const lines = Game.data.dialogues[id] || [];
    this.dlg = lines.length ? { lines, i: 0, t: 0, next } : null;
    if (!this.dlg) next();
  },
  onBossDefeated() { this.startDefeat(); },
  startDefeat() {
    this.sub = "BOSS_DEFEAT"; this.subT = 0; this.slowT = 0;
    Emitters.reset(); Bullets.clearAll(true, true);
    Items.collectAll = true;
    Score.add(Boss.def.score || 0, "kill");
    FX.killBurst(Boss.x, Boss.y, Boss.color); FX.ring(Boss.x, Boss.y, "white", 220, 1.2); FX.doShake(0.4);
    this.addBanner(bannerText("purify", "浄化完了"), { dur: 2.6, size: 52, y: 250, color: "#bfeaff" });
    AudioEngine.play("purify");
  },
  startClear() {
    this.sub = "STAGE_CLEAR"; this.subT = 0; this.dlg = null;
    const D = Game.D, items = [];
    const lifeB = Score.add(Player.lives * 20000, "clear"); items.push(["残機ボーナス  x" + Player.lives, lifeB]);
    const bombB = Score.add(Player.bombs * 5000, "clear"); items.push(["ボムボーナス  x" + Player.bombs, bombB]);
    if (this.noMiss) items.push(["ノーミスボーナス", Score.add(50000, "clear")]); else items.push(["ノーミスボーナス", 0]);
    this.tally = items;
    this.addBanner(bannerText("clear", "STAGE CLEAR"), { dur: 3, size: 40, y: 150, color: "#ffd24a" });
  },
  startGameOver() {
    this.sub = "GAME_OVER"; this.subT = 0;
    Emitters.reset(); Bullets.clearAll(false, true); FX.doGlitch(); this.dlg = null;
    this.addBanner(bannerText("gameover", "GAME OVER"), { dur: 1.5, size: 50, y: 280, color: COL_WARN });
  },
  finish(cleared) {
    const res = { score: Score.score, diff: this.diff, cleared, bd: Object.assign({}, Score.bd), graze: Score.graze,
                  noMiss: this.noMiss, spells: { got: Score.spells.got, total: Score.spells.total } };
    SM.change("result", res);
  },
  update(dt0) {
    if (this.paused) { this.updatePause(); return; }
    if (Input.wasPressed("pause") && this.sub !== "GAME_OVER" && this.subT > 0.1) { this.paused = true; this.sel = 0; AudioEngine.play("pause"); return; }
    const slow = this.sub === "BOSS_DEFEAT" && this.slowT < 1.0;
    const dt = dt0 * (slow ? 0.6 : 1);
    if (this.sub === "BOSS_DEFEAT") this.slowT += dt0;
    this.t += dt; this.subT += dt0; this.bgT += dt;
    const sub = this.sub;
    const ctl = { move: sub !== "READY" && sub !== "GAME_OVER", shoot: sub === "STAGE" || sub === "BOSS_WARNING" || sub === "BOSS_INTRO" || sub === "BOSS_FIGHT",
                  bomb: sub === "STAGE" || sub === "BOSS_FIGHT" };
    // READY: ship flies in
    if (sub === "READY") {
      Player.y = Util.lerp(690, CONFIG.player.y0, Util.smooth(this.subT / 1.2));
      if (this.subT >= 1.5) { Player.invuln = 0.5; if (DEBUG.boss) this.startWarning(); else { this.sub = "STAGE"; this.subT = 0; } }
    }
    Player.update(dt, ctl);
    // stage / boss flow
    if (this.sub === "STAGE") { Stage.update(dt); if (Stage.ready) this.startWarning(); }
    else if (this.sub === "BOSS_WARNING") { if (this.subT >= 2.5) this.startBossIntro(); }
    else if (this.sub === "BOSS_INTRO") this.updateIntro(dt0);
    else if (this.sub === "BOSS_FIGHT") Boss.update(dt);
    else if (this.sub === "BOSS_DEFEAT") this.updateDefeat(dt0);
    else if (this.sub === "STAGE_CLEAR") {
      if (this.subT >= 3.0 || (this.subT > 0.6 && Input.wasPressed("ok"))) { this.finish(true); return; }
    } else if (this.sub === "GAME_OVER") { if (this.subT >= 1.5) { this.finish(false); return; } }
    // world
    Enemies.update(dt); Emitters.update(dt); Bullets.update(dt); Shots.update(dt); Items.update(dt);
    if (Boss.active) { if (this.sub !== "BOSS_FIGHT") Boss.anim += dt; }
    if (Player.bombActive) {
      Bullets.clearInRadius(Player.x, Player.y, CONFIG.bomb.ringR * Math.min(1, Player.bombE / CONFIG.bomb.ringTime));
      const ep = Enemies.pool;
      for (let i = ep.n - 1; i >= 0; i--) { const e = ep.items[i]; if (!e.dead && e.y >= 8) Enemies.damage(e, CONFIG.bomb.enemyDps * dt); }
      if (Boss.canDamage()) Boss.damage(CONFIG.bomb.bossDps * dt);
    }
    this.collide();
    FX.update(dt0);
    for (let i = this.banners.length - 1; i >= 0; i--) { this.banners[i].t += dt0; if (this.banners[i].t >= this.banners[i].dur) this.banners.splice(i, 1); }
    if (this.cutin) { this.cutin.t += dt0; if (this.cutin.t > 1.6) this.cutin = null; }
    if (this.dlg) this.updateDialogue(dt0);
    if (Player.state === "DEAD" && this.sub !== "GAME_OVER") this.startGameOver();
  },
  updateIntro(dt0) {
    const def = Boss.def, en = def.entry;
    if (this.dlg) return;
    if (Boss.state === "ENTER") {
      const k = Util.smooth(this.subT / Math.max(0.1, en.time));
      Boss.x = Util.lerp(240, en.x, k); Boss.y = Util.lerp(-60, en.y, k);
      if (this.subT >= en.time) {
        Boss.x = en.x; Boss.y = en.y; Boss.state = "WAIT";
        this.startDialogue(def.introDialogue, () => { this.dlg = null; this.sub = "BOSS_FIGHT"; this.subT = 0; Boss.startPhase(0); });
      }
    }
  },
  updateDefeat(dt0) {
    if (this.subT < 1.0) {
      if (((this.subT * 20) | 0) % 2 === 0 && rng() < 0.5) FX.burst(Boss.x + Util.rand(-30, 30), Boss.y + Util.rand(-30, 30), Boss.color, 3);
    } else if (Boss.active && Boss.state !== "OFF") {
      Boss.active = false; FX.doFlash("#ffffff", 1); FX.killBurst(Boss.x, Boss.y, "white"); FX.ring(Boss.x, Boss.y, "gold", 300, 1.0);
    }
    if (this.subT >= 1.8 && !this.dlg && !this.defDlgStarted) {
      this.defDlgStarted = true;
      this.startDialogue(Boss.def ? Boss.def.defeatDialogue : null, () => { this.dlg = null; this.defDlgStarted = false; this.startClear(); });
    }
    if (this.subT < 1.8) this.defDlgStarted = false;
  },
  updateDialogue(dt0) {
    const d = this.dlg; d.t += dt0;
    if ((Input.wasPressed("ok") && d.t > 0.25) || d.t >= 2.5) {
      d.i++; d.t = 0;
      if (d.i >= d.lines.length) { const n = d.next; this.dlg = null; n(); }
    }
  },
  collide() {
    const P = Player, D = Game.D;
    // shots
    const sp = Shots.pool, en = Enemies.pool;
    for (let i = sp.n - 1; i >= 0; i--) {
      const s = sp.items[i]; let hit = false;
      for (let j = en.n - 1; j >= 0; j--) {
        const e = en.items[j]; if (e.dead || e.y < 8) continue;
        const dx = s.x - e.x, dy = s.y - e.y, rr = e.r + 4;
        if (dx * dx + dy * dy < rr * rr) { Enemies.damage(e, s.dmg); Score.add(5, "other"); hit = true; break; }
      }
      if (!hit && Boss.absorbs()) {
        const dx = s.x - Boss.x, dy = s.y - Boss.y, rr = Boss.r + 4;
        if (dx * dx + dy * dy < rr * rr) {
          hit = true;
          if (Boss.canDamage()) { Boss.damage(s.dmg); Score.add(5, "other"); }
        }
      }
      if (hit) sp.release(i);
    }
    // bullets vs player
    if (P.state === "ALIVE") {
      const bp = Bullets.pool, px = P.x, py = P.y, vul = P.invuln <= 0;
      for (let i = bp.n - 1; i >= 0; i--) {
        const b = bp.items[i], dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;
        const hr = D.hitR + b.hitR;
        if (vul && d2 < hr * hr) { P.hit(); break; }
        if (!b.grazed) {
          const gr = D.grazeR + b.hitR;
          if (d2 < gr * gr) {
            b.grazed = true; Score.graze++; Score.add(50, "graze"); AudioEngine.play("graze");
            if ((Score.graze & 1) === 0) FX.spark(px + dx * 0.5, py + dy * 0.5);
          }
        }
      }
    }
  },
  updatePause() {
    const m = menuMove();
    if (m) { this.sel = (this.sel + m + 3) % 3; AudioEngine.play("menuMove"); }
    if (Input.wasPressed("pause") || (Input.wasPressed("cancel") && this.sel === 0)) { this.paused = false; AudioEngine.play("pause"); return; }
    if (Input.wasPressed("ok")) {
      AudioEngine.play("menuOk");
      if (this.sel === 0) this.paused = false;
      else if (this.sel === 1) SM.change("play", { diff: this.diff });
      else SM.change("title");
    }
  },
  /* ---- render ---- */
  render() {
    const boss = Boss.active, hurry = boss && Boss.state === "ACTIVE" && Boss.timeLeft <= 5;
    const pulse = hurry ? (0.5 + 0.5 * Math.sin(this.t * 8)) : 0;
    ctx.save();
    if (FX.shake > 0) ctx.translate((rng() - 0.5) * 8 * Math.min(1, FX.shake * 5), (rng() - 0.5) * 8 * Math.min(1, FX.shake * 5));
    Background.draw(this.bgT, boss ? colorOf(Boss.color) : null, pulse);
    Enemies.draw(); Boss.draw(); Items.draw(); Shots.draw();
    Player.drawBomb(); Player.draw();
    Bullets.draw(); FX.draw();
    Player.drawHitbox();
    ctx.restore();
    this.drawHUD();
    this.drawOverlays();
    FX.glitchPass();
    if (FX.flash > 0) { ctx.globalAlpha = FX.flash * 0.7; ctx.fillStyle = FX.flashCol; ctx.fillRect(0, 0, 480, 640); ctx.globalAlpha = 1; }
    Background.overlay();
    if (this.paused) this.drawPause();
    if (DEBUG.on) {
      drawText("FPS " + Main.fps + "  bullets " + Bullets.pool.n + "  enemies " + Enemies.pool.n + "  sub " + this.sub, 6, 70, { size: 11, color: "#00ff88" });
    }
  },
  drawHUD() {
    const S = Score, D = Game.D;
    ctx.fillStyle = "rgba(5,6,15,0.55)"; ctx.fillRect(0, 0, 480, 28); ctx.fillRect(0, 612, 480, 28);
    drawText("SCORE " + pad9(S.score), 8, 14, { size: 14, font: "num", color: "#f4f7ff" });
    drawText("HI " + pad9(S.hi()), 270, 14, { size: 13, font: "num", color: COL_SUB });
    drawText(D.label, 472, 14, { size: 13, color: Game.diff === "oni" ? COL_RED : "#19f3ff", align: "right" });
    // bottom
    drawText("残機", 8, 626, { size: 12, color: COL_SUB });
    for (let i = 0; i < Player.lives; i++) { ctx.fillStyle = "#ff3b5c"; ctx.beginPath(); const x = 44 + i * 13; ctx.moveTo(x, 619); ctx.lineTo(x + 5, 626); ctx.lineTo(x, 633); ctx.lineTo(x - 5, 626); ctx.closePath(); ctx.fill(); }
    drawText("ボム", 140, 626, { size: 12, color: COL_SUB });
    for (let i = 0; i < Player.bombs; i++) { ctx.fillStyle = "#19f3ff"; ctx.beginPath(); ctx.arc(176 + i * 14, 626, 5, 0, TAU); ctx.fill(); }
    drawText("POWER Lv" + Player.level + (Player.power >= 100 ? " MAX" : ""), 248, 626, { size: 12, font: "num", color: "#ffd24a" });
    drawText("GRAZE " + S.graze, 472, 626, { size: 12, font: "num", color: "#7cff6b", align: "right" });
    // boss
    if (Boss.active && Boss.p && Boss.state !== "ENTER" && Boss.state !== "WAIT") {
      const col = colorOf(Boss.color), r = Boss.hpRatio();
      ctx.fillStyle = "rgba(255,255,255,0.12)"; ctx.fillRect(40, 34, 400, 6);
      ctx.fillStyle = col; ctx.fillRect(40, 34, 400 * r, 6);
      for (let i = 0; i < Boss.def.phases.length - Boss.phaseIdx - 1; i++) {
        ctx.fillStyle = "#ffd24a"; const x = 40 + i * 12; ctx.beginPath(); ctx.moveTo(x + 4, 43); ctx.lineTo(x + 8, 48); ctx.lineTo(x + 4, 53); ctx.lineTo(x, 48); ctx.closePath(); ctx.fill();
      }
      if (Boss.p.name) drawText(Boss.p.name, 440, 58, { size: 15, color: "#f4f7ff", align: "right", glow: 3, glowColor: col });
      const tl = Math.max(0, Math.ceil(Boss.timeLeft));
      drawText(String(Boss.state === "INTRO" ? Math.ceil(Boss.limit) : tl), 40, 62, { size: 22, font: "num", bold: true, color: Boss.timeLeft <= 5 && Boss.state === "ACTIVE" ? COL_WARN : "#f4f7ff" });
    }
  },
  drawOverlays() {
    // warning
    if (this.sub === "BOSS_WARNING") {
      const on = blink(this.subT, 3);
      ctx.fillStyle = "rgba(255,45,85," + (on ? 0.35 : 0.15) + ")"; ctx.fillRect(0, 220, 480, 36); ctx.fillRect(0, 332, 480, 36);
      ctx.fillStyle = "rgba(255,45,85,0.9)";
      for (let x = -((this.subT * 120) % 40); x < 480; x += 40) { ctx.fillRect(x, 224, 20, 4); ctx.fillRect(x, 360, 20, 4); }
      if (on) drawText(bannerText("warning", "WARNING"), 240, 294, { size: 56, font: "num", bold: true, align: "center", color: COL_WARN, glow: 8 });
    }
    // banners
    for (const b of this.banners) {
      const a = Math.min(1, b.t / 0.2, (b.dur - b.t) / 0.3), sc = 1 + (1 - Math.min(1, b.t / 0.2)) * 0.4;
      ctx.save(); ctx.translate(240, b.y); ctx.scale(sc, sc);
      drawText(b.text, 0, 0, { size: b.size, align: "center", color: b.color, alpha: Math.max(0, a), glow: 6, maxW: 460 });
      ctx.restore();
    }
    // spell cut-in
    if (this.cutin) {
      const t = this.cutin.t, a = Math.min(1, t / 0.2, (1.6 - t) / 0.3), x = Util.lerp(480, 0, Util.smooth(t / 0.35));
      ctx.globalAlpha = Math.max(0, a) * 0.85; ctx.fillStyle = "#05060f"; ctx.fillRect(0, 150, 480, 46);
      ctx.fillStyle = colorOf(Boss.color); ctx.fillRect(0, 150, 480, 2); ctx.fillRect(0, 194, 480, 2); ctx.globalAlpha = 1;
      drawText(this.cutin.name, 240 + x, 173, { size: 24, align: "center", color: "#f4f7ff", alpha: Math.max(0, a), glow: 5, glowColor: colorOf(Boss.color), maxW: 450 });
    }
    // tally
    if (this.sub === "STAGE_CLEAR" && this.tally) {
      ctx.fillStyle = "rgba(5,6,15,0.7)"; rrect(60, 200, 360, 190, 10); ctx.fill();
      this.tally.forEach((r, i) => {
        const a = Util.clamp((this.subT - 0.3 - i * 0.4) / 0.3, 0, 1);
        drawText(r[0], 90, 235 + i * 36, { size: 16, alpha: a });
        drawText("+" + commas(r[1]), 390, 235 + i * 36, { size: 18, font: "num", color: "#ffd24a", align: "right", alpha: a });
      });
      drawText("SCORE " + pad9(Score.score), 240, 360, { size: 20, font: "num", align: "center", alpha: Util.clamp((this.subT - 1.5) / 0.3, 0, 1) });
    }
    // dialogue
    if (this.dlg) this.drawDialogue();
  },
  drawDialogue() {
    const d = this.dlg, l = d.lines[d.i]; if (!l) return;
    const miko = l.who === "miko", col = miko ? "#19f3ff" : colorOf(Boss.active ? Boss.color : "pink");
    const x = 20, y = 470, w = 440, h = 100;
    ctx.fillStyle = "rgba(5,6,20,0.88)"; rrect(x, y, w, h, 10); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    // tail
    ctx.fillStyle = "rgba(5,6,20,0.88)"; ctx.beginPath();
    const tx = miko ? 70 : 410; ctx.moveTo(tx - 10, y); ctx.lineTo(tx, y - 14); ctx.lineTo(tx + 10, y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(tx - 10, y); ctx.lineTo(tx, y - 14); ctx.lineTo(tx + 10, y); ctx.stroke();
    drawText(miko ? "電脳巫女" : (Boss.def ? Boss.def.name : "???"), miko ? x + 14 : x + w - 14, y + 18, { size: 14, color: col, align: miko ? "left" : "right", maxW: 300 });
    wrapText(l.text, 400, 20).forEach((ln, i) => drawText(ln, x + 20, y + 52 + i * 26, { size: 20, color: "#f4f7ff" }));
    if (blink(this.subT, 2.5)) drawText("Z ▶", x + w - 14, y + h - 14, { size: 12, color: COL_SUB, align: "right", font: "num" });
  },
  drawPause() {
    ctx.fillStyle = "rgba(5,6,15,0.72)"; ctx.fillRect(0, 0, 480, 640);
    drawText("PAUSE", 240, 200, { size: 44, font: "num", bold: true, align: "center", glow: 7, glowColor: COL_RED });
    ["再開", "最初から", "タイトルへ"].forEach((s, i) => {
      const on = i === this.sel;
      drawText((on ? "▶ " : "   ") + s, 240, 290 + i * 50, { size: 26, align: "center", color: on ? "#f4f7ff" : COL_SUB, glow: on ? 4 : 0, glowColor: "#19f3ff" });
    });
    drawText("↑↓ 選択   Z 決定   Esc 再開", 240, 520, { size: 14, align: "center", color: COL_SUB });
  }
};

/* ---- Self test (#selftest) ------------------------------------------
 * 描画ループに頼らず、60Hz の固定ステップで1プレイを自動操縦して結果を表示する。
 * god: 無敵でボス撃破まで通す / normal: 被弾ありで最後まで通す */
const SelfTest = {
  lines: [],
  sim(diff, god, maxSec) {
    const R = { diff, god, subs: [], maxBullets: 0, maxEnemies: 0, err: null, score: 0, end: "timeout", t: 0,
                worstMs: 0, lives: 0, rank: "", renderErr: null };
    const step = 1 / 60;
    SM.change("play", { diff });
    let last = "", i = 0;
    try {
      for (; i < maxSec * 60; i++) {
        Input.down = { KeyZ: true };
        // 自動操縦: 左右にゆっくり往復し、ときどき上下にも動く
        const ph = Math.floor(i / 90) % 4;
        if (ph === 0) Input.down.ArrowLeft = true; else if (ph === 2) Input.down.ArrowRight = true;
        if (Math.floor(i / 400) % 2) Input.down.ArrowUp = (i % 120) < 20; else Input.down.ArrowDown = (i % 120) < 20;
        if (god) Player.invuln = 99;
        const t0 = performance.now();
        SM.cur.age += step; SM.cur.update(step); Input.endFrame();
        const ms = performance.now() - t0; if (i > 120 && ms > R.worstMs) R.worstMs = ms;
        if (SM.cur !== Play) { R.end = SM.cur.name; break; }
        if (Play.sub !== last) { last = Play.sub; R.subs.push(last + "@" + (i / 60).toFixed(1)); }
        R.maxBullets = Math.max(R.maxBullets, Bullets.pool.n); R.maxEnemies = Math.max(R.maxEnemies, Enemies.pool.n);
        if (i % 37 === 0) {
          try { ctx.save(); SM.cur.render(); ctx.restore(); } catch (e) { if (!R.renderErr) R.renderErr = String(e && e.stack || e); ctx.restore(); }
        }
      }
    } catch (e) { R.err = String(e && e.stack || e); }
    R.t = i / 60; R.score = Score.score; R.lives = Player.lives;
    if (SM.cur === ResultScene && ResultScene.rank) R.rank = ResultScene.rank.label;
    Input.clearAll();
    return R;
  },
  run() {
    const out = [];
    const runs = [["easy", true, 400], ["oni", true, 400], ["easy", false, 400], ["oni", false, 400]];
    for (const r of runs) {
      const R = this.sim(r[0], r[1], r[2]);
      out.push(R);
      console.log("[SELFTEST]", JSON.stringify(R));
    }
    this.lines = [];
    out.forEach(R => {
      this.lines.push({ c: R.err || R.renderErr ? "#ff8fa3" : "#7cff6b",
        s: "[" + R.diff + (R.god ? " 無敵" : " 通常") + "] 終了=" + R.end + "  " + R.t.toFixed(1) + "s  score=" + R.score + "  残機=" + R.lives + "  運勢=" + R.rank });
      this.lines.push({ c: "#e6f1ff", s: "  最大弾数=" + R.maxBullets + "  最大敵数=" + R.maxEnemies + "  1ステップ最大=" + R.worstMs.toFixed(2) + "ms" });
      this.lines.push({ c: "#8fa3c8", s: "  " + R.subs.join(" > ") });
      if (R.err) this.lines.push({ c: "#ff8fa3", s: "  ERROR " + R.err.split("\n").slice(0, 2).join(" | ") });
      if (R.renderErr) this.lines.push({ c: "#ff8fa3", s: "  RENDER " + R.renderErr.split("\n").slice(0, 2).join(" | ") });
    });
    SM.change("selftest");
  }
};
const SelfTestScene = {
  enter() {}, update() {},
  render() {
    ctx.fillStyle = "#05060f"; ctx.fillRect(0, 0, 480, 640);
    drawText("SELF TEST", 240, 24, { size: 20, align: "center", font: "num", color: "#ffd24a" });
    let y = 52;
    for (const l of SelfTest.lines) {
      for (const ln of wrapText(l.s, 464, 11)) { if (y > 632) break; drawText(ln, 8, y, { size: 11, color: l.c }); y += 14; }
    }
  }
};

SM.scenes = { selftest: SelfTestScene, error: ErrorScene, boot: BootScene, title: TitleScene, difficulty: DifficultyScene, play: Play,
              result: ResultScene, name: NameEntryScene, ranking: RankingScene };

/* =====================================================================
 * Main
 * ===================================================================== */
const Main = {
  last: 0, fps: 0, fpsN: 0, fpsT: 0, crash: null, resizeTimer: 0, toastMute: 0,
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3), w = window.innerWidth, h = window.innerHeight;
    view.dpr = dpr; view.s = Math.min(w / CONFIG.W, h / CONFIG.H);
    view.ox = (w - CONFIG.W * view.s) / 2; view.oy = (h - CONFIG.H * view.s) / 2;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px"; canvas.style.height = h + "px";
  },
  frame(now) {
    requestAnimationFrame(Main.frame);
    let dt = (now - Main.last) / 1000; Main.last = now;
    if (!(dt > 0)) dt = 0; dt = Math.min(dt, 1 / 30);
    Main.fpsN++; Main.fpsT += dt;
    if (Main.fpsT >= 0.5) { Main.fps = Math.round(Main.fpsN / Main.fpsT); Main.fpsN = 0; Main.fpsT = 0; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#05060f"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (Main.crash) {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.fillStyle = "#ff8fa3"; ctx.font = "14px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
      String(Main.crash).split("\n").slice(0, 30).forEach((l, i) => ctx.fillText(l.slice(0, 120), 10, 10 + i * 18));
      return;
    }
    try {
      SM.cur.age += dt;
      SM.cur.update(dt);
      Input.endFrame();
      const k = view.dpr * view.s;
      ctx.setTransform(k, 0, 0, k, view.ox * view.dpr, view.oy * view.dpr);
      ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CONFIG.W, CONFIG.H); ctx.clip();
      SM.cur.render();
      if (SM.cur.age < 0.25) { ctx.globalAlpha = 1 - SM.cur.age / 0.25; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 480, 640); ctx.globalAlpha = 1; }
      if (Game.muted) drawText("MUTE", 472, 40, { size: 10, font: "num", color: COL_SUB, align: "right" });
      if (DEBUG.on && SM.cur !== Play) drawText("FPS " + Main.fps, 472, 632, { size: 10, font: "num", color: "#00ff88", align: "right" });
      ctx.restore();
    } catch (e) {
      console.error(e); Main.crash = "ERROR: " + (e && e.stack || e);
    }
  },
  start() {
    canvas.addEventListener("contextmenu", e => e.preventDefault());
    window.addEventListener("contextmenu", e => e.preventDefault());
    window.addEventListener("keydown", e => {
      Input.onKeyDown(e);
      if (!e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const capturing = SM.cur === NameEntryScene;
        if (e.code === "KeyM" && !capturing) { AudioEngine.setMute(!AudioEngine.isMuted()); }
        else if (e.code === "KeyF" && !capturing) {
          try {
            if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
          } catch (err) {}
        }
      }
      AudioEngine.init();
    });
    window.addEventListener("keyup", e => Input.onKeyUp(e));
    window.addEventListener("blur", () => { Input.clearAll(); if (SM.cur && SM.cur.autoPause) SM.cur.autoPause(); });
    document.addEventListener("visibilitychange", () => { if (document.hidden) { Input.clearAll(); if (SM.cur && SM.cur.autoPause) SM.cur.autoPause(); } });
    window.addEventListener("resize", () => { clearTimeout(Main.resizeTimer); Main.resizeTimer = setTimeout(() => Main.resize(), 100); });
    Main.resize();
    canvas.tabIndex = 0;
    try { canvas.focus(); } catch (e) {}
    // data validation
    Game.data = window.GAME_DATA;
    Game.warnings = validateGameData(Game.data);
    Game.warnings.forEach(w => (w.level === "error" ? console.error : console.warn)("[GAME_DATA] " + w.msg));
    const fatal = Game.warnings.some(w => w.level === "error");
    FX.init(); Bullets.init(); Shots.init(); Items.init(); Enemies.init();
    SpriteCache.warm(); Background.init(); RankingStore.load();
    if (fatal) SM.change("error", { errors: Game.warnings });
    else if (HASH.indexOf("selftest") >= 0) SelfTest.run();
    else SM.change("boot");
    Main.last = performance.now();
    requestAnimationFrame(Main.frame);
  }
};

// fonts: wait up to 1.5s, continue with fallback on failure
(function boot() {
  let started = false;
  const go = () => { if (started) return; started = true; Main.start(); };
  try {
    if (document.fonts && document.fonts.load) {
      Promise.race([
        Promise.all([document.fonts.load('16px "DotGothic16"', "電脳巫女弾幕祓"), document.fonts.load('16px "Orbitron"', "0123456789")]),
        new Promise(r => setTimeout(r, 1500))
      ]).then(go, go);
      setTimeout(go, 1700);
    } else go();
  } catch (e) { go(); }
})();

if (DEBUG.on) window.__dbg = { Game, Player, Boss, Bullets, Enemies, Stage, Play, Score, SM, Input, validateGameData, RankingStore, Omikuji, Emitters };
})();
</script>
